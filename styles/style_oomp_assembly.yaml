component.pad:
  color: "#FFFFFF"
  stroke: "#000000"
  stroke_width: 0.6

component.exposed_pad:
  color: "#FFFFFF"
  stroke: "#000000"
  stroke_width: 0.55

component.pin_one:
  color: "#FFFFFF"
  stroke: "#000000"
  stroke_width: 0.55

component.pin_one_line:
  color: "#000000"
  stroke: "#000000"
  stroke_width: 0.35

component.lens:
  color: "#FFFFFF"
  stroke: "#000000"
