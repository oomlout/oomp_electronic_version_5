meta:
  name: OOMP Component Diagrams
  description: Clear monochrome component drawings for SVG and PNG output.

background:
  color: "#FFFFFF"
  stroke: "none"
  stroke_width: 0

canvas.transparent:
  color: "none"
  stroke: "none"
  stroke_width: 0

component.body:
  color: "#FFFFFF"
  stroke: "#000000"
  stroke_width: 0.8

component.body_dark:
  color: "#FFFFFF"
  stroke: "#000000"
  stroke_width: 0.8

component.body_warm:
  color: "#FFFFFF"
  stroke: "#000000"
  stroke_width: 0.8

component.terminal:
  color: "#FFFFFF"
  stroke: "#000000"
  stroke_width: 0.6

component.pad:
  color: "#FFFFFF"
  stroke: "#000000"
  stroke_width: 0.6

component.exposed_pad:
  color: "#FFFFFF"
  stroke: "#000000"
  stroke_width: 0.55

component.pin_one:
  color: "#FFFFFF"
  stroke: "#000000"
  stroke_width: 0.55

component.pin_one_line:
  color: "#000000"
  stroke: "#000000"
  stroke_width: 0.35

component.lens:
  color: "#FFFFFF"
  stroke: "#000000"
  stroke_width: 0.55

component.screen:
  color: "#FFFFFF"
  stroke: "#000000"
  stroke_width: 0.55

component.hole:
  color: "#FFFFFF"
  stroke: "#000000"
  stroke_width: 0.25

component.pin:
  # The framework's line primitive uses color as its stroke color.
  color: "#000000"
  stroke: "#000000"
  stroke_width: 0.8

label:
  color: "#000000"
  stroke: "none"
  stroke_width: 0
  font: "Arial, sans-serif"
  size: 4.0
  halign: center
  valign: center

label.part_id:
  size: 6.0
  font_weight: bold

label.code:
  size: 4.0
  font: "Consolas, monospace"
  font_weight: bold

label.word:
  size: 3.2
  font: "Consolas, monospace"

label.name:
  size: 3.6
  font_weight: bold

label.summary_code:
  size: 3.6
  font: "Consolas, monospace"
  font_weight: bold

label.summary_words:
  size: 2.8
  font: "Consolas, monospace"

label.pin:
  size: 2.8
  font: "Arial, sans-serif"

dimension.line:
  # The framework's line primitive uses color as its stroke color.
  color: "#000000"
  stroke: "#000000"
  stroke_width: 0.45

label.dimension:
  size: 3.0
  font: "Arial, sans-serif"
