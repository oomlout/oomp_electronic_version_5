  - board: esp32
    board_name: ESP32
    board_url: https://github.com/Hanqaqa/Easyduino/tree/master/ESP32
    version: current
    git_ref: master
    project_file_folder: ESP32
    project_file_basename: Easyduino_ESP32
    project_file_path: ESP32/Easyduino_ESP32
    match_blocked:
      U1: BOM C6568, upstream PDF and README identify CP2102-GMR, but the actual schematic
        symbol is CP2102N-Axx-xQFN28. CP2102-GMR has been added to OOMP; confirm which
        chip is intended before accepting a match.
      U4: 'ESP32-DevKitC is a combined 38-pad carrier/header footprint, not an additional
        DevKit board: the source photo shows two 19-pin male headers. Both headers
        already exist as electronic_connector_header_2_54_mm_pitch_through_hole_19_pin,
        but a one-footprint-to-two-parts mapping needs confirmation. Do not buy another
        DevKitC.'
    review_notes:
    - 'J1: C2765186 and the supplied USBC.pdf identify SHOU HAN TYPE-C 16PIN 2MD(073),
      while the footprint is named G-Switch GT-USB-7010ASV. OOMP follows the BOM/PDF
      identity; the original footprint remains unchanged pending land-pattern verification.'
    - 'D1: C7074 is Littelfuse SP0503BAHTG. The upstream ESD_Protection.pdf is TECH
      PUBLIC, so OOMP uses the downloaded Littelfuse datasheet instead.'
    - 'C5/C7/C8: C11366 is AVX TAJA226K010RNJ, 22uF 10V, A-case 3216-18. The upstream
      Kemet-I footprint name specifies a lower 1.0mm body; verify clearance for the
      actual 1.8mm capacitor.'
    - 'SW1/SW2: C720477 is XUNPU TS-1088-AR02016, not Alps. The original Alps_SKRK
      footprint is retained; exact master compatibility has not been certified.'
    sparse_checkout: true
