  research_notes:
  - 'The official JLC page lists Basic Texas Instruments NE5532DR (C7426): dual low-noise op-amp in SOIC-8; reconfirmed live
    2026-10-02 (stock 221,644). The queue snapshot for this code was degraded (empty MPN/maker) - the intake record is the
    identity authority.'
  - Browser-downloaded the TI NE5532x/SA5532x datasheet (23 pages, Rev. K) from the page's ti.com datasheet link (fetched
    via the browser from www.ti.com, same-origin download) into this part; it anchors the NE5532 SOIC-8 family.
  - Pinout is the standard dual op-amp arrangement (1 = OUT1, 2 = IN1-, 3 = IN1+, 4 = V-, 5 = IN2+, 6 = IN2-, 7 = OUT2, 8
    = V+); Amplifier_Operational:NE5532 matches pad-for-pad.
