oomlout_ai_roboclick_1:
  actions:
  - command: run_python
    description: Clone or update the Git project and copy its selected KiCad files
      into the project part.
    file_python: kicad_agents/project_git_action.py
    project_board: ftdi_friend_rev_a
    project_board_name: FTDI Friend Rev A
    project_board_url: https://github.com/adafruit/Adafruit_FTDI-Friend-PCB/blob/master/Adafruit%20FTDI%20Friend%20Rev%20A.brd
    project_file_basename: Adafruit FTDI Friend Rev A
    project_file_extensions:
    - .kicad_pcb
    - .kicad_sch
    - .kicad_pro
    project_file_folder: ''
    project_file_path: Adafruit FTDI Friend Rev A
    project_git_ref: master
    project_git_url: https://github.com/adafruit/Adafruit_FTDI-Friend-PCB.git
    project_github_repository: Adafruit_FTDI-Friend-PCB
    project_github_url: https://github.com/adafruit/Adafruit_FTDI-Friend-PCB
    project_github_user: adafruit
    project_kicad_cli: ''
    project_match_blocked: {}
    project_match_overrides: {}
    project_review_notes: []
    project_source_format: eagle
    project_sparse_checkout: false
    project_version: rev_a
    timeout: '600'
  file_test: data/original/manifest.yaml
  retries_until_complete: 0
oomlout_ai_roboclick_2:
  actions:
