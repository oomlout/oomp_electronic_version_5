  actions:
  - command: run_python
    description: Summarize working.yaml and inventory every available part file for
      website generators.
    file_output: web.yaml
    file_python: kicad_agents/web_manifest_action.py
    manifest_config: config_web_manifest.yaml
    timeout: '600'
  always_run_on_regeneration: true
  description: Regenerate the deterministic web.yaml after every other part action.
  file_test: ''
  retries_until_complete: 0
