  research_notes:
  - 3.5 mm screw-terminal style anchored on LCSC C695629 (DORABO DB301V-3.5-2P-GN-S, 2-position green); the generic family
    covers the stock lengths in this style.
  - 'Insulator color variant: green.'
  - 4UCON series 1443 item 19717 = 23P (green insulator; 4uconnector.com listing checked 2026-10-01).
  - No official KiCad footprint master exists for this position count (TerminalBlock_4Ucon covers 2-15 at 3.5 mm; TerminalBlock_Phoenix
    PT-1,5 covers 2-16 at 5.0 mm), so no footprint is claimed; the schematic symbol is retained where available. No schematic
    symbol exists above 20 positions either.
  - 'Top view follows the built 3-pin exemplar style: body length positions x pitch with chamfered screw circles at every
    position and the pin row on the board side. Nominal drawing dimensions.'
