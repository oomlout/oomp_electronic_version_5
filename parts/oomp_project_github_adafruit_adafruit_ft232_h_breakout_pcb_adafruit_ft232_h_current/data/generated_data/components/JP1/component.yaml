connectivity_cross_check:
  available: true
  policy: Named schematic nets are compared with PCB pad nets using matching pin/pad numbers; root-sheet local labels also
    allow KiCad's leading '/' prefix.
  comparisons:
  - pin_or_pad_number: '1'
    schematic_nets:
    - +3V3
    pcb_nets:
    - +3V3
    status: agree
  - pin_or_pad_number: '10'
    schematic_nets:
    - D6
    pcb_nets:
    - D6
    status: agree
  - pin_or_pad_number: '11'
    schematic_nets:
    - D7
    pcb_nets:
    - D7
    status: agree
  - pin_or_pad_number: '2'
    schematic_nets:
    - +5V
    pcb_nets:
    - +5V
