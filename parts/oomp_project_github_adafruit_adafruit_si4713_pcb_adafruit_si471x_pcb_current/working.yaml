oomlout_ai_roboclick_1:
  actions:
  - command: run_python
    description: Clone or update the Git project and copy its selected KiCad files
      into the project part.
    file_python: kicad_agents/project_git_action.py
    project_board: adafruit_si471x_pcb
    project_board_name: Adafruit Si471x PCB
    project_board_url: https://github.com/adafruit/Adafruit-Si4713-PCB/blob/master/Adafruit%20Si471x%20PCB.brd
    project_file_basename: Adafruit Si471x PCB
    project_file_extensions:
    - .kicad_pcb
    - .kicad_sch
    - .kicad_pro
    project_file_folder: ''
    project_file_path: Adafruit Si471x PCB
    project_git_ref: master
    project_git_url: https://github.com/adafruit/Adafruit-Si4713-PCB.git
    project_github_repository: Adafruit-Si4713-PCB
    project_github_url: https://github.com/adafruit/Adafruit-Si4713-PCB
    project_github_user: adafruit
    project_kicad_cli: ''
    project_match_blocked: {}
    project_match_overrides: {}
    project_review_notes: []
    project_source_format: eagle
    project_sparse_checkout: false
    project_version: current
    timeout: '600'
  file_test: data/original/manifest.yaml
  retries_until_complete: 0
oomlout_ai_roboclick_2:
  actions:
  - command: run_python
    description: Generate a self-contained InteractiveHtmlBom page without opening
      a browser.
    file_output: data/interactivehtmlbom/generation_status.yaml
    file_python: kicad_agents/interactive_html_bom_action.py
    timeout: '1200'
  file_test: data/interactivehtmlbom/generation_status.yaml
  retries_until_complete: 0
