research_notes:
- Verified JLC C1590 / Samsung CL10B104KA8NNNC as the first reviewed preferred extended
  purchasing choice for this rated variant; 0603, 100 nF, 25 V, X7R, ±10% verified
  against the staged live JLC capture 2026-09-28. The Samsung ordering code (CL10
  = 0603, B = X7R, 104 = 100 nF, K = ±10%, A8 = 25 V) decodes consistently with the
  listed specifications; the live page specification table is the primary evidence.
- Linked to the generic 0603 100 nF definition as a lower-voltage purchasing variant
  (C1592 16 V precedent); the reviewed 50 V C14663 generic preference and the Samsung
  50 V C1591 maker/MPN variant remain unchanged. Projects needing 50 V margin must
  not substitute this 25 V SKU.
- No datasheet PDF imported at intake; download is an integration-stage task (JLC
  lists https://jlc-prod-smt.oss-eu-central-1.aliyuncs.com/smtDataManualFile/8770987890767724672-C1590.pdf).
