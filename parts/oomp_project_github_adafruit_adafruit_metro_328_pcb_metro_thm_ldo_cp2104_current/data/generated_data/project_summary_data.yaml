  overview: Project adafruit/Adafruit-METRO-328-PCB Metro THM+LDO CP2104 current is
    a KiCad project containing 119 extracted component records. The catalogue matcher
    linked 30 physical placements to OOMP parts.
  design_notes:
  - The extracted board outline is approximately 68.58 mm by 53.34 mm.
  - Placement data contains 54 front-side and 1 back-side components.
  review_notes:
  - 29 physical component records are not yet matched to an OOMP part.
  - The extractor reports 3 named-net comparisons that differ between schematic and
    PCB data.
