      research_notes:
      - The official JLC page lists Basic onsemi LM393DR2G (C7955) in SOIC-8; the
        purchased identity is an exact LM393 ordering suffix.
      - The onsemi LM393/D Rev. 25 datasheet confirms the dual open-collector comparator
        with the eight-pin assignment above and SOIC-8 NB Case 751-07 dimensions.
      - Comparator:LM393 matches the datasheet pin for pin, including open-collector
        outputs and the V-/V+ power pins; Package_SO:SOIC-8_3.9x4.9mm_P1.27mm is the
        matching JEDEC MS-012 machine footprint.
      - No HandSolder variant of the SOIC-8 3.9x4.9 master exists in the installed
        KiCad libraries; the same official master is selected unchanged for hand soldering
        (long 1.95 mm pads, no enlargement).
