    ratings:
      Comparator channels: 2
      ESD protection: 1500 V human body model, 150 V machine model
      Input bias current: 250 nA maximum at TA=25 °C, 20 nA typical; flows out of inputs
      Input common mode range: 0 V to VCC-1.5 V at 25 °C; -0.3 V low limit absolute
      Input differential voltage (absolute maximum): 36 V
      Input offset current: ±50 nA maximum at TA=25 °C (±5.0 nA typical)
      Input offset voltage: ±5.0 mV maximum at VCC=5.0 V, TA=25 °C (±1.0 mV typical)
      Large signal response: 300 ns with TTL input swing
      Operating temperature: 0 °C to +70 °C (LM393 suffix)
      Output leakage current: 1.0 µA maximum at VO=30 V over temperature
      Output saturation voltage: 400 mV maximum at ISink≤4.0 mA, TA=25 °C (150 mV typical)
      Output short circuit to ground: continuous permitted, sink current limited to 20 mA
      Output sink current: 6.0 mA minimum, 16 mA typical at VO≤1.5 V, TA=25 °C
      Output style: open collector (sink only; logic-compatible with pull-up)
      Power dissipation: 570 mW at TA=25 °C; derate 5.7 mW/°C above 25 °C
      Response time: 1.3 µs typical with 100 mV step and 5.0 mV overdrive, RL=5.1 kΩ
      Supply current: 1.0 mA maximum for both comparators, RL=∞, TA=25 °C (0.4 mA typical)
      Supply voltage (absolute maximum): +36 V or ±18 V
      Supply voltage (recommended single): 2.0 V to 36.0 V
      Supply voltage (recommended split): ±1.0 V to ±18.0 V
      Voltage gain: 50 V/mV minimum at RL≥15 kΩ, VCC=15 V (200 V/mV typical)
