oomlout_ai_roboclick_1:
  actions:
  - command: run_python
    description: Clone or update the Git project and copy its selected KiCad files
      into the project part.
    file_python: kicad_agents/project_git_action.py
    project_board: micro_mod_atp_carrier_board
    project_board_name: Micro Mod ATP Carrier Board
    project_board_url: https://github.com/sparkfun/MicroMod_ATP_Carrier_Board/blob/master/Hardware/MicroMod_ATP_CarrierBoard.brd
    project_file_basename: MicroMod_ATP_CarrierBoard
    project_file_extensions:
    - .kicad_pcb
    - .kicad_sch
    - .kicad_pro
    project_file_folder: Hardware
    project_file_path: Hardware/MicroMod_ATP_CarrierBoard
    project_git_ref: master
    project_git_url: https://github.com/sparkfun/MicroMod_ATP_Carrier_Board.git
    project_github_repository: MicroMod_ATP_Carrier_Board
    project_github_url: https://github.com/sparkfun/MicroMod_ATP_Carrier_Board
    project_github_user: sparkfun
    project_kicad_cli: ''
    project_match_blocked: {}
    project_match_overrides: {}
    project_review_notes: []
    project_source_format: eagle
    project_sparse_checkout: true
    project_version: current
    timeout: '600'
  file_test: data/original/manifest.yaml
  retries_until_complete: 0
