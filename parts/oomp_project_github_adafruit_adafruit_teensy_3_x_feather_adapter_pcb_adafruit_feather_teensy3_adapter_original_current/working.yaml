    project_file_folder: ''
    project_file_path: Adafruit Feather Teensy3 Adapter Original
    project_git_ref: master
    project_git_url: https://github.com/adafruit/Adafruit-Teensy-3.x-Feather-Adapter-PCB.git
    project_github_repository: Adafruit-Teensy-3.x-Feather-Adapter-PCB
    project_github_url: https://github.com/adafruit/Adafruit-Teensy-3.x-Feather-Adapter-PCB
    project_github_user: adafruit
    project_kicad_cli: ''
    project_match_blocked: {}
    project_match_overrides: {}
    project_review_notes: []
