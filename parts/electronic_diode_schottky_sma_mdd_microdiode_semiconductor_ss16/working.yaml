  compatibility_notes: 'Exact MDD (Microdiode Semiconductor) device row: the do_41/do_201ad
    through-hole rectifier and fast_recovery tokens were introduced at C2456-C2469,
    the sma schottky and mbs bridge_rectifier tokens already existed (M7/SS14 and
    MB10S-50MIL precedents), and this row was added under the diode family lock beside
    its siblings. SS16 (SMA(DO-214AC); 60V 1A Schottky, SMA surface mount) is its
    exact first reviewed preferred house choice. Rating comparison from the staged
    capture: package and ratings below, pins per the physical body. Edits made under
    the diode family lock. Rating comparison from the staged capture: Diodes/Schottky
    Diodes, package SMA(DO-214AC), stock 366590 recorded as observed. Edits made under
    the diode family lock.'
