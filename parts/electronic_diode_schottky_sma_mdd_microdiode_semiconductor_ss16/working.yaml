    Datasheet: Download
    Description: -55℃~+150℃ 1A 25A 300uA@60V 60V 700mV@1A Independent SMA(DO-214AC)
      Schottky Diodes ROHS
    Diode Configuration: Standalone
    ECCN: EAR99
    EasyEDA Libraries: PCB Footprint or Symbol
