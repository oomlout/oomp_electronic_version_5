  - The Fenghua ordering code decodes exactly to that suffix (CG = C0G, 180 = 18 pF, J = +-5%, 500 = 50 V), and the C0G 0402
    table covers 18 pF at 50 V (page 6).
  - Non-polarized two-terminal chip; the standard built-in 0402 chip renderer draws the package from the verified dimensions.
