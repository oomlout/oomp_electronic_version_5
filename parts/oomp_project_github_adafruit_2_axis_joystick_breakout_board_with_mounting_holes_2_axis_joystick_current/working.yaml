    project_git_url: https://github.com/adafruit/2-axis-joystick-breakout-board-with-mounting-holes.git
    project_github_repository: 2-axis-joystick-breakout-board-with-mounting-holes
    project_github_url: https://github.com/adafruit/2-axis-joystick-breakout-board-with-mounting-holes
    project_github_user: adafruit
    project_kicad_cli: ''
    project_match_blocked: {}
    project_match_overrides: {}
    project_review_notes: []
    project_source_format: eagle
    project_sparse_checkout: false
    project_version: current
    timeout: '600'
  file_test: data/original/manifest.yaml
  retries_until_complete: 0
