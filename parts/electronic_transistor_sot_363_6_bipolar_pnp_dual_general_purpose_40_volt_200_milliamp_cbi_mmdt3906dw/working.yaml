research_notes:
- The Bus Pirate fitted BOM names CBI MMDT3906 in SOT-363 as the general-purpose dual
  PNP device.
- The project CBI supplier link resolves to exact MPN MMDT3906DW, LCSC C2836075, with
  K3N marking.
- The other supplier links on the project page are alternate manufacturers and are
  not mixed into this exact identity.
- The CBI datasheet confirms two isolated PNP transistors, 40 V, 200 mA and the EBCEBC
  top-view pinout.
