oomlout_ai_roboclick_1:
  actions:
  - command: run_python
    description: Clone or update the Git project and copy its selected KiCad files
      into the project part.
    file_python: kicad_agents/project_git_action.py
    project_board: qwiic_multi_star
    project_board_name: Qwiic Multi Star
    project_board_url: https://github.com/sparkfun/Qwiic_MultiPort/blob/main/Hardware/Hardware%20-%20MultiStar/Hardware%20-%20MultiStar%2C%204%20points/Qwiic_MultiStar.brd
    project_file_basename: Qwiic_MultiStar
    project_file_extensions:
    - .kicad_pcb
    - .kicad_sch
    - .kicad_pro
    project_file_folder: Hardware/Hardware - MultiStar/Hardware - MultiStar, 4 points
    project_file_path: Hardware/Hardware - MultiStar/Hardware - MultiStar, 4 points/Qwiic_MultiStar
    project_git_ref: main
    project_git_url: https://github.com/sparkfun/Qwiic_MultiPort.git
    project_github_repository: Qwiic_MultiPort
    project_github_url: https://github.com/sparkfun/Qwiic_MultiPort
    project_github_user: sparkfun
    project_kicad_cli: ''
    project_match_blocked: {}
    project_match_overrides: {}
    project_review_notes: []
    project_source_format: eagle
    project_sparse_checkout: true
    project_version: current
    timeout: '600'
  file_test: data/original/manifest.yaml
  retries_until_complete: 0
oomlout_ai_roboclick_2:
  actions:
  - command: run_python
