research_notes:
- The current Bus Pirate fitted BOM calls the part CBI BC2301(2.8A); the exact special-order
  CBI datasheet identifies it as BC2301T-2.8A in SOT-523.
- The Bus Pirate component notes explicitly say the SOT-523 SI2301-family device may
  be a special-order package and name CBI BC2301 as the example.
- The public LCSC C2928245 BC2301(2.8A) listing and PDF are the physically larger
  SOT-23 package, so that LCSC number is deliberately not attached to this SOT-523
  part.
- The historical project supplier URL resolves to Nexperia PMV65XP,215 in SOT-23 and
  is not used as identity evidence.
- The CBI SOT-523 datasheet assigns pin 1 gate, pin 2 source, and pin 3 drain.
