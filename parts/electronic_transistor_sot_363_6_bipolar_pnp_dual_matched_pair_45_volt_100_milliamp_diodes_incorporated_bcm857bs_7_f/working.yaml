research_notes:
- The current Bus Pirate fitted BOM specifies DIODES BCM857 in SOT-363 as the dual
  PNP matched pair.
- The Bus Pirate transistor notes identify BCM857BS-7-F as the Diodes Incorporated
  ordering option for Q401.
- The exact LCSC listing is C105896 and confirms BCM857BS-7-F, SOT-363, 45 V, 100
  mA and 200 mW.
- The manufacturer datasheet guarantees 10 percent hFE matching and a maximum 2 mV
  VBE difference.
- The manufacturer top-view pinout is 1 emitter 1, 2 base 1, 3 collector 2, 4 emitter
  2, 5 base 2, 6 collector 1.
