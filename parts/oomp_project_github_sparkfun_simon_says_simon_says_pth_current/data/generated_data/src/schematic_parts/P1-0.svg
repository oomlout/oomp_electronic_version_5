<style>.sch-page { fill: var(--sch-page, #ffffff); }.sch-wire { fill: none; stroke: var(--net-color, var(--sch-ink, #171717)); stroke-linecap: round; }.sch-wire-hit { stroke: #000000; stroke-opacity: 0; stroke-width: 1.0; pointer-events: stroke; cursor: pointer; }.sch-pin-hit { fill: none; stroke: #000000; stroke-opacity: 0; stroke-width: 0.9; pointer-events: stroke; cursor: pointer; }.sch-junction { fill: var(--sch-ink, #171717); stroke: none; }.sch-no-connect { stroke: var(--sch-note, #b0543f); fill: none; stroke-width: 0.25; stroke-linecap: round; }.sch-pin { fill: none; stroke: var(--sch-ink, #171717); stroke-width: 0.3048; stroke-linecap: round; }.sch-pin-number { fill: var(--sch-ink, #171717); }.sch-pin-name { fill: var(--sch-ink, #171717); font-weight: 700; }.sch-ref { fill: var(--sch-ink, #171717); font-weight: 800; }.sch-value { fill: var(--sch-ink, #171717); }.sch-label { fill: var(--net-color, var(--sch-ink, #171717)); }.sch-label-pill { fill: var(--accent-soft, #ffe4db); fill-opacity: .55; stroke: var(--accent, #ff5c35); stroke-width: 0.2; }.sch-label-pill-text { fill: var(--accent, #ff5c35); font-weight: 600; }.sch-note { fill: none; stroke: var(--sch-note, #8a7f6a); }.sch-note-text { fill: var(--sch-note, #8a7f6a); }.sch-sheet-box { fill: var(--sch-page, #ffffff); stroke: var(--sch-ink, #171717); stroke-width: 0.254; }.sch-sheet-text { fill: var(--sch-ink, #171717); }.sch-missing { fill: none; stroke: var(--sch-note, #b0543f); stroke-width: 0.2; stroke-dasharray: 0.8 0.5; }.sch-filled-body { fill: var(--sch-body, #f0ede4); stroke: var(--sch-ink, #171717); }.sch-filled-page { fill: var(--sch-page, #ffffff); stroke: var(--sch-ink, #171717); }.sch-graphic { fill: none; stroke: var(--sch-ink, #171717); }.sch-ref, .sch-value, .sch-pin-number, .sch-pin-name, .sch-label, .sch-label-pill-text, .sch-note-text, .sch-sheet-text { font-family: 'Segoe UI', Arial, sans-serif; }</style>
