  actions:
  - command: run_python
    description: Clone or update the Git project and copy its selected KiCad files
      into the project part.
    file_python: kicad_agents/project_git_action.py
    project_board: benchtop_power_supply
    project_board_name: Benchtop Power Supply
    project_board_url: https://github.com/sparkfun/Benchtop_Power_Board_Kit/blob/master/Hardware/Benchtop%20Power%20Supply.brd
