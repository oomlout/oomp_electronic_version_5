    parts_directory: parts
    project_file_basename: teensyextender
    project_match_overrides: {}
    timeout: '1200'
  file_test: ''
  retries_until_complete: 0
oomlout_ai_roboclick_6:
  actions:
  - command: run_python
    description: Generate JLCPCB Gerbers, drill files, BOM, CPL, OOMP pad audit data,
      checksums, and review queues from the canonical KiCad PCB.
