research_notes:
- The current Bus Pirate fitted BOM identifies CBI (China Base International) MMBT7002K.
- The exact LCSC listing is C2879714 and specifies an N-channel 60 V, 300 mA SOT-23
    MOSFET.
- The CBI datasheet assigns pin 1 gate, pin 2 source, and pin 3 drain.
- The historical project supplier URL now resolves to Diodes Incorporated BSS138-13-F,
    C526482, so it is not used as identity evidence.
- The KiCad 50 V and 0.22 A description belongs to the old BSS138 metadata and is
    superseded by the fitted MMBT7002K datasheet.
