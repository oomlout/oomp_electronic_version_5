    project_file_folder: Hardware
    project_file_path: Hardware/SparkFun_Audio_Player_Breakout_MY1690X-16S
    project_git_ref: main
    project_git_url: https://github.com/sparkfun/SparkFun_Audio_Player_Breakout_MY1690X-16S.git
    project_github_repository: SparkFun_Audio_Player_Breakout_MY1690X-16S
    project_github_url: https://github.com/sparkfun/SparkFun_Audio_Player_Breakout_MY1690X-16S
    project_github_user: sparkfun
    project_match_blocked: {}
    project_match_overrides: {}
