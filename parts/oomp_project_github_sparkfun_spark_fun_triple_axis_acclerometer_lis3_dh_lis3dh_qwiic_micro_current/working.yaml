oomlout_ai_roboclick_1:
  actions:
  - command: run_python
    description: Clone or update the Git project and copy its selected KiCad files
      into the project part.
    file_python: kicad_agents/project_git_action.py
    project_board: lis3dh_qwiic_micro
    project_board_name: LIS3DH Qwiic Micro
    project_board_url: https://github.com/sparkfun/SparkFun_Triple_Axis_Acclerometer-LIS3DH/tree/main/Hardware/Micro
    project_file_basename: SparkFun_LIS3DH_Micro
    project_file_extensions:
    - .kicad_pcb
    - .kicad_sch
    - .kicad_pro
    project_file_folder: Hardware/Micro
    project_file_path: Hardware/Micro/SparkFun_LIS3DH_Micro
    project_git_ref: main
    project_git_url: https://github.com/sparkfun/SparkFun_Triple_Axis_Acclerometer-LIS3DH.git
    project_github_repository: SparkFun_Triple_Axis_Acclerometer-LIS3DH
    project_github_url: https://github.com/sparkfun/SparkFun_Triple_Axis_Acclerometer-LIS3DH
    project_github_user: sparkfun
    project_kicad_cli: ''
    project_match_blocked: {}
    project_match_overrides: {}
    project_review_notes: []
    project_source_format: ''
    project_sparse_checkout: true
    project_version: current
    timeout: '600'
  file_test: data/original/manifest.yaml
  retries_until_complete: 0
oomlout_ai_roboclick_2:
  actions:
  - command: run_python
    description: Generate a self-contained InteractiveHtmlBom page without opening
