oomlout_ai_roboclick_1:
  actions:
  - command: run_python
    description: Clone or update the Git project and copy its selected KiCad files
      into the project part.
    file_python: kicad_agents/project_git_action.py
    project_board: rp2040_thing_plus
    project_board_name: RP2040 Thing Plus
    project_board_url: https://github.com/sparkfun/SparkFun_Thing_Plus-RP2040/blob/main/Hardware/RP2040_Thing_Plus.brd
    project_file_basename: RP2040_Thing_Plus
    project_file_extensions:
    - .kicad_pcb
    - .kicad_sch
    - .kicad_pro
    project_file_folder: Hardware
    project_file_path: Hardware/RP2040_Thing_Plus
    project_git_ref: main
    project_git_url: https://github.com/sparkfun/SparkFun_Thing_Plus-RP2040.git
    project_github_repository: SparkFun_Thing_Plus-RP2040
    project_github_url: https://github.com/sparkfun/SparkFun_Thing_Plus-RP2040
    project_github_user: sparkfun
    project_kicad_cli: ''
    project_match_blocked: {}
    project_match_overrides: {}
    project_review_notes: []
    project_source_format: eagle
    project_sparse_checkout: true
    project_version: current
    timeout: '600'
  file_test: data/original/manifest.yaml
  retries_until_complete: 0
oomlout_ai_roboclick_2:
  actions:
  - command: run_python
    description: Generate a self-contained InteractiveHtmlBom page without opening
