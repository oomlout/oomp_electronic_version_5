oomlout_ai_roboclick_1:
  actions:
  - command: run_python
    description: Clone or update the Git project and copy its selected KiCad files
      into the project part.
    file_python: kicad_agents/project_git_action.py
    project_board: gnss_flex_breakout
    project_board_name: GNSS Flex Breakout
    project_board_url: https://github.com/sparkfun/SparkFun_GNSS_Flex_Breakout
    project_file_basename: SparkFun_GNSS_Flex_Breakout
    project_file_extensions:
    - .kicad_pcb
    - .kicad_sch
    - .kicad_pro
    project_file_folder: Hardware
    project_file_path: Hardware/SparkFun_GNSS_Flex_Breakout
    project_git_ref: v11
    project_git_url: https://github.com/sparkfun/SparkFun_GNSS_Flex_Breakout.git
    project_github_repository: SparkFun_GNSS_Flex_Breakout
    project_github_url: https://github.com/sparkfun/SparkFun_GNSS_Flex_Breakout
    project_github_user: sparkfun
    project_match_blocked: {}
    project_match_overrides: {}
    project_review_notes: []
    project_sparse_checkout: true
    project_version: v1.1
    timeout: '600'
  file_test: data/original/manifest.yaml
  retries_until_complete: 0
oomlout_ai_roboclick_2:
  actions:
  - command: run_python
    description: Generate a self-contained InteractiveHtmlBom page without opening
