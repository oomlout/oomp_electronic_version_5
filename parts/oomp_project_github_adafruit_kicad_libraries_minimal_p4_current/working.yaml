oomlout_ai_roboclick_6:
  actions:
  - command: run_python
    description: Generate JLCPCB Gerbers, drill files, BOM, CPL, OOMP pad audit data,
      checksums, and review queues from the canonical KiCad PCB.
    file_output: data/production_auto_generate/data/generation_status.yaml
    file_python: kicad_agents/production_jlc_action.py
    parts_directory: parts
    production_board_source: ''
    production_exclude_references: []
    production_lcsc_overrides: {}
    production_oomp_metadata_board: ''
    production_position_offsets_mm: {}
    production_rotation_offsets: {}
    project_file_basename: Minimal P4 V3
    project_match_overrides: {}
    timeout: '1200'
  always_run_on_regeneration: true
  file_test: data/production_auto_generate/data/generation_status.yaml
  honour_gate_in_normal_run: true
  retries_until_complete: 0
oomlout_ai_roboclick_7:
  actions:
  - command: run_python
    description: Summarize working.yaml and inventory every available part file for
      website generators.
    file_output: web.yaml
    file_python: kicad_agents/web_manifest_action.py
    manifest_config: config_web_manifest.yaml
    timeout: '600'
  always_run_on_regeneration: true
  description: Regenerate the deterministic web.yaml after every other part action.
  file_test: ''
  retries_until_complete: 0
