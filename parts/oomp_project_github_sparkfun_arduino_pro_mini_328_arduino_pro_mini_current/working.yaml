oomlout_ai_roboclick_1:
  actions:
  - command: run_python
    description: Clone or update the Git project and copy its selected KiCad files
      into the project part.
    file_python: kicad_agents/project_git_action.py
    project_board: arduino_pro_mini
    project_board_name: Arduino Pro Mini
    project_board_url: https://github.com/sparkfun/Arduino_Pro_Mini_328/blob/master/Hardware/Arduino-Pro-Mini.brd
    project_file_basename: Arduino-Pro-Mini
    project_file_extensions:
    - .kicad_pcb
    - .kicad_sch
    - .kicad_pro
    project_file_folder: Hardware
    project_file_path: Hardware/Arduino-Pro-Mini
    project_git_ref: master
    project_git_url: https://github.com/sparkfun/Arduino_Pro_Mini_328.git
    project_github_repository: Arduino_Pro_Mini_328
    project_github_url: https://github.com/sparkfun/Arduino_Pro_Mini_328
    project_github_user: sparkfun
    project_kicad_cli: ''
    project_match_blocked: {}
    project_match_overrides: {}
    project_review_notes: []
    project_source_format: eagle
    project_sparse_checkout: true
    project_version: current
    timeout: '600'
  file_test: data/original/manifest.yaml
  retries_until_complete: 0
oomlout_ai_roboclick_2:
