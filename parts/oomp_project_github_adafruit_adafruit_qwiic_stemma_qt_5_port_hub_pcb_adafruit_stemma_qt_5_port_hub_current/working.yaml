oomlout_ai_roboclick_1:
  actions:
  - command: run_python
    description: Clone or update the Git project and copy its selected KiCad files
      into the project part.
    file_python: kicad_agents/project_git_action.py
    project_board: adafruit_stemma_qt_5_port_hub
    project_board_name: Adafruit Stemma QT 5 Port Hub
    project_board_url: https://github.com/adafruit/Adafruit-Qwiic-Stemma-QT-5-Port-Hub-PCB/blob/main/Adafruit%20Stemma%20QT%205%20Port%20Hub.brd
    project_file_basename: Adafruit Stemma QT 5 Port Hub
    project_file_extensions:
    - .kicad_pcb
    - .kicad_sch
    - .kicad_pro
    project_file_folder: ''
    project_file_path: Adafruit Stemma QT 5 Port Hub
    project_git_ref: main
    project_git_url: https://github.com/adafruit/Adafruit-Qwiic-Stemma-QT-5-Port-Hub-PCB.git
    project_github_repository: Adafruit-Qwiic-Stemma-QT-5-Port-Hub-PCB
    project_github_url: https://github.com/adafruit/Adafruit-Qwiic-Stemma-QT-5-Port-Hub-PCB
    project_github_user: adafruit
    project_kicad_cli: ''
    project_match_blocked: {}
    project_match_overrides: {}
    project_review_notes: []
    project_source_format: eagle
    project_sparse_checkout: false
    project_version: current
    timeout: '600'
  file_test: data/original/manifest.yaml
  retries_until_complete: 0
