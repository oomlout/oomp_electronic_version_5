research_notes:
- Verified JLC C1895 / Fenghua 1206CG201J500NT as the first reviewed preferred extended
  purchasing choice for this previously absent generic 1206 200 pF value; the populate
  row was added by this intake. The Fenghua ordering code (CG = C0G, 201 = 20 x 10^1
  pF, J = +/-5%, 500 = 50 V) decodes consistently with the listed specifications;
  the live page specification table is the primary evidence. Distinct from the 0402,
  0603 and 0805 200 pF generics supplied by C1529, C1600 and C1724.
- Live JLC detail page (staged capture 2026-09-28) shows Extended (Promotional Extended),
  1206, 200 pF, 50 V, C0G, +/-5%, stock 3,042, minimum 1, full reel 4,000, available
  order qty 3,040, MSL 1. No datasheet PDF imported at intake; download is an integration-stage
  task (JLC lists https://jlc-prod-smt.oss-eu-central-1.aliyuncs.com/smtDataManualFile/8770991596294946816-C1895.pdf).
