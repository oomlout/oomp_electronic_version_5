    project_github_repository: nRF52840_Breakout_MDBT50Q
    project_github_url: https://github.com/sparkfun/nRF52840_Breakout_MDBT50Q
    project_github_user: sparkfun
    project_kicad_cli: ''
    project_match_blocked: {}
    project_match_overrides: {}
    project_review_notes: []
