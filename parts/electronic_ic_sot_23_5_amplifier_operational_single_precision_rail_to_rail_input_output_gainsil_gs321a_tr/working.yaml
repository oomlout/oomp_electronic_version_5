research_notes:
- The Bus Pirate analogue page calls for an A-grade LMV321-class device at U601 and
  links Gainsil GS321A as an example.
- The exact active supplier listing resolves to Gainsil GS321A-TR, LCSC C431318.
- The Gainsil datasheet confirms 0.4 mV maximum input offset voltage, rail-to-rail
  input and output, the five-pin assignment and package dimensions.
- The discontinued Onsemi LMV321AS5X example was not selected because its listed offset
  specification does not meet the project's stated A-grade target.
