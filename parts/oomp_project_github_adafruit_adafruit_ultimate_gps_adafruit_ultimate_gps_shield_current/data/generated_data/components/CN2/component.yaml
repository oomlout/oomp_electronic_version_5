connectivity_cross_check:
  available: true
  policy: Named schematic nets are compared with PCB pad nets using matching pin/pad numbers; root-sheet local labels also
    allow KiCad's leading '/' prefix.
  comparisons:
  - pin_or_pad_number: '1'
    schematic_nets: []
    pcb_nets: []
    status: no_named_net
  - pin_or_pad_number: '2'
    schematic_nets:
    - SD_CSIN
    pcb_nets:
    - SD_CSIN
    status: agree
  - pin_or_pad_number: '3'
    schematic_nets:
    - SD_DATAIN
    pcb_nets:
    - SD_DATAIN
    status: agree
  - pin_or_pad_number: '4'
    schematic_nets:
    - 3.3V
    pcb_nets:
    - 3.3V
    status: agree
  - pin_or_pad_number: '5'
    schematic_nets:
    - SD_SCKIN
    pcb_nets:
    - SD_SCKIN
    status: agree
  - pin_or_pad_number: '6'
    schematic_nets:
    - GND
    pcb_nets:
    - GND
    status: agree
  - pin_or_pad_number: '7'
    schematic_nets:
    - MISO
    pcb_nets:
    - MISO
    status: agree
  - pin_or_pad_number: '8'
    schematic_nets: []
    pcb_nets: []
    status: no_named_net
  - pin_or_pad_number: CD1
    schematic_nets:
    - SD_CD
    pcb_nets:
    - SD_CD
    status: agree
  - pin_or_pad_number: CD2
