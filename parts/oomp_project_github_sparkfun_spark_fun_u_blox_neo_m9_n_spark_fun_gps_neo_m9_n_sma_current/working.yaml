    project_file_extensions:
    - .kicad_pcb
    - .kicad_sch
    - .kicad_pro
    project_file_folder: Hardware/SparkFun GPS NEO_M9N_SMA
    project_file_path: Hardware/SparkFun GPS NEO_M9N_SMA/SparkFun GPS NEO_M9N_SMA
    project_git_ref: master
    project_git_url: https://github.com/sparkfun/SparkFun_u-Blox_NEO_M9N.git
    project_github_repository: SparkFun_u-Blox_NEO_M9N
    project_github_url: https://github.com/sparkfun/SparkFun_u-Blox_NEO_M9N
    project_github_user: sparkfun
    project_kicad_cli: ''
    project_match_blocked: {}
    project_match_overrides: {}
    project_review_notes: []
    project_source_format: eagle
    project_sparse_checkout: true
    project_version: current
    timeout: '600'
  file_test: data/original/manifest.yaml
  retries_until_complete: 0
