  actions:
  - command: run_python
    description: Clone or update the Git project and copy its selected KiCad files
      into the project part.
    file_python: kicad_agents/project_git_action.py
    project_board: spark_fun_gps_neo_m9_n_sma
    project_board_name: Spark Fun GPS NEO M9 N SMA
    project_board_url: https://github.com/sparkfun/SparkFun_u-Blox_NEO_M9N/blob/master/Hardware/SparkFun%20GPS%20NEO_M9N_SMA/SparkFun%20GPS%20NEO_M9N_SMA.brd
