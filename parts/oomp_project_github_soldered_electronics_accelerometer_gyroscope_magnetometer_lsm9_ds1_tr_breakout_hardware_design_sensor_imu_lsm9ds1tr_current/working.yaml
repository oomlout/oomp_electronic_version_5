    - .kicad_pcb
    - .kicad_sch
    - .kicad_pro
    project_file_folder: CAD/V1.2.2
    project_file_path: CAD/V1.2.2/Accelerometer_Gyroscope_Magnetometer LSM9DS1TR breakout
    project_git_ref: main
    project_git_url: https://github.com/SolderedElectronics/Accelerometer---Gyroscope---Magnetometer-LSM9DS1TR-breakout-hardware-design.git
    project_github_repository: Accelerometer---Gyroscope---Magnetometer-LSM9DS1TR-breakout-hardware-design
    project_github_url: https://github.com/SolderedElectronics/Accelerometer---Gyroscope---Magnetometer-LSM9DS1TR-breakout-hardware-design
    project_github_user: soldered_electronics
    project_match_blocked: {}
    project_match_overrides: {}
