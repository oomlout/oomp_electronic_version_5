research_notes:
- The official JLC page lists Basic STMicroelectronics TL072CDT (C6961) in SO-8; the
  ordering table of Doc ID 2298 Rev 7 covers the CDT suffix exactly.
- The ST datasheet confirms the dual JFET-input op-amp with the eight-pin assignment
  above and SO-8 package dimensions (D 4.80-5.00, E1 3.80-4.00, E 5.80-6.20, e 1.27
  BSC).
- Amplifier_Operational:TL072 matches the datasheet pin for pin; Package_SO:SOIC-8_3.9x4.9mm_P1.27mm
  is the matching JEDEC MS-012 machine footprint.
- No HandSolder variant of the SOIC-8 3.9x4.9 master exists in the installed KiCad
  libraries; the same official master is selected unchanged for hand soldering.
