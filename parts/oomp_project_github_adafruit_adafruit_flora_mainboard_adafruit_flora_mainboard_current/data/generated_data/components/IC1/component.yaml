connectivity_cross_check:
  available: true
  policy: Named schematic nets are compared with PCB pad nets using matching pin/pad numbers; root-sheet local labels also
    allow KiCad's leading '/' prefix.
  comparisons:
  - pin_or_pad_number: '1'
    schematic_nets:
    - D7
    pcb_nets:
    - D7
    status: agree
  - pin_or_pad_number: '10'
    schematic_nets:
    - MOSI
    pcb_nets:
    - MOSI
    status: agree
  - pin_or_pad_number: '11'
    schematic_nets:
    - MISO
    pcb_nets:
    - MISO
    status: agree
  - pin_or_pad_number: '12'
    schematic_nets: []
    pcb_nets: []
    status: no_named_net
  - pin_or_pad_number: '13'
    schematic_nets:
    - RST
    pcb_nets:
    - RST
