    3 mA; reconfirmed live 2026-09-30.'
  - 'The Sunlord ordering decode covers the full suffix: SDFL chip ferrite inductor, 1608 [0603] 1.6 x 0.8 mm, Q material,
    S100 = 10 uH, K = +-10%, T tape and reel, F hazardous-substance-free.'
  - Non-polarized two-terminal chip; the standard built-in 0603 chip renderer draws the package from the verified dimensions
    above.
  - The 3 mA / 1.85 ohm ratings belong to this exact purchasing choice; the generic 0603 10 uH row stays unrated.
