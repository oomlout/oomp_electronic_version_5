    right. working_svg_dimensioned.png: 1.6 x 0.8 mm body with end terminations and
    arrows, matching the Sunlord SDFL1608 nominals. data/kicad manifest complete with
    Device:L symbol and Inductor_SMD:L_0603_1608Metric machine + Pad1.05x0.95mm_HandSolder
    hand footprints; kicad_symbol_unit_1.png shows the coil glyph with the OOMP value;
