    2026-10-02 (stock 474,086).'
  - Browser-downloaded the Torex XC6206 series datasheet (17 pages, ETR0305_004b) into this part; it anchors the XC6206 SOT-23
    LDO family.
  - 'Pin assignment page 2 (SOT-23): 1 = VSS, 2 = VOUT, 3 = VIN; the KiCad Regulator_Linear:XC6206PxxxMR symbol matches pad-for-pad.'
