    white 0603 LED sub-family (the red KT-0603R spec does not cover white ratings).
  - 'POLARITY TRAP: identical to the red sibling - KENTO numbers pad 1 = + (anode) and pad 2 = cathode (green corner, page
    2 drawing); the KiCad LED_0603_1608Metric library convention numbers pad 1 as cathode - verify polarity against the vendor
    drawing before assembly.'
