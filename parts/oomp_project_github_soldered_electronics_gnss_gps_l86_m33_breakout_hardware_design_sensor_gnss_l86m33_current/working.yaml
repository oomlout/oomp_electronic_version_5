oomlout_ai_roboclick_1:
  actions:
  - command: run_python
    description: Clone or update the Git project and copy its selected KiCad files
      into the project part.
    file_python: kicad_agents/project_git_action.py
    project_board: sensor_gnss_l86m33
    project_board_name: L86-M33 GNSS
    project_board_url: https://github.com/SolderedElectronics/GNSS-GPS-L86-M33-breakout-hardware-design
    project_file_basename: GNSS_breakout_L86-M33
    project_file_extensions:
    - .kicad_pcb
    - .kicad_sch
    - .kicad_pro
    project_file_folder: CAD/V1.2.0
    project_file_path: CAD/V1.2.0/GNSS_breakout_L86-M33
    project_git_ref: main
    project_git_url: https://github.com/SolderedElectronics/GNSS-GPS-L86-M33-breakout-hardware-design.git
    project_github_repository: GNSS-GPS-L86-M33-breakout-hardware-design
    project_github_url: https://github.com/SolderedElectronics/GNSS-GPS-L86-M33-breakout-hardware-design
    project_github_user: soldered_electronics
    project_match_blocked: {}
    project_match_overrides: {}
    project_review_notes: []
    project_sparse_checkout: true
    project_version: current
    timeout: '600'
  file_test: data/original/manifest.yaml
  retries_until_complete: 0
oomlout_ai_roboclick_2:
  actions:
  - command: run_python
    description: Generate a self-contained InteractiveHtmlBom page without opening
      a browser.
    file_output: data/interactivehtmlbom/generation_status.yaml
    file_python: kicad_agents/interactive_html_bom_action.py
    timeout: '1200'
  file_test: data/interactivehtmlbom/generation_status.yaml
  retries_until_complete: 0
oomlout_ai_roboclick_3:
  actions:
  - command: run_python
    description: Extract KiCad data and rebuild the project README, board SVGs, pin-labelled
      PNG, and mechanical layer.
    file_output: data/generated_data/src/board_pins.png
    file_python: kicad_agents/project_readme_action.py
    parts_directory: parts
    project_board: sensor_gnss_l86m33
    project_board_name: L86-M33 GNSS
    project_board_url: https://github.com/SolderedElectronics/GNSS-GPS-L86-M33-breakout-hardware-design
    project_file_basename: GNSS_breakout_L86-M33
    project_file_extensions:
    - .kicad_pcb
    - .kicad_sch
    - .kicad_pro
    project_file_folder: CAD/V1.2.0
    project_file_path: CAD/V1.2.0/GNSS_breakout_L86-M33
    project_git_ref: main
    project_git_url: https://github.com/SolderedElectronics/GNSS-GPS-L86-M33-breakout-hardware-design.git
    project_github_repository: GNSS-GPS-L86-M33-breakout-hardware-design
    project_github_url: https://github.com/SolderedElectronics/GNSS-GPS-L86-M33-breakout-hardware-design
    project_github_user: soldered_electronics
    project_match_blocked: {}
    project_match_overrides: {}
    project_review_notes: []
    project_sparse_checkout: true
    project_version: current
    regenerate_pngs: false
    timeout: '1200'
  - allow_upscale: false
    command: image_resize
    file_destination: data/generated_data/src/board_300.png
    file_source: data/generated_data/src/board.png
    maximum_dimension: 300
    regenerate_pngs: false
    resample: lanczos
  - allow_upscale: false
    command: image_resize
    file_destination: data/generated_data/src/board_pins_300.png
    file_source: data/generated_data/src/board_pins.png
    maximum_dimension: 300
    regenerate_pngs: false
    resample: lanczos
  - allow_upscale: false
    command: image_resize
    file_destination: data/generated_data/src/board_bottom_300.png
    file_source: data/generated_data/src/board_bottom.png
    maximum_dimension: 300
    regenerate_pngs: false
    resample: lanczos
  - allow_upscale: false
    command: image_resize
    file_destination: data/generated_data/src/board_pins_bottom_300.png
    file_source: data/generated_data/src/board_pins_bottom.png
    maximum_dimension: 300
    regenerate_pngs: false
    resample: lanczos
  - allow_upscale: false
    command: image_resize
    file_destination: data/generated_data/src/board_mechanical_300.png
    file_source: data/generated_data/src/board_mechanical.png
    maximum_dimension: 300
    regenerate_pngs: false
    resample: lanczos
  file_test: data/generated_data/src/board_mechanical_300.png
  retries_until_complete: 0
oomlout_ai_roboclick_4:
  actions:
  - command: run_python
    description: Refresh Used in projects metadata and part README links from all
      confirmed project matches.
    file_python: kicad_agents/project_usage_action.py
    parts_directory: parts
    timeout: '600'
  file_test: ''
  retries_until_complete: 0
oomlout_ai_roboclick_5:
  actions:
  - command: run_python
    description: Preserve original KiCad files, package local libraries, and replace
      only verified unchanged defaults in an OOMP design copy.
    file_output: data/oomp_design/conversion_report.yaml
    file_python: kicad_agents/kicad_project_action.py
    parts_directory: parts
    project_file_basename: GNSS_breakout_L86-M33
    project_match_overrides: {}
    timeout: '1200'
  file_test: ''
  retries_until_complete: 0
