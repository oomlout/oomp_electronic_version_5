  - 'The official JLC page lists Basic MDD MB10S-50MIL (C2488): 1000 V 1.0 A single-phase bridge rectifier in MBS; reconfirmed
    live 2026-10-02 (stock 674,978).'
  - Browser-downloaded the MDD MB1S-MB10S series datasheet (3 pages, Rev 2024A2) into this part; it anchors the MBS bridge
    family (MB1S-MB10S voltage columns).
  - 'Pinout per the page 1 drawing: pins (2)(1) on the top edge and (3)(4) on the bottom edge with + on the right and - on
    the left, giving 1 = +, 2 = ~, 3 = -, 4 = ~; the KiCad Device:D_Bridge_+A-A symbol pairs pad-for-pad with Diode_Bridge_Vishay_MBLS.'
