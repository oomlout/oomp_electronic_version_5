  - 'The official JLC page lists Basic Jiangsu Changjing CJ431 (C3113): adjustable shunt reference 2.5-36 V, +-0.5 %, 100
    mA in SOT-23; reconfirmed live 2026-10-02 (stock 398,030).'
  - Browser-downloaded the Changjing CJ431/CD431 specification (9 pages, M.Oct 2017) into this part; it anchors the CJ431
    SOT-23 family.
  - 'SYMBOL MIRROR: the datasheet pin assignment is 1 = REFERENCE, 2 = CATHODE, 3 = ANODE, while the KiCad Reference_Voltage:TL431LP
    symbol numbers 1 = REF / 2 = A / 3 = K - pins 2 and 3 swapped; designs must compensate (custom symbol or pin swap) before
    assembly.'
