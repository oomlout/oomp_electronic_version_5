research_notes:
- Verified JLC C1324 RS-05K390JT as a preferred extended purchasing choice for the
  existing generic 0805 39 Ω value.
- JLC and same-code LCSC pages agree on ±5%, 125 mW, 150 V, ±100 ppm/°C and -55 to
  +155 °C. The FH series datasheet rates 0805 at 1/8 W and 150 V and lists ±100 ppm/°C
  for 10 Ω to 1 MΩ at ±5%.
- '2026-11-17: corrected the shared datasheet attribution from UNI-ROYAL to the local
  Fenghua family sheet for this FH primary part; the R-6.1 manufacturer approval sheet
  was independently reviewed for the 5% marking.'
