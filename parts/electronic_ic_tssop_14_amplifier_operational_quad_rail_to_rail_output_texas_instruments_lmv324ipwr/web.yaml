  - The Bus Pirate analogue component page identifies U504 and U505 as LMV324 devices in TSSOP-14 and links this TI orderable
    example.
  - The exact supplier page resolves to Texas Instruments LMV324IPWR, LCSC C398929.
  - The TI datasheet confirms this variant is a quad 2.7 V to 5.5 V operational amplifier with rail-to-rail output and the
    complete fourteen-pin assignment.
  - The official TI PW0014A package drawing supplies the dimensions used by the physical diagrams.
