  compatibility_notes: 'Second code on the existing generic 1206 22 nF capacitor:
    the plain generic ID keeps its reviewed preference C1856 (FH 1206B223K500NT, X7R
    +/-10% 50 V). C1931 is the exact FH Y5V +/-20% SKU (1206F223M500NT, 50 V) from
    the same maker, so it gets its own maker/mpn variant ID linked via generic_oomp_id,
    following the established variant taxonomy. Rating comparison from the staged
    capture: same 22 nF value, package and 50 V rating, but Y5V +/-20% is a materially
    broader-tolerance, worse-stability dielectric than the X7R +/-10% preference -
    the variant must never replace the X7R preference. Two-terminal MLCC (pin_count
    2); stock 543 recorded as observed. Edits made under the capacitor family lock.'
