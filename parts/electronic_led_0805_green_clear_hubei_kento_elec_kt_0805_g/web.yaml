  research_notes:
  - 'The official JLC page lists Basic Hubei KENTO KT-0805G (C2297): emerald green 0805 water-clear LED, 2.6-3.1 V, 5 mA test
    current, 120 deg, 513-528 nm, up to 430 mcd; reconfirmed live 2026-10-02 (stock 3,135,154).'
  - Browser-downloaded the KENTO 0805 emerald-green approval specification (11 pages) into this part; it anchors the green
    0805 LED sub-family (the 0805 yellow spec does not cover green).
  - 'POLARITY TRAP: identical to the other KENTO LEDs - pad 1 = + (anode) and pad 2 = cathode (green corner, page 2 drawing);
    the KiCad LED_0805_2012Metric library convention numbers pad 1 as cathode - verify polarity against the vendor drawing
    before assembly.'
