oomlout_ai_roboclick_1:
  actions:
  - command: run_python
    description: Clone or update the Git project and copy its selected KiCad files
      into the project part.
    file_python: kicad_agents/project_git_action.py
    project_board: lis3dh_breakout
    project_board_name: LIS3DH Breakout
    project_board_url: https://github.com/jedp/LIS3DH-breakout
    project_file_basename: LIS3DH-breakout
    project_file_extensions:
    - .kicad_pcb
    - .kicad_sch
    - .kicad_pro
    project_file_folder: ''
    project_file_path: LIS3DH-breakout
    project_git_ref: main
    project_git_url: https://github.com/jedp/LIS3DH-breakout.git
    project_github_repository: LIS3DH-breakout
    project_github_url: https://github.com/jedp/LIS3DH-breakout
    project_github_user: jedp
    project_kicad_cli: ''
    project_match_blocked: {}
    project_match_overrides: {}
    project_review_notes: []
    project_source_format: ''
    project_sparse_checkout: false
    project_version: current
    timeout: '600'
  file_test: data/original/manifest.yaml
  retries_until_complete: 0
