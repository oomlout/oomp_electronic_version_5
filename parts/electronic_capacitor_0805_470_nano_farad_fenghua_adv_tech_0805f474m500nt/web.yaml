      Fenghua Advanced Tech) Y5V +/-20% SKU (0805F474M500NT, 50 V), so it gets its own maker/mpn variant ID linked via generic_oomp_id,
      following the established variant taxonomy. Rating comparison from the staged capture: same 470 nF value and package,
      same 50 V rating, but Y5V +/-20% is a materially broader-tolerance, worse-stability dielectric than the X7R +/-10% preference
      - the variant must never replace the X7R preference. Two-terminal MLCC (pin_count 2); stock 3,831 at capture recorded
      as observed.'
