research_notes:
- Verified JLC C2065 / CX (Dongguan Chengxing Elec) KS225M050C07RR0VH2FP0 as the first
  reviewed preferred extended purchasing choice for this previously absent leaded
  electrolytic value; the populate row was added by this intake. The KS ordering code
  (225 = 2.2 uF, M = +/-20%, 050 = 50 V) decodes consistently with the listed specifications;
  the live page specification table is the primary evidence.
- Leaded (radial through-hole) aluminum electrolytic, D4 x L7 mm, 1.5 mm pin spacing,
  1000 hrs at 105 C lifetime, -40 C to +105 C, ripple current 19 mA at 120 Hz; polarized,
  observe the marked negative stripe. Live JLC detail page (staged capture 2026-09-28)
  shows Extended (Promotional Extended), stock 21,917, minimum 1, full reel 1,000,
  available order qty 21,843. No datasheet PDF imported at intake; download is an
  integration-stage task (JLC lists https://jlc-prod-smt.oss-eu-central-1.aliyuncs.com/smtDataManualFile/8588895826516561920-C2065.pdf).
