jlcpcb_selection:
  compatibility_notes: 'Second code on the existing generic 1206 330 pF capacitor:
    the plain generic ID keeps its reviewed preference C1862 (FH 1206B331K500NT, X7R
    +/-10% 50 V). C1907 is the exact FH C0G +/-5% SKU (1206CG331J500NT, 50 V) from
    the same maker, so it gets its own maker/mpn variant ID linked via generic_oomp_id,
    following the established variant taxonomy. Rating comparison from the staged
    capture: same 330 pF value, package and 50 V rating, but C0G +/-5% is the more
    stable, tighter-tolerance dielectric than the X7R +/-10% preference; projects
    needing C0G stability at 330 pF/1206 should pick this variant explicitly and the
    X7R preference is not downgraded. Two-terminal MLCC (pin_count 2); stock 4,002
    recorded as observed. Edits made under the capacitor family lock.'
