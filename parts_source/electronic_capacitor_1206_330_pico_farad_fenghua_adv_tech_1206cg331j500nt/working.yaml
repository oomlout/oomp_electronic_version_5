research_notes:
- Exact FH (Guangdong Fenghua Advanced Tech) C1907 / 1206CG331J500NT purchasing variant;
  1206, 330 pF, 50 V, C0G, ±5% verified against the staged live JLC capture 2026-09-28
  (stock 4,002, minimum 1, full reel 4,000, available order qty 3,998, MSL 1).
- 'Linked to the generic 1206 330 pF definition. Dielectric difference: the reviewed
  preference C1862 / 1206B331K500NT on the generic ID is from the same maker (FH)
  but X7R ±10%, and it keeps the preference slot; this C1907 SKU is C0G ±5% - the
  more stable, tighter-tolerance dielectric of the two. Projects needing C0G stability
  at 330 pF/1206 should pick this variant explicitly; the X7R preference is not downgraded.
  The registry allows one preferred code per ID; C1907 is recorded as its own exact
  variant ID.'
- No datasheet PDF imported at intake; download is an integration-stage task (JLC
  lists https://jlc-prod-smt.oss-eu-central-1.aliyuncs.com/smtDataManualFile/8770991668856135680-C1907.pdf).
