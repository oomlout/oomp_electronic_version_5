research_notes:
- 'Verified JLC C2064 / CX (Dongguan Chengxing Elec) KM477M035G17RR0VH2FP0 as the
  first reviewed preferred extended purchasing choice for this previously absent leaded
  electrolytic value; the populate row was added by this intake. The KM ordering code
  (477 = 470 uF, M = +/-20%, 035 = 35 V) decodes consistently with the listed specifications;
  the live page specification table is the primary evidence. Distinct from the C2033
  470 uF 10 V part (D8 x L12 mm): same capacitance, higher voltage, larger can.'
- Leaded (radial through-hole) aluminum electrolytic, D10 x L17 mm, 5 mm pin spacing,
  2000 hrs at 105 C lifetime; polarized, observe the marked negative stripe. Live
  JLC detail page (staged capture 2026-09-28) shows Extended (Promotional Extended),
  stock 38,410, minimum 1, full reel 200, available order qty 36,502. No datasheet
  PDF imported at intake; download is an integration-stage task (JLC lists https://jlc-prod-smt.oss-eu-central-1.aliyuncs.com/smtDataManualFile/8588887028632571904-C2064.pdf).
