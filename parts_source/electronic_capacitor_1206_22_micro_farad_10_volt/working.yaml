jlcpcb_selection:
  compatibility_notes: 'Second code on the existing generic 1206 22 uF capacitor:
    the plain generic ID keeps its reviewed preference C12891 (Samsung CL31A226KAHNNNE,
    25 V X5R +/-10%). C1859 is the exact FH 10 V rated SKU (1206X226K100NT, X5R +/-10%),
    so it gets its own rated-variant ID (10_volt suffix) linked via generic_oomp_id,
    following the established rated-variant taxonomy (as with the C1592 16 V row).
    Rating comparison from the staged capture: same 22 uF value, package and X5R +/-10%,
    but 10 V is a lower rating than the 25 V preference - the variant must never silently
    replace the 25 V part in higher-voltage circuits; it exists so 10 V-class designs
    can pick the exact SKU explicitly. Two-terminal MLCC (pin_count 2); stock 76,002
    recorded as observed. Edits made under the capacitor family lock.'
