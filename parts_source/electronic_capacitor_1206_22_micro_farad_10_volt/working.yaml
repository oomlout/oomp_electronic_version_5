research_notes:
- Exact FH (Guangdong Fenghua Advanced Tech) C1859 / 1206X226K100NT rated purchasing
  variant; 1206, 22 uF, 10 V, X5R, ±10% verified against the staged live JLC capture
  2026-09-28 (stock 76,002, minimum 1, full reel 2,000, available order qty 75,945,
  MSL 1). The Fenghua ordering code (X = X5R, 226 = 22 uF, K = +/-10%, 100 = 10 V)
  decodes consistently with the listed specifications.
- 'Linked to the generic 1206 22 uF definition. IMPORTANT rating difference: the reviewed
  preference C12891 / CL31A226KAHNNNE on the generic ID is the 25 V rated part; this
  C1859 SKU is the 10 V part and must never silently replace it in circuits that need
  the higher rating. It exists so projects that only need 10 V at 1206/22 uF can pick
  the exact SKU explicitly. The registry allows one preferred code per ID; C1859 is
  recorded as its own exact rated-variant ID.'
- No datasheet PDF imported at intake; download is an integration-stage task (JLC
  lists https://jlc-prod-smt.oss-eu-central-1.aliyuncs.com/smtDataManualFile/8770991381764550656-C1859.pdf).
