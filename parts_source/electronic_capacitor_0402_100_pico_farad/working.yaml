research_notes:
- 'The official JLC page lists Basic Fenghua 0402CG101J500NT (C1546): 100 pF, 50 V,
  C0G, +-5% in 0402.'
- The Fenghua ordering code decodes exactly to that suffix (CG = C0G, 101 = 100 pF,
  J = +-5%, 500 = 50 V), and the C0G 0402 table covers 100 pF at 50 V.
- Non-polarized two-terminal chip; the standard built-in 0402 chip renderer draws
  the package from the verified dimensions.
