display_render:
  description: Selected CCO MOF3WS is rated 3 W despite the legacy quarter-watt catalogue
    ID. The 15.5 × 5 mm KiCad body matches nominal dimensions; formed leads are 20.32
    mm apart. The existing catalogue footprint and dimensions describe a much smaller
    part and need review. Blue coating is illustrative; CCO specifies gray or pink.
    Blue body shade is illustrative. Documented four-band value code; stripe spacing
    and shades are illustrative. Marking composited in linear light from shared path-traced
    material passes; indirect reflections are approximate.
