- JLC house-parts queue row C6066 (Nexperia 74LVC14APW,118, TSSOP-14, 14 pins) verified
  at intake; family batch integration C6066.
- Shares the 74LVC14 family datasheet downloaded into C6065 (byte-identical copy in
  this part's source folder).
- Pin table generated from the KiCad 74xx:74HC14 master and cross-checked pad-for-pad
  (pin numbers and electrical types); no-connect pins filled to the 14-pin package
  count.
- Footprint Package_SO:TSSOP-14_4.4x5mm_P0.65mm verified present in the KiCad 10 library.
