    registry has no preference for this ID (checked reviewed_choices.json for C1563
    and 0402CG390J500NT: no entries; no 39_pico entry at all). Following the missing-value
    decision row and the C1544/C1556 precedents, one explicit 0402 39_pico_farad row
    was added and C1563 becomes its first reviewed preferred house identity: FH (Guangdong
    Fenghua Advanced Tech) 0402CG390J500NT, 39 pF, 50 V, C0G, +/-5% (listed on the
    page), 0402 MLCC. Verified two-terminal non-polarized chip; the Fenghua ordering
    code 390/J/500 decodes consistently with the listed 39 pF, +/-5%, 50 V. Edits
    made under the capacitor family lock.'
