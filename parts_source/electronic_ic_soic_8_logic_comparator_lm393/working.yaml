    down the left and vcc/2out/2in-/2in+ up the right, pin-1 circle at the top-left,
    no mirrored view, no label overlap, no cropping. working_svg_square_pins.png:
    hero image titled IC LM393DR2G SOIC 8 with silkscreen code 2P9YL and legible pin
    names. working_svg_dimensioned.png: 3.9 x 4.9 mm body dimensions with arrows.
    working_svg_outline.png: clean outline. data/kicad/machine_solder footprint: 8
    roundrect pads 1.95x0.6 mm at the verified JEDEC MS-012 positions (pad 1 top-left,
    1.27 pitch); hand_solder copy is the same official master; generated symbol renamed
    to the OOMP ID with Value IC LM393DR2G SOIC 8, Footprint OOMP_MachineSolder link,
    three units matching the datasheet pin table. README.md: maker part number LM393DR2G,
    LCSC/JLC C7955 links, ratings dimensions, pin table, and a datasheet link that
    resolves to data/datasheet.pdf. Limitation: KiCad symbol/footprint were checked
    as text/s-expression files rather than rendered in a KiCad GUI session.'
