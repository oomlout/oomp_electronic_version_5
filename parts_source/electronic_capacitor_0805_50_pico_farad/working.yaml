research_notes:
- Verified JLC C1823 / Fenghua 0805CG500J500NT as the first reviewed preferred extended
  purchasing choice for this previously absent generic 0805 50 pF value; the populate
  row was added by this intake. The Fenghua ordering code (CG = C0G, 500 = 50 x 10^0
  pF, J = +/-5%, 500 = 50 V) decodes consistently with the listed specifications;
  the live page specification table is the primary evidence. Distinct from the 0603
  50 pF generic supplied by C1672.
- Live JLC detail page (staged capture 2026-09-28) shows Extended (Promotional Extended),
  0805, 50 pF, 50 V, C0G, +/-5%, stock 20,176, minimum 1, full reel 4,000, available
  order qty 19,984, MSL 1. No datasheet PDF imported at intake; download is an integration-stage
  task (JLC lists https://jlc-prod-smt.oss-eu-central-1.aliyuncs.com/smtDataManualFile/8770991186151006208-C1823.pdf).
