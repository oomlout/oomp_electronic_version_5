research_notes:
- Exact Samsung Electro-Mechanics C1872 / CL31B475KAHNNNE rated purchasing variant;
  1206, 4.7 uF, 25 V, X7R, ±10% verified against the staged live JLC capture 2026-09-28
  (stock 33,006, minimum 1, full reel 2,000, available order qty 22,228, MSL 1). The
  Samsung ordering code (KA = X7R 25 V) decodes consistently with the listed specifications.
- 'Linked to the generic 1206 4.7 uF definition. IMPORTANT rating difference: the
  reviewed preference C29823 / 1206B475K500NT on the generic ID is the 50 V rated
  part; this C1872 SKU is the 25 V part and must never silently replace it in circuits
  that need the higher rating. It exists so projects that only need 25 V at 1206/4.7
  uF can pick the exact SKU explicitly. The registry allows one preferred code per
  ID; C1872 is recorded as its own exact rated-variant ID.'
- No datasheet PDF imported at intake; download is an integration-stage task (JLC
  lists https://jlc-prod-smt.oss-eu-central-1.aliyuncs.com/smtDataManualFile/8586178191673741312-C1872.pdf).
