jlcpcb_selection:
  compatibility_notes: 'Second code on the existing generic 1206 4.7 uF capacitor:
    the plain generic ID keeps its reviewed preference C29823 (FH 1206B475K500NT,
    50 V X7R +/-10%). C1872 is the exact Samsung 25 V rated SKU (CL31B475KAHNNNE,
    X7R +/-10%), so it gets its own rated-variant ID (25_volt suffix) linked via generic_oomp_id,
    following the established rated-variant taxonomy (as with the C1592 16 V row).
    Rating comparison from the staged capture: same 4.7 uF value, package and X7R
    +/-10%, but 25 V is a lower rating than the 50 V preference - the variant must
    never silently replace the 50 V part in higher-voltage circuits; it exists so
    25 V-class designs can pick the exact SKU explicitly. Two-terminal MLCC (pin_count
    2); stock 33,006 recorded as observed. Edits made under the capacitor family lock.'
