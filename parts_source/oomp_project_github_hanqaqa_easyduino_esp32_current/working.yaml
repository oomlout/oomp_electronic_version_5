project_match_blocked:
  U1: BOM C6568, upstream PDF and README identify CP2102-GMR, but the actual schematic
    symbol is CP2102N-Axx-xQFN28. CP2102-GMR has been added to OOMP; confirm which
    chip is intended before accepting a match.
  U4: 'ESP32-DevKitC is a combined 38-pad carrier/header footprint, not an additional
    DevKit board: the source photo shows two 19-pin male headers. Both headers already
    exist as electronic_connector_header_2_54_mm_pitch_through_hole_19_pin, but a
    one-footprint-to-two-parts mapping needs confirmation. Do not buy another DevKitC.'
