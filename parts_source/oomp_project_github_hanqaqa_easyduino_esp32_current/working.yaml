project_review_notes:
- 'J1: C2765186 and the supplied USBC.pdf identify SHOU HAN TYPE-C 16PIN 2MD(073),
  while the footprint is named G-Switch GT-USB-7010ASV. OOMP follows the BOM/PDF identity;
  the original footprint remains unchanged pending land-pattern verification.'
- 'D1: C7074 is Littelfuse SP0503BAHTG. The upstream ESD_Protection.pdf is TECH PUBLIC,
  so OOMP uses the downloaded Littelfuse datasheet instead.'
- 'C5/C7/C8: C11366 is AVX TAJA226K010RNJ, 22uF 10V, A-case 3216-18. The upstream
  Kemet-I footprint name specifies a lower 1.0mm body; verify clearance for the actual
  1.8mm capacitor.'
- 'SW1/SW2: C720477 is XUNPU TS-1088-AR02016, not Alps. The original Alps_SKRK footprint
  is retained; exact master compatibility has not been certified.'
