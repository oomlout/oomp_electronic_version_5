research_notes:
- 5.0 mm wire-protector screw-terminal style anchored on the 4UCON 1406 series (DIP
  180 degrees, H=10 mm, blue insulator); the generic family covers the standard lengths
  in this style.
- 'Insulator color variant: blue.'
- 4UCON series 1406 item 19936 = 8P (blue insulator; 4uconnector.com listing checked
  2026-10-01).
- 'Top view follows the built 3-pin exemplar style: body length positions x pitch
  with chamfered screw circles at every position and the pin row on the board side.
  Nominal drawing dimensions.'
