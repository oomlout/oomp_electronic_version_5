research_notes:
- Exact FH (Guangdong Fenghua Advanced Tech) C1778 / 0805F474M500NT purchasing variant;
  0805, 470 nF, 50 V, Y5V, ±20% verified against the staged live JLC capture 2026-09-28
  (stock 3,831, minimum 1, full reel 4,000, available order qty 3,798).
- 'Linked to the generic 0805 470 nF definition. IMPORTANT dielectric difference:
  the reviewed Basic preference C13967 / CL21B474KBFNNNE (Samsung, X7R ±10% 50 V)
  on the generic ID is far more stable than this Y5V ±20% SKU. It must never replace
  the X7R preference, and projects requiring X7R stability must not substitute this
  SKU. The registry allows one preferred code per ID; C1778 is recorded as its own
  exact variant ID.'
- No datasheet PDF imported at intake; download is an integration-stage task (JLC
  lists https://jlc-prod-smt.oss-eu-central-1.aliyuncs.com/smtDataManualFile/8770990678056808448-C1778.pdf).
