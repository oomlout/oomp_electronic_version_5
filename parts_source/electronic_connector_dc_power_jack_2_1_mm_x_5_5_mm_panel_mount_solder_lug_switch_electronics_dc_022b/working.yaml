drawing_note: Panel opening Ø8 mm, maximum panel thickness 4 mm, M8 × 1 thread. For
  anti-rotation, use a double-D opening based on Ø8 mm arcs and 6.8 mm across flats.
  These are nominal shaft dimensions. Check the actual socket and allow clearance
  before cutting. Rated 30 V DC / 0.5 A. The supplier lists 18.2 × Ø10.2 mm (length
  × body diameter). The mechanical drawing and model use the datasheet nominal 17.8
  × Ø10.0 mm, excluding nut. Lug 4 is centre and lug 5 is sleeve. Circuit polarity
  is set by the wiring.
