research_notes:
- 'The official JLC page lists Basic Nexperia BAV99,215 (C2500): dual series switching
  diode, 100 V, 215 mA, 4 ns in SOT-23; reconfirmed live 2026-10-02 (stock 1,146,158).'
- Browser-downloaded the Nexperia BAV99 product data sheet (10 pages, 1 July 2022)
  into this part; it anchors the SOT-23 dual switching diode family.
- 'POLARITY MIRROR: the pinning table gives 1 = A1, 2 = K2, 3 = K1/A2, but the KiCad
  Diode:BAV99 symbol numbers pins 1 = K / 2 = A / 3 = junction - mirrored vs the vendor;
  designs must compensate (custom symbol or pin swap) before assembly.'
