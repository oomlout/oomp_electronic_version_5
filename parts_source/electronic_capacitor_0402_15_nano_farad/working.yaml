research_notes:
- Verified JLC C1583 / Fenghua 0402F153M500NT as the first reviewed preferred extended
  purchasing choice for this previously absent generic 0402 15 nF value; the populate
  row was added by this intake. The Fenghua ordering code (F = Y5V, 153 = 15 x 10^3
  pF, M = +/-20%, 500 = 50 V) decodes consistently with the listed specifications;
  the live page specification table is the primary evidence.
- Live JLC detail page (staged capture 2026-09-28) shows Extended (Promotional Extended),
  0402, 15 nF, 50 V, Y5V, +/-20%, stock 2, minimum 1, full reel 10,000, available
  order qty 2, MSL 1. Stock is nearly depleted at capture time; low stock does not
  change the verified identity and the part is retained as a candidate. No datasheet
  PDF imported at intake; download is an integration-stage task (JLC lists https://jlc-prod-smt.oss-eu-central-1.aliyuncs.com/smtDataManualFile/8770987873841893376-C1583.pdf).
