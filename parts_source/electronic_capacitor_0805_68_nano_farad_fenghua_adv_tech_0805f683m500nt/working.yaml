research_notes:
- Exact FH (Guangdong Fenghua Advanced Tech) C1781 / 0805F683M500NT purchasing variant;
  0805, 68 nF, 50 V, Y5V, ±20% verified against the staged live JLC capture 2026-09-28
  (stock 92, minimum 1, full reel 4,000, available order qty 91).
- 'Linked to the generic 0805 68 nF definition. IMPORTANT dielectric difference: the
  reviewed preference C1756 / 0805B683K500NT on the generic ID is from the same maker
  (FH) but X7R ±10%, far more stable than this Y5V ±20% SKU. It must never replace
  the X7R preference, and projects requiring X7R stability must not substitute this
  SKU. The registry allows one preferred code per ID; C1781 is recorded as its own
  exact variant ID.'
- No datasheet PDF imported at intake; download is an integration-stage task (JLC
  lists https://jlc-prod-smt.oss-eu-central-1.aliyuncs.com/smtDataManualFile/8770990691084181504-C1781.pdf).
