jlcpcb_selection:
  compatibility_notes: 'Second code on the existing generic 0805 68 nF capacitor:
    the plain generic ID keeps its reviewed preference C1756 (FH 0805B683K500NT, X7R
    +/-10% 50 V). C1781 is the exact FH Y5V +/-20% SKU (0805F683M500NT, 50 V) from
    the same maker, so it gets its own maker/mpn variant ID linked via generic_oomp_id,
    following the established variant taxonomy. Rating comparison from the staged
    capture: same 68 nF value, package and 50 V rating, but Y5V +/-20% is a materially
    broader-tolerance, worse-stability dielectric than the X7R +/-10% preference -
    the variant must never replace the X7R preference. Two-terminal MLCC (pin_count
    2); stock 92 at capture recorded as observed.'
