  description: Illustrative KiCad TSSOP-48 model is 1.0 mm high; TI DGG0048A body
    is 12.4-12.6 x 6.0-6.2 mm and maximum height 1.2 mm. Catalogue lists 10 x 5 mm
    without width reference, height or footprint, conflicting with this example. Catalogue
    MPN SN74ALVC16244ADGGRG4 differs from TI-listed 74ALVC16244ADGGRG4; exact equivalence
    unverified. Not a verified mechanical model. Texas Instruments lists ALVC16244A
    as the package marking for represented example 74ALVC16244ADGGRG4; exact catalogue
    MPN equivalence is unverified. Typeface, orientation, placement and variable lot/date
    details are illustrative. Marking composited in linear light from shared path-traced
    material passes; indirect reflections are approximate.
