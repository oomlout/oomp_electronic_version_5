research_notes:
- 'The official JLC page lists Basic Samsung CL10B102KB8NNNC (C1588): 1 nF, 50 V,
  X7R, +-10% in 0602..0603; reconfirmed live 2026-10-01.'
- The Samsung ordering decode covers the exact suffix, and the X7R Product Lineup
  table (page 25 row 51) lists CL10B102KB8NNN + packaging code C.
- Non-polarized two-terminal chip; the standard built-in 0603 chip renderer draws
  the package from the verified dimensions.
