research_notes:
- 'The official JLC page lists Basic Jiangsu Changjing S8050 J3Y(RANGE:200-350) (C2146):
  25 V NPN, 500 mA, 300 mW, hFE rank 200-350 in SOT-23; reconfirmed live 2026-10-02
  (stock 1,341,936).'
- Browser-downloaded the Changjing S8050 datasheet (4 pages, Rev 2.0) into this part;
  it anchors the Changjing S8050 SOT-23 family.
- 'Datasheet pinout page 1: 1 = BASE, 2 = EMITTER, 3 = COLLECTOR; Transistor_BJT:Q_NPN_BEC
  matches pad-for-pad. The library''s Transistor_BJT:S8050 symbol extends Q_NPN_EBC
  (1 E / 2 B / 3 C), another vendor''s convention - deliberately not used; the Changjing
  datasheet is authoritative.'
