    1) left-lower, collector (pin 3) right, matching the datasheet pinout page 1 (1
    = BASE, 2 = EMITTER, 3 = COLLECTOR). working_svg_dimensioned.png: SOT-23 (JEDEC
    TO-236 Var AB) outline per the Package_TO_SOT_SMD:SOT-23 master geometry (datasheet
    carries ratings and pinout but no dimension table; recorded in dimension_reference).
    data/kicad manifest complete with Transistor_BJT:Q_NPN_BEC symbol and Package_TO_SOT_SMD:SOT-23
    machine + SOT-23_Handsoldering hand footprints (the library S8050 symbol with
    the EBC ordering deliberately not used - discrepancy recorded). README.md: S8050
