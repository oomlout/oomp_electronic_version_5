research_notes:
- 'The official JLC page lists Basic Sunlord GZ1608D601TF (C1002): 600 ohm at 100
  MHz, DCR 450 mOhm, 200 mA, 1 circuit, +-25%, -55 to +125 C; reconfirmed live 2026-09-30.'
- 'The Sunlord ordering decode covers the full suffix: GZ general chip bead, 1608
  [0603] 1.6 x 0.8 mm, D material, 601 = 600 ohm, T tape and reel, F hazardous-substance-free.'
- Non-polarized two-terminal chip; the standard built-in 0603 chip renderer draws
  the package from the verified dimensions above.
- Rated-current derating above +85 C applies only to beads rated 1000 mA and above,
  so it does not apply to this 200 mA part.
