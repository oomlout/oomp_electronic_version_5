  footprint_checked: true
  official_url: https://jlcpcb.com/partdetail/Sunlord-GZ1608D601TF/C1002
  pcba_min_qty_observed: null
  pinout_checked: true
  purchase_moq_observed: 1
  ratings:
    Current Rating: 200mA
    DC Resistance(DCR): 450mΩ
    Impedance @ Frequency: 600Ω@100MHz
    Number of Circuits: '1'
    Operating Temperature: -55℃~+125℃
    Tolerance: ±25%
  stock_observed: 778420
  tier: basic
  tier_label_observed: Basic
  verified_on: '2026-09-30'
  visual_review: 'Inspected 2026-09-30 after the build. data/working_svg_assembly_pins.png
    and _300 preview: 0603 chip with terminal_1 on the left and terminal_2 on the
    right, non-polarized symmetric body, no mirroring, no label overlap, no cropping.
    working_svg_square_pins.png hero titled Ferrite Bead GZ1608D601TF 0603 with pin
    1 left and pin 2 right. working_svg_dimensioned.png: 1.6 x 0.8 mm body with arrows,
    matching the Sunlord GZ1608 nominals. data/kicad manifest complete with Device:FerriteBead_Small
    symbol and Inductor_SMD:L_0603_1608Metric machine + Pad1.05x0.95mm_HandSolder
    hand footprints; kicad_symbol_unit_1.png shows the standard bead glyph with the
    OOMP value; machine and hand footprint renders show two 0603 pads with courtyard
    and body outline. README.md: GZ1608D601TF part number, LCSC/JLC C1002 links, pin
    table, datasheet link resolving to data/datasheet.pdf (6.7 MB scan of the Sunlord
    GZ series catalogue). Limitation: KiCad symbol/footprint checked as rendered SVG/PNG
    plus s-expression text rather than in a KiCad GUI.'
