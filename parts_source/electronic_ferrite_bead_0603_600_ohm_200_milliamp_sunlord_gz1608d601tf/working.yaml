jlcpcb_selection:
  compatibility_notes: Exact ferrite bead identity. The existing generic 0603 600
    ohm bead is rated 500 milliamp and carries no maker, so it was not replaced; the
    Sunlord 200 milliamp part is a distinct lower-current identity. Added one explicit
    family row electronic_ferrite_bead_0603_600_ohm_200_milliamp_sunlord_gz1608d601tf
    using the established package/impedance/current_rating/maker taxonomy, and added
    the reviewed-choices adapter to the ferrite_bead family extras. Full-pass datasheet
    evidence confirms the identity and ratings.
  datasheet_pages:
    dimensions:
    - 1
    document: Sunlord Multilayer Chip Ferrite Bead GZ series catalogue, rev. 2024/6/19
    electrical_characteristics:
