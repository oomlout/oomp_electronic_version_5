research_notes:
- Exact Samsung Electro-Mechanics C1945 / CL31B104KCFNNNE rated purchasing variant;
  1206, 100 nF, 100 V, X7R, ±10% verified against the staged live JLC capture 2026-09-28
  (stock 411,314, minimum 1, full reel 2,000, available order qty 374,557, MSL 1).
  The Samsung ordering code (KC = X7R 100 V) decodes consistently with the listed
  specifications.
- 'Linked to the generic 1206 100 nF definition. Rating difference: the reviewed preference
  C24497 / CL31B104KBCNNNE on the generic ID is the 50 V part; this C1945 SKU is the
  100 V part and must be chosen explicitly for higher-voltage circuits. The registry
  allows one preferred code per ID; C1945 is recorded as its own exact rated-variant
  ID.'
- No datasheet PDF imported at intake; download is an integration-stage task (JLC
  lists https://jlc-prod-smt.oss-eu-central-1.aliyuncs.com/smtDataManualFile/8586178200505999360-C1945.pdf).
