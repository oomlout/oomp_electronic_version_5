  compatibility_notes: 'Second code on the existing generic 1206 100 nF capacitor:
    the plain generic ID keeps its reviewed preference C24497 (Samsung CL31B104KBCNNNE,
    X7R +/-10% 50 V). C1945 is the exact Samsung 100 V rated SKU (CL31B104KCFNNNE,
    X7R +/-10%), so it gets its own rated-variant ID (100_volt suffix) linked via
    generic_oomp_id, following the established rated-variant taxonomy (as with the
    C1592 16 V row). Rating comparison from the staged capture: same 100 nF value,
    package and X7R +/-10%, but 100 V is a higher rating than the 50 V preference
    - projects needing 100 V should pick this variant explicitly; the 50 V preference
    stays on the generic. Two-terminal MLCC (pin_count 2); stock 411,314 recorded
    as observed. Edits made under the capacitor family lock.'
