research_notes:
- The Bus Pirate fitted BOM identifies the brand as SZHTC and the part as QT200H1201.
- 'The browser-downloaded Surenoo manual explicitly labels its mechanical drawing
  PRODUCT NO: QT200H1201.'
- LCSC search returned zero exact QT200H1201 results, so no LCSC number is recorded.
- The product is a 2.0 inch module with 12 flex contacts; TFT_20 means 2.0 inch, not
  20 pins.
