research_notes:
- Verified JLC C2033 / CX (Dongguan Chengxing Elec) GR477M010F12RR0VL4FP0 as the first
  reviewed preferred extended purchasing choice for this previously absent leaded
  electrolytic value; the populate row was added by this intake. The GR ordering code
  (477 = 470 uF, M = +/-20%, 010 = 10 V) decodes consistently with the listed specifications;
  the live page specification table is the primary evidence.
- Leaded (radial through-hole) aluminum electrolytic, D8 x L12 mm, 3.5 mm pin spacing,
  3000 hrs at 105 C lifetime, -40 C to +105 C; polarized, observe the marked negative
  stripe. Live JLC detail page (staged capture 2026-09-28) shows Extended (Promotional
  Extended), stock 2, minimum 1, full reel 500, available order qty 2. Stock is extremely
  low at capture time; low stock does not change the verified identity and the part
  is retained as a candidate. No datasheet PDF imported at intake; download is an
  integration-stage task (JLC lists https://jlc-prod-smt.oss-eu-central-1.aliyuncs.com/smtDataManualFile/8588901546444926976-C2033.pdf).
