- JLC house-parts queue row C5587 (Nexperia 74HC00PW,118, TSSOP-14, 14 pins) verified
  at intake; family batch integration C5587.
- Shares the 74HC00 family datasheet downloaded into C5586 (byte-identical copy in
  this part's source folder).
- Pin table generated from the KiCad 74xx:74HC00 master and cross-checked pad-for-pad
  (pin numbers and electrical types); no-connect pins filled to the 14-pin package
  count.
- Footprint Package_SO:TSSOP-14_4.4x5mm_P0.65mm verified present in the KiCad 10 library.
