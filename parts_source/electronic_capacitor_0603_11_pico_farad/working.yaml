research_notes:
- Verified JLC C1641 / Fenghua 0603CG110J500NT as the first reviewed preferred extended
  purchasing choice for this previously absent generic 0603 11 pF value; the populate
  row was added by this intake. The Fenghua ordering code (CG = C0G, 110 = 11 x 10^0
  pF, J = +/-5%, 500 = 50 V) decodes consistently with the listed specifications;
  the live page specification table is the primary evidence. The live page reads 11
  pF, which is a distinct value from the in-grid 10 pF generic.
- Live JLC detail page (staged capture 2026-09-28) shows Extended (Promotional Extended),
  0603, 11 pF, 50 V, C0G, +/-5%, stock 17,987, minimum 1, full reel 4,000, available
  order qty 17,805, MSL 1. No datasheet PDF imported at intake; download is an integration-stage
  task (JLC lists https://jlc-prod-smt.oss-eu-central-1.aliyuncs.com/smtDataManualFile/8770988033523376128-C1641.pdf).
