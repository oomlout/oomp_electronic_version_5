research_notes:
- 'The official JLC page lists Basic Sunlord GZ2012D601TF (C1017): 600 ohm at 100
  MHz, DCR 300 mOhm, 500 mA, 1 circuit, +-25%, -55 to +125 C; reconfirmed live 2026-09-30.'
- 'The Sunlord ordering decode covers the full suffix: GZ general chip bead, 2012
  [0805] 2.0 x 1.25 mm, D material, 601 = 600 ohm, T tape and reel, F hazardous-substance-free.'
- Non-polarized two-terminal chip; the standard built-in 0805 chip renderer draws
  the package from the verified dimensions above.
- Rated-current derating above +85 C applies only to beads rated 1000 mA and above,
  so it does not apply to this 500 mA part.
