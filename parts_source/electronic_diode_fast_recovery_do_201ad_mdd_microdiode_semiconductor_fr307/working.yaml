    or the parts registry. Added eleven exact through-hole rows under the diode family
    lock (six rectifier: 1N4001/1N4007G DO-41, 1N5401/1N5408 DO-201AD, 6A10/10A10
    R-6; five fast_recovery: FR104/FR107 DO-41, FR157/FR207 DO-15, FR307 DO-201AD),
    all MDD (Microdiode Semiconductor) per the existing exact-row convention. FR307
    (DO-201AD, 1kV 3A, trr 500ns, 200A surge) is its exact first reviewed preferred
    house choice. Rating comparison from the staged capture: through-hole body, 2
    pins. Edits made under the diode family lock. Rating comparison from the staged
    capture: Diodes/Fast Recovery / High Efficiency Diodes, package DO-201AD, stock
    26602 recorded as observed. Edits made under the diode family lock.'
