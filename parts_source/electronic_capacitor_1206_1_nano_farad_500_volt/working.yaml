research_notes:
- Exact FH (Guangdong Fenghua Advanced Tech) C1942 / 1206B102K501NT rated purchasing
  variant; 1206, 1 nF, 500 V, X7R, ±10% verified against the staged live JLC capture
  2026-09-28 (stock 25,395, minimum 1, full reel 4,000, available order qty 24,779,
  MSL 1). The Fenghua ordering code (102 = 1 nF, K = +/-10%, 501 = 50 x 10^1 V = 500
  V) decodes consistently with the listed specifications.
- 'Linked to the generic 1206 1 nF definition. Rating difference: the reviewed preference
  C1845 / 1206B102K500NT on the generic ID is the 50 V part; this C1942 SKU is the
  500 V part and must be chosen explicitly for high-voltage circuits. It sits between
  the plain 50 V generic and the 1 kV (C1941) and 2 kV (C9196) rated variants. The
  registry allows one preferred code per ID; C1942 is recorded as its own exact rated-variant
  ID.'
- No datasheet PDF imported at intake; download is an integration-stage task (JLC
  lists https://jlc-prod-smt.oss-eu-central-1.aliyuncs.com/smtDataManualFile/8770991862843101184-C1942.pdf).
