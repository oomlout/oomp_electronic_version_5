jlcpcb_selection:
  compatibility_notes: 'Second code on the existing generic 1206 1 nF capacitor: the
    plain generic ID keeps its reviewed preference C1845 (FH 1206B102K500NT, X7R +/-10%
    50 V); 1 kV (C1941) and 2 kV (C9196) rated variants already exist. C1942 is the
    exact FH 500 V rated SKU (1206B102K501NT, X7R +/-10%), so it gets its own rated-variant
    ID (500_volt suffix) linked via generic_oomp_id, following the established rated-variant
    taxonomy. Rating comparison from the staged capture: same 1 nF value, package
    and X7R +/-10%, but 500 V is a higher rating than the 50 V preference - projects
    needing 500 V should pick this variant explicitly; the 50 V preference stays on
    the generic. Two-terminal MLCC (pin_count 2); stock 25,395 recorded as observed.
    Edits made under the capacitor family lock.'
