research_notes:
- Exact FH (Guangdong Fenghua Advanced Tech) C1767 / 0805F183M500NT purchasing variant;
  0805, 18 nF, 50 V, Y5V, ±20% verified against the staged live JLC capture 2026-09-28.
- 'Linked to the generic 0805 18 nF definition. IMPORTANT dielectric difference: the
  reviewed preference C1723 / 0805B183K500NT on the generic ID is X7R ±10%; this FH
  SKU is Y5V ±20%, a materially broader-tolerance, worse-stability dielectric. It
  must never replace the X7R preference, and projects requiring X7R stability must
  not substitute this SKU. The registry allows one preferred code per ID; C1767 is
  recorded as its own exact variant ID.'
- No datasheet PDF imported at intake; download is an integration-stage task (JLC
  lists https://jlc-prod-smt.oss-eu-central-1.aliyuncs.com/smtDataManualFile/8770988641038274560-C1767.pdf).
