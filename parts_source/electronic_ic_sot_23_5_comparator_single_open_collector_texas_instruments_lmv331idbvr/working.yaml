research_notes:
- The Bus Pirate analogue page identifies U602 as an LMV331 comparator in SOT-23-5
  and links this exact TI example.
- The supplier listing resolves to Texas Instruments LMV331IDBVR, LCSC C34731.
- The TI datasheet confirms the open-collector output, 2.7 V to 5.5 V supply range,
  five-pin assignment and DBV package dimensions.
