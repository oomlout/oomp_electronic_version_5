research_notes:
- JLC house-parts queue row C5419 (Texas Instruments SN74HC164DR, SOIC-14-150mil,
  14 pins) verified at intake; family batch integration C5419.
- Downloaded the official Texas Instruments 74HC164 data sheet directly from ti.com
  into this part.
- Pin table generated from the KiCad 74xx:74HC164 master and cross-checked pad-for-pad
  (pin numbers and electrical types); no-connect pins filled to the 14-pin package
  count.
- Footprint Package_SO:SOIC-14_3.9x8.7mm_P1.27mm verified present in the KiCad 10
  library.
