- 'The official JLC page lists Basic UNI-ROYAL 4D03WGJ0472T5E (C1980): 4 x 4.7 kOhm,
  1/16 W, +-5%, +-200 ppm/C in 0603x4 convex; reconfirmed live 2026-10-01 (stock 2,009,626).'
- Browser-downloaded the Uniroyal array series datasheet (14 pages, 2017/06/12) into
  this part; it anchors the resistor-array family (no shared copy).
- 'Pin pairing per the datasheet equivalent circuit and the KiCad masters: R1 = 1-8,
  R2 = 2-7, R3 = 3-6, R4 = 4-5 (Device:R_Pack04_Split matches Resistor_SMD:R_Array_Convex_4x0603
  pad-for-pad).'
