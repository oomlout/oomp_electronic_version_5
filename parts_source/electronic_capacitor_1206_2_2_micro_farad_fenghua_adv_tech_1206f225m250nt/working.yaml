jlcpcb_selection:
  compatibility_notes: 'Second code on the existing generic 1206 2.2 uF capacitor:
    the plain generic ID keeps its reviewed preference C1855 (FH 1206B222K500NT, X7R
    +/-10% 50 V). C1933 is the exact FH Y5V +/-20% 25 V SKU (1206F225M250NT), so it
    gets its own maker/mpn variant ID linked via generic_oomp_id, following the established
    variant taxonomy. Rating comparison from the staged capture: same 2.2 uF value
    and package, but Y5V +/-20% at 25 V is a materially broader-tolerance, worse-stability
    dielectric at a lower rating than the X7R +/-10% 50 V preference - the variant
    must never replace the X7R preference. Two-terminal MLCC (pin_count 2); stock
    3,681 recorded as observed. Edits made under the capacitor family lock.'
