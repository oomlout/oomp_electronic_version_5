research_notes:
- Exact FH (Guangdong Fenghua Advanced Tech) C1933 / 1206F225M250NT purchasing variant;
  1206, 2.2 uF, 25 V, Y5V, ±20% verified against the staged live JLC capture 2026-09-28
  (stock 3,681, minimum 1, full reel 4,000, available order qty 3,665, MSL 1).
- 'Linked to the generic 1206 2.2 uF definition. IMPORTANT dielectric difference:
  the reviewed preference C1855 / 1206B222K500NT on the generic ID is from the same
  maker (FH) but X7R ±10% at 50 V, far more stable (and higher rated) than this Y5V
  ±20% 25 V SKU. It must never replace the X7R preference, and projects requiring
  X7R stability must not substitute this SKU. The registry allows one preferred code
  per ID; C1933 is recorded as its own exact variant ID.'
- No datasheet PDF imported at intake; download is an integration-stage task (JLC
  lists https://jlc-prod-smt.oss-eu-central-1.aliyuncs.com/smtDataManualFile/8770991814671249408-C1933.pdf).
