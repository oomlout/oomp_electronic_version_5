research_notes:
- Rated/tolerance variant for UNI-ROYAL JLC C1339 / 0805W8J0181T5E. The existing generic
  0805 180 Ω entry retains its FOJAN C2933344 ±1% assignment.
- The JLC and same-code LCSC pages agree on 0805, 180 Ω, ±5%, 125 mW, 150 V, ±100
  ppm/°C and -55 to +155 °C. The clicked UNI-ROYAL thick-film series datasheet maps
  W8 to 1/8 W and J to ±5%, includes 0805, and confirms the 180 Ω resistance range,
  150 V working voltage, temperature range and ±100 ppm/°C above 10 Ω.
