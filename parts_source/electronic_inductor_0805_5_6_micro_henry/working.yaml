    and are not reusable. The exact FH CMI201209X5R6KT model row in its linked CMI2012
    datasheet agrees with the listed 5.6uH, ±10%, Q=30 at 4MHz, 1Ω maximum DCR and
    32MHz minimum SRF, but states 15mA maximum rated current where both JLC and same-code
    LCSC listings show 25mA. Preserve this rating conflict for technical review; do
    not treat 25mA as datasheet-supported.
