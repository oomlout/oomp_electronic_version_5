  notes: '2.54 mm right-angle male header, plastic moulded on the SHORT pin side:
    the short legs (~3 mm) bend down into the board and the long legs carry the signal
    row. Drawing extracted from KiCad PinHeader_1x23_P2.54mm_Horizontal. LCSC family
    mechanical reference: C3012223 / PZ254-1-02-W-8.5. The drawing gives a 2.50 mm
    carrier, 0.64 mm square pins, a 6.0 mm long leg and a 3.0 mm short leg. The generated
    pin count remains the OOMP variant identity.'
