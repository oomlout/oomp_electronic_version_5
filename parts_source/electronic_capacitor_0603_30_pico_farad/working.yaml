research_notes:
- 'The official JLC page lists Basic Fenghua 0603CG300J500NT (C1658): 30 pF, 50 V,
  C0G, +-5% in 0603; reconfirmed live 2026-10-01 (stock 379,491).'
- The Fenghua ordering code decodes exactly to that suffix (CG = C0G, 300 = 30 pF,
  J = +-5%, 500 = 50 V), and the C0G 0603 table covers 30 pF at 50 V.
- Non-polarized two-terminal chip; the standard built-in 0603 chip renderer draws
  the package from the verified dimensions.
