research_notes:
- Verified JLC C1712 / Samsung CL21B105KAFNFNE as the first reviewed preferred extended
  purchasing choice for this rated variant; 0805, 1 uF, 25 V, X7R, ±10% verified against
  the staged live JLC capture 2026-09-28. The Samsung ordering code (CL21 = 0805,
  B = X7R, 105 = 1 uF, K = ±10%, A = 25 V) decodes consistently with the listed specifications;
  the live page specification table is the primary evidence.
- Linked to the generic 0805 1 uF definition as a lower-voltage purchasing variant;
  the reviewed Basic 50 V preference C28323 / CL21B105KBFNNNE on the generic ID remains
  unchanged. Projects needing 50 V margin must not substitute this 25 V SKU.
- No datasheet PDF imported at intake; download is an integration-stage task (JLC
  lists https://jlc-prod-smt.oss-eu-central-1.aliyuncs.com/smtDataManualFile/8586178156810686464-C1712.pdf).
