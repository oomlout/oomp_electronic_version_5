research_notes:
- 'The official JLC page lists Basic Hubei KENTO KT-0805Y (C2296): yellow 0805 water-clear
  LED, 2.0-2.2 V, 20 mA, 120 deg, 592-594 nm; reconfirmed live 2026-10-02 (stock 390,223).'
- Browser-downloaded the KENTO KT-0805Y approval specification (8 pages, KT-0A revision)
  into this part; it anchors the 0805 LED sub-family (the 0603 red/white specs do
  not cover 0805).
- 'Datasheet polarity: the terminal drawing labels Anode/Cathode with a polarity triangle
  and dot on the cathode end but does not number pads; the pin table uses the KiCad
  LED convention (1 = K / 2 = A). The datasheet omits PD - the 40 mW value carries
  the live-description provenance.'
