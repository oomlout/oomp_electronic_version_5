research_notes:
- Verified JLC C1723 / Fenghua 0805B183K500NT as the first reviewed preferred extended
  purchasing choice for this in-grid generic 0805 18 nF value (the generic already
  exists in the 0805 capacitance_values grid, so no populate row was needed). The
  Fenghua ordering code (B = X7R, 183 = 18 nF, K = +/-10%, 500 = 50 V) decodes consistently
  with the listed specifications; the live page specification table is the primary
  evidence.
- Live JLC detail page (staged capture 2026-09-28) shows Extended (Promotional Extended),
  0805, 18 nF, 50 V, X7R, +/-10%, stock 3,763, minimum 1, full reel 4,000, available
  order qty 3,754, MSL 1. No datasheet PDF imported at intake; download is an integration-stage
  task (JLC lists https://jlc-prod-smt.oss-eu-central-1.aliyuncs.com/smtDataManualFile/8770997455402225664-C1723.pdf).
