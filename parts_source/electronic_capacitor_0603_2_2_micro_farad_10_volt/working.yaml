research_notes:
- Verified JLC C1607 / Samsung CL10A225KP8NNNC as the first reviewed preferred extended
  purchasing choice for this rated variant; 0603, 2.2 uF, 10 V, X5R, ±10% verified
  against the staged live JLC capture 2026-09-28. The Samsung ordering code (CL10
  = 0603, A = X5R, 225 = 2.2 uF, P = ±10%, P8 = 10 V) decodes consistently with the
  listed specifications; the live page specification table is the primary evidence.
- Linked to the generic 0603 2.2 uF definition as a lower-voltage purchasing variant
  (C1592 16 V and C1590 25 V precedents); the reviewed Basic 16 V C23630 generic preference
  remains unchanged. Projects needing 16 V margin must not substitute this 10 V SKU.
- No datasheet PDF imported at intake; download is an integration-stage task (JLC
  lists https://jlc-prod-smt.oss-eu-central-1.aliyuncs.com/smtDataManualFile/8586178148606492672-C1607.pdf).
