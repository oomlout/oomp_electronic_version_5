research_notes:
- JLC house-parts queue row C7128 (Texas Instruments SN74ALVC164245DGGR, TSSOP-48-6.2mm,
  48 pins) verified at intake; family batch integration C7128.
- Downloaded the official Texas Instruments 74ALVC164245 data sheet directly from
  ti.com into this part.
- Pin table generated from the KiCad 74xx:74ALVC164245 master and cross-checked pad-for-pad
  (pin numbers and electrical types); no-connect pins filled to the 48-pin package
  count.
- Footprint Package_SO:TSSOP-48_6.1x12.5mm_P0.5mm verified present in the KiCad 10
  library.
