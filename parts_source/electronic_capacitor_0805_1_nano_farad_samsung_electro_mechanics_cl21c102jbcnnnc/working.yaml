research_notes:
- Exact Samsung Electro-Mechanics C1791 / CL21C102JBCNNNC purchasing variant; 0805,
  1 nF, 50 V, C0G, ±5% verified against the staged live JLC capture 2026-09-28 (stock
  113,668, minimum 1, full reel 4,000, available order qty 105,362, MSL 1).
- 'Linked to the generic 0805 1 nF definition. Dielectric difference: the reviewed
  Basic preference C46653 / CL21B102KBCNNNC (Samsung, X7R ±10%) on the generic ID
  keeps the preference slot, while this C1791 SKU is C0G ±5% - the more stable, tighter-tolerance
  dielectric of the two. Projects needing C0G stability at 1 nF/0805 should pick this
  variant explicitly; the X7R Basic preference is not downgraded. The registry allows
  one preferred code per ID; C1791 is recorded as its own exact variant ID.'
- No datasheet PDF imported at intake; download is an integration-stage task (JLC
  lists https://jlc-prod-smt.oss-eu-central-1.aliyuncs.com/smtDataManualFile/8586178187076243456-C1791.pdf).
