jlcpcb_selection:
  compatibility_notes: 'Second code on the existing generic 0805 1 nF capacitor: the
    plain generic ID keeps its reviewed Basic preference C46653 (Samsung CL21B102KBCNNNC,
    X7R +/-10% 50 V). C1791 is the exact Samsung Electro-Mechanics C0G +/-5% SKU (CL21C102JBCNNNC,
    50 V) from the same maker, so it gets its own maker/mpn variant ID linked via
    generic_oomp_id, following the established variant taxonomy. Rating comparison
    from the staged capture: same 1 nF value, package and 50 V rating, but C0G +/-5%
    is the more stable, tighter-tolerance dielectric than the X7R +/-10% preference;
    projects needing C0G stability at 1 nF/0805 should pick this variant explicitly
    and the X7R Basic preference is not downgraded. Two-terminal MLCC (pin_count 2);
    stock 113,668 recorded as observed.'
