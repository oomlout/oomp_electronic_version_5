research_notes:
- Verified JLC C1854 / Fenghua 1206B221K500NT as the first reviewed preferred extended
  purchasing choice for this previously absent generic 1206 220 pF value; the populate
  row was added by this intake. The Fenghua ordering code (B = X7R, 221 = 22 x 10^1
  pF, K = +/-10%, 500 = 50 V) decodes consistently with the listed specifications;
  the live page specification table is the primary evidence. Distinct from the 0402
  and 0603 220 pF generics supplied by C1530 and C1603 and the 0805 220 pF generic
  supplied by C107145.
- Live JLC detail page (staged capture 2026-09-28) shows Extended (Promotional Extended),
  1206, 220 pF, 50 V, X7R, +/-10%, stock 18,561, minimum 1, full reel 4,000, available
  order qty 18,503, MSL 1. No datasheet PDF imported at intake; download is an integration-stage
  task (JLC lists https://jlc-prod-smt.oss-eu-central-1.aliyuncs.com/smtDataManualFile/8770991350555140096-C1854.pdf).
