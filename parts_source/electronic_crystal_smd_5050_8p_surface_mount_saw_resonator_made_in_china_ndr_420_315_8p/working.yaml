    resonators generally, and no resonator family exists. Rating comparison from the
    staged capture: SMD5050-8P 8-pin SAW resonator; the page''s specification table
    lists NO frequency, ESR or load capacitance, so none are recorded and no frequency
    token is added to the ID - the MPN''s ''315'' element conventionally suggests
    a 315 MHz device but the page does not confirm it, and the full MPN is preserved
    in the ID for exact lookup. Stock 30 at capture recorded as observed (very low;
    does not change identity); SMD device, pin_count recorded as 4 pending datasheet
    confirmation at full stage (the 8-pin count in the MPN refers to the SMD5050-8P
    carrier; page evidence for the pad count is absent). Edits made under the crystal
    family lock.'
