  into this part.
- Pin table generated from the KiCad 74xx:74LS241 master and cross-checked pad-for-pad
  (pin numbers and electrical types); no-connect pins filled to the 20-pin package
  count.
- Footprint Package_SO:SOIC-20W_7.5x12.8mm_P1.27mm verified present in the KiCad 10
  library.
