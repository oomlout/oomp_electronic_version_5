research_notes:
- Exact Samsung Electro-Mechanics C1657 / CL10C271JB8NNNC purchasing variant; 0603,
  270 pF, 50 V, C0G, ±5% verified against the staged live JLC capture 2026-09-28.
- 'Linked to the generic 0603 270 pF definition. The X7R ±10% preference C1608 / 0603B271K500NT
  on the generic ID remains unchanged; the registry allows one preferred code per
  ID, so this C0G ±5% Samsung SKU is recorded as its own exact variant ID. Dielectric
  differs from the preference (C0G vs X7R): either may be selected deliberately per
  project stability requirements, never substituted silently.'
- No datasheet PDF imported at intake; download is an integration-stage task (JLC
  lists https://jlc-prod-smt.oss-eu-central-1.aliyuncs.com/smtDataManualFile/8586178149990612992-C1657.pdf).
