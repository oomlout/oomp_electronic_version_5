research_notes:
- Exact Samsung Electro-Mechanics C1688 / CL10F104ZB8NNNC purchasing variant; 0603,
  100 nF, 50 V, Y5V, -20%~+80% verified against the staged live JLC capture 2026-09-28.
- 'Linked to the generic 0603 100 nF definition. IMPORTANT dielectric difference:
  the reviewed 50 V X7R +/-10% preference C14663 (YAGEO) and the Samsung X7R variant
  C1591 on the generic ID are far more stable than this Y5V -20/+80% SKU. It must
  never replace the X7R preferences, and projects requiring X7R stability or tight
  tolerance must not substitute this SKU. The registry allows one preferred code per
  ID; C1688 is recorded as its own exact variant ID.'
- No datasheet PDF imported at intake; download is an integration-stage task (JLC
  lists https://jlc-prod-smt.oss-eu-central-1.aliyuncs.com/smtDataManualFile/8586178151437647872-C1688.pdf).
