jlcpcb_selection:
  compatibility_notes: 'No generic electronic_capacitor_0402_4_7_pico_farad existed
    anywhere in the capacitor family: the 0402 in-grid value list (8/15/18/22/27/33/120
    pF and the explicit rows added today by C1527-C1568) has no 4.7 pF (the existing
    4.7 uF rows are microFarad, 10^6 times larger, so they are not matches), and the
    reviewed registry has no preference for this ID (checked reviewed_choices.json
    for C1569 and 0402CG4R7C500NT: no entries; no 4_7_pico entry at all). Following
    the missing-value decision row and the C1544/C1568 precedents, one explicit 0402
    4_7_pico_farad row was added and C1569 becomes its first reviewed preferred house
    identity: FH (Guangdong Fenghua Advanced Tech) 0402CG4R7C500NT, 4.7 pF, 50 V,
    C0G, 0402 MLCC. Verified two-terminal non-polarized chip; the Fenghua ordering
    code 4R7 decodes consistently with the listed 4.7 pF. Note: the live page lists
    no tolerance; recorded as not-listed rather than decoded from the MPN. Edits made
    under the capacitor family lock.'
