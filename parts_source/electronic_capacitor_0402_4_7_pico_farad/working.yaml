research_notes:
- Verified JLC C1569 / Fenghua 0402CG4R7C500NT as the first reviewed preferred extended
  purchasing choice for this previously absent generic 0402 4.7 pF value; the populate
  row was added by this intake. The Fenghua ordering code (CG = C0G, 4R7 = 4.7 pF,
  500 = 50 V) decodes consistently with the listed specifications; the live page specification
  table is the primary evidence.
- Live JLC detail page (staged capture 2026-09-28) shows Extended (Promotional Extended),
  0402, 4.7 pF, 50 V, C0G, stock 627,647, minimum 1, full reel 10,000, available order
  qty 549,340, MSL 1. The page lists no tolerance row; full stage should extract the
  tolerance from the datasheet rather than decoding the MPN. No datasheet PDF imported
  at intake; download is an integration-stage task (JLC lists https://jlc-prod-smt.oss-eu-central-1.aliyuncs.com/smtDataManualFile/8770987825213267968-C1569.pdf).
