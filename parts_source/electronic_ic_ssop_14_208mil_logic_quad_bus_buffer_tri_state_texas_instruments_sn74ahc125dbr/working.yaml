- JLC house-parts queue row C6939 (Texas Instruments SN74AHC125DBR, SSOP-14-208mil,
  14 pins) verified at intake; family batch integration C6939.
- Downloaded the official Texas Instruments 74AHC125 data sheet directly from ti.com
  into this part.
- Pin table generated from the KiCad 74xx:74LS125 master and cross-checked pad-for-pad
  (pin numbers and electrical types); no-connect pins filled to the 14-pin package
  count.
- Footprint Package_SO:SSOP-14_5.3x6.2mm_P0.65mm verified present in the KiCad 10
  library.
