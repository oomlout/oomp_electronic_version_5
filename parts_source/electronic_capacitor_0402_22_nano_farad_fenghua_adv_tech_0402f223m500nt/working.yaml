research_notes:
- Exact FH (Guangdong Fenghua Advanced Tech) C1584 / 0402F223M500NT purchasing variant;
  0402, 22 nF, 50 V, Y5V, ±20% verified against the staged live JLC capture 2026-09-28.
- 'Linked to the generic 0402 22 nF definition. IMPORTANT dielectric difference: the
  existing verified Basic preference C1532 / 0402B223K500NT on electronic_capacitor_0402_22_nano_farad
  is X7R ±10% with full-stage evidence (datasheet sha256-verified, pinout and footprint
  checked); this FH SKU is Y5V ±20%, a materially broader-tolerance, worse-stability
  dielectric. It must never replace the X7R preference, and projects requiring X7R
  stability must not substitute this SKU. The scaffold guard refused an earlier attempt
  to scaffold C1584 onto the plain generic ID because C1532''s page capture already
  exists there; C1584 is therefore recorded as its own exact variant ID.'
- No datasheet PDF imported at intake; download is an integration-stage task (JLC
  lists https://jlc-prod-smt.oss-eu-central-1.aliyuncs.com/smtDataManualFile/8770987876916047872-C1584.pdf).
