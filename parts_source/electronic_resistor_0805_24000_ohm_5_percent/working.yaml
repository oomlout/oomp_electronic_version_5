research_notes:
- Rated/tolerance variant for UNI-ROYAL JLC C1382 / 0805W8J0243T5E. Existing Basic
  C17575 / 0805W8F2402T5E keeps the base electronic_resistor_0805_24000_ohm preference
  at ±1%.
- JLC and same-code LCSC pages agree on 0805, 24 kΩ, ±5%, 125 mW, 150 V, ±100 ppm/°C
  and -55 to +155 °C. The browser-downloaded 9-page UNI-ROYAL thick-film series datasheet
  maps W8 to 1/8 W and J to ±5%, includes the 0805 5% value range, and confirms 150
  V and the operating-temperature range.
