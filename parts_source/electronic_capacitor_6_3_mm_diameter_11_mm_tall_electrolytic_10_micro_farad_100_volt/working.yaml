research_notes:
- Verified JLC C2029 / CX (Dongguan Chengxing Elec) KM106M100E11RR0VH2FP0 as the first
  reviewed preferred extended purchasing choice for this previously absent leaded
  electrolytic value; the populate row was added by this intake. The KM ordering code
  (106 = 10 uF, M = +/-20%, 100 = 100 V) decodes consistently with the listed specifications;
  the live page specification table is the primary evidence.
- Leaded (radial through-hole) aluminum electrolytic, D6.3 x L11 mm, 2.5 mm pin spacing,
  1000 hrs at 105 C lifetime, ripple current 61 mA at 120 Hz; polarized, observe the
  marked negative stripe. Live JLC detail page (staged capture 2026-09-28) shows Extended
  (Promotional Extended), stock 15,090, minimum 1, full reel 1,000, available order
  qty 14,627. No datasheet PDF imported at intake; download is an integration-stage
  task (JLC lists https://jlc-prod-smt.oss-eu-central-1.aliyuncs.com/smtDataManualFile/8564798012716040192-C2029.pdf).
