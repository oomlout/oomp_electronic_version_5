jlcpcb_selection:
  compatibility_notes: 'Second code on the existing generic 1206 33 nF capacitor:
    the plain generic ID keeps its reviewed preference C1864 (FH 1206B333K500NT, X7R
    +/-10% 50 V). C1935 is the exact FH Y5V +/-20% SKU (1206F333M500NT, 50 V) from
    the same maker, so it gets its own maker/mpn variant ID linked via generic_oomp_id,
    following the established variant taxonomy. Rating comparison from the staged
    capture: same 33 nF value, package and 50 V rating, but Y5V +/-20% is a materially
    broader-tolerance, worse-stability dielectric than the X7R +/-10% preference -
    the variant must never replace the X7R preference. Two-terminal MLCC (pin_count
    2); stock 3 at capture recorded as observed (extremely low; does not change identity).
    Edits made under the capacitor family lock.'
