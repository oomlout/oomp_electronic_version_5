research_notes:
- Verified JLC C1920 / Fenghua 1206CG6R0C500NT as the first reviewed preferred extended
  purchasing choice for this previously absent generic 1206 6 pF value; the populate
  row was added by this intake. The Fenghua ordering code (CG = C0G, 6R0 = 6 pF, 500
  = 50 V) decodes consistently with the listed specifications; the live page specification
  table is the primary evidence. Distinct from the 0402 6 pF generic supplied by C1575.
- Live JLC detail page (staged capture 2026-09-28) shows Extended (Promotional Extended),
  1206, 6 pF, 50 V, C0G, stock 472, minimum 1, full reel 4,000, available order qty
  440, MSL 1; the live page lists no tolerance row. No datasheet PDF imported at intake;
  download is an integration-stage task (JLC lists https://jlc-prod-smt.oss-eu-central-1.aliyuncs.com/smtDataManualFile/8770991749571862528-C1920.pdf).
