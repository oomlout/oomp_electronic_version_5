- Exact FH (Guangdong Fenghua Advanced Tech) C1649 / 0603CG201J500NT purchasing variant;
  0603, 200 pF, 50 V, C0G, ±5% verified against the staged live JLC capture 2026-09-28.
- 'Linked to the generic 0603 200 pF definition. The X7R ±10% preference C1600 / 0603B201K500NT
