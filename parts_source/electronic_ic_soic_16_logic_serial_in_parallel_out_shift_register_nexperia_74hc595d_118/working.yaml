research_notes:
- 'The official JLC page lists Basic Nexperia 74HC595D,118 (C5947): 8-bit shift register
  in SOIC-16; reconfirmed live 2026-10-02 (stock 403,667).'
- Browser-downloaded the Nexperia 74HC595;74HCT595 product data sheet (21 pages) into
  this part; it anchors the SOIC-16 74HC595 family.
- Pinning section 6.1 aligns pad-for-pad with the KiCad 74xx:74HC595 symbol; vendor
  pin names (Q1-Q7, Q7S, MR, STCP, SHCP, OE, DS, Q0) recorded in the pin table, KiCad
  symbol uses the QB-QH/SRCLR/SRCLK/RCLK/SER convention on identical numbers.
