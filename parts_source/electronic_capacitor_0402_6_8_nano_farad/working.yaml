research_notes:
- Verified JLC C1542 / Fenghua 0402B682K500NT as the first reviewed preferred extended
  purchasing choice for this previously absent generic 0402 6.8 nF value; the populate
  row was added by this intake. The Fenghua ordering code (682 = 68 x 10^2 pF) decodes
  consistently with the listed 6.8 nF.
- Live JLC detail page (staged capture 2026-09-28) shows Extended (Promotional Extended),
  0402, 6.8 nF, 50 V, X7R, ±10%, stock 119,235, minimum 1, full reel 10,000, available
  order qty 95,575, MSL 1. No datasheet PDF imported at intake; download is an integration-stage
  task (JLC lists https://jlc-prod-smt.oss-eu-central-1.aliyuncs.com/smtDataManualFile/8770987734380879872-C1542.pdf).
