research_notes:
- 'The official JLC page lists Basic Samsung CL10C200JB8NNNC (C1648): 20 pF, 50 V,
  C0G, +-5% in 0603; reconfirmed live 2026-10-01 (stock 2,285,606).'
- The Samsung ordering decode covers the exact suffix (C = C0G, J = +-5%), and the
  C0G Product Lineup table (page 15) lists CL10C200JB8NNN.
- Non-polarized two-terminal chip; the standard built-in 0603 chip renderer draws
  the package from the verified dimensions.
