    C1365 and 0603 C22980 had explicit 3600 ohm rows). No MPN RS-06K362JT, no C1480
    and no reviewed preference for 1206 3600 ohm exist in reviewed_choices.json; the
    reviewed 3600 ohm choices are 0805 (C1365 UNI-ROYAL) and 0603 (C22980 UNI-ROYAL),
    which do not cover the 1206 package, so this verified house identity becomes the
    preferred choice on the plain 1206 generic ID electronic_resistor_1206_3600_ohm;
    no tolerance variant is needed. Ratings: JLC C1480 FH (Guangdong Fenghua Advanced
    Tech) RS-06K362JT, 1206, 3.6 kOhm, +-5%, 250 mW, 200 V, +-100 ppm/degC, -55~+155
    degC, thick film, two terminals.'
