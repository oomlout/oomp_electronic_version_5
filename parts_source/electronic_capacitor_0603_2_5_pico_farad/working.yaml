research_notes:
- Verified JLC C1652 / Fenghua 0603CG2R5C500NT as the first reviewed preferred extended
  purchasing choice for this previously absent generic 0603 2.5 pF value; the populate
  row was added by this intake. The Fenghua ordering code (CG = C0G, 2R5 = 2.5 pF,
  500 = 50 V) decodes consistently with the listed specifications; the live page specification
  table is the primary evidence. This 0603 generic is distinct from the separate 0402
  2.5 pF generic supplied by C1560.
- Live JLC detail page (staged capture 2026-09-28) shows Extended (Promotional Extended),
  0603, 2.5 pF, 50 V, C0G, stock 3,129, minimum 1, full reel 4,000, available order
  qty 3,127, MSL 1. The page lists no tolerance row; full stage should extract the
  tolerance from the datasheet rather than decoding the MPN. No datasheet PDF imported
  at intake; download is an integration-stage task (JLC lists https://jlc-prod-smt.oss-eu-central-1.aliyuncs.com/smtDataManualFile/8770988059368677376-C1652.pdf).
