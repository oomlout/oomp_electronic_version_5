research_notes:
- 'The official JLC page lists Basic Hubei KENTO KT-0603W (C2290): white 0603 top-mount
  LED, yellow lens, 2.6-3.1 V, 5 mA test current, 120 deg, up to 360 mcd; reconfirmed
  live 2026-10-02 (stock 2,126,126).'
- Browser-downloaded the KENTO CICADT 0603-0.6DT white approval specification (11
  pages) into this part; it anchors the white 0603 LED sub-family (the red KT-0603R
  spec does not cover white ratings).
- 'POLARITY TRAP: identical to the red sibling - KENTO numbers pad 1 = + (anode) and
  pad 2 = cathode (green corner, page 2 drawing); the KiCad LED_0603_1608Metric library
  convention numbers pad 1 as cathode - verify polarity against the vendor drawing
  before assembly.'
