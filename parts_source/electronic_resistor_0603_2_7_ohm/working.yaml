research_notes:
- Missing 0603 2.7 Ω generic value added from verified FH C1186 RS-03L2R7JT.
- The FH series datasheet rates 0603 at 1/10 W and 75 V limiting voltage; JLC C1186
  lists 50 V and 100 mW, so retain the supplier's 50 V rating.
- The FH series datasheet gives ±200 or ±250 ppm/°C for 0603 values below 10 Ω at
  ±5% tolerance; C1186's live page specifies ±250 ppm/°C.
