    reference 2.5 V-36 V, +/-0.5%, 50 ppm/C, 1 mA minimum cathode current, 100 mA
    output, -25 C to +85 C - matches the live page exactly. Three leads (pin_count
    3); stock 814 recorded as observed. Edits made under the ic family lock.'
