- Missing 0805 1.8 Ω generic value added from verified FH C1297 RS-05L1R8JT.
- The JLC and same-code LCSC product pages agree on 0805, 1.8 Ω, ±5%, 125 mW, 150
  V, ±250 ppm/°C, and -55 to +155 °C. The FH series datasheet confirms 0805 at 1/8
  W and 150 V limiting element voltage, and permits ±250 ppm/°C at ±5% for 1 Ω to
  below 10 Ω.
