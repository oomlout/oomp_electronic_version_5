- Exact FH (Guangdong Fenghua Advanced Tech) C1770 / 0805F224M500NT purchasing variant;
  0805, 220 nF, 50 V, Y5V, ±20% verified against the staged live JLC capture 2026-09-28.
- 'Linked to the generic 0805 220 nF definition. IMPORTANT dielectric difference:
  the reviewed Basic preference C5378 / CL21B224KBFNNNE (Samsung, X7R ±10%) on the
  generic ID is far more stable than this Y5V ±20% SKU. It must never replace the
  X7R preference, and projects requiring X7R stability must not substitute this SKU.
  The registry allows one preferred code per ID; C1770 is recorded as its own exact
  variant ID.'
- No datasheet PDF imported at intake; download is an integration-stage task (JLC
  lists https://jlc-prod-smt.oss-eu-central-1.aliyuncs.com/smtDataManualFile/8770990634163417088-C1770.pdf).
