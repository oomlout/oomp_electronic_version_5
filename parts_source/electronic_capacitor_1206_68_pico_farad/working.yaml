research_notes:
- Verified JLC C1922 / Fenghua 1206CG680J500NT as the first reviewed preferred extended
  purchasing choice for this previously absent generic 1206 68 pF value; the populate
  row was added by this intake. The Fenghua ordering code (CG = C0G, 680 = 68 x 10^0
  pF, J = +/-5%, 500 = 50 V) decodes consistently with the listed specifications;
  the live page specification table is the primary evidence. Distinct from the 0603
  and 0805 68 pF generics supplied by C1680 and C1834.
- Live JLC detail page (staged capture 2026-09-28) shows Extended (Promotional Extended),
  1206, 68 pF, 50 V, C0G, +/-5%, stock 2,491, minimum 1, full reel 4,000, available
  order qty 2,485, MSL 1. No datasheet PDF imported at intake; download is an integration-stage
  task (JLC lists https://jlc-prod-smt.oss-eu-central-1.aliyuncs.com/smtDataManualFile/8770991759348785152-C1922.pdf).
