research_notes:
- Verified JLC C2063 / CX (Dongguan Chengxing Elec) KM227M035F12RR0VH2FP0 as the first
  reviewed preferred extended purchasing choice for this previously absent leaded
  electrolytic value; the populate row was added by this intake. The KM ordering code
  (227 = 220 uF, M = +/-20%, 035 = 35 V) decodes consistently with the listed specifications;
  the live page specification table is the primary evidence. Same can size as the
  C2033 470 uF 10 V and C2051 330 uF 25 V parts (D8 x L12 mm).
- Leaded (radial through-hole) aluminum electrolytic, D8 x L12 mm, 3.5 mm pin spacing,
  2000 hrs at 105 C lifetime; polarized, observe the marked negative stripe. Live
  JLC detail page (staged capture 2026-09-28) shows Extended (Promotional Extended),
  stock 234,668, minimum 1, full reel 500, available order qty 225,906. No datasheet
  PDF imported at intake; download is an integration-stage task (JLC lists https://jlc-prod-smt.oss-eu-central-1.aliyuncs.com/smtDataManualFile/8588894275962875904-C2063.pdf).
