research_notes:
- Verified JLC C1691 / Samsung CL10A106MQ8NNNC as the first reviewed preferred extended
  purchasing choice for this rated variant; 0603, 10 uF, 6.3 V, X5R, ±20% verified
  against the staged live JLC capture 2026-09-28. The Samsung ordering code (CL10
  = 0603, A = X5R, 106 = 10 uF, M = ±20%, Q8 = 6.3 V) decodes consistently with the
  listed specifications; the live page specification table is the primary evidence.
- Linked to the generic 0603 10 uF definition as a lower-voltage, wider-tolerance
  purchasing variant (following the established 25_volt_20_percent taxonomy); the
  reviewed Basic 10 V ±10% preference C19702 and the 25 V ±20% rated variant C96446
  remain unchanged. Projects needing 10 V margin or ±10% tolerance must not substitute
  this SKU.
- No datasheet PDF imported at intake; download is an integration-stage task (JLC
  lists https://jlc-prod-smt.oss-eu-central-1.aliyuncs.com/smtDataManualFile/8586178152725164032-C1691.pdf).
