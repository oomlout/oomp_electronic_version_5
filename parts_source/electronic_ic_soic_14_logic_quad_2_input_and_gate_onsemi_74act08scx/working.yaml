- JLC house-parts queue row C5492 (onsemi 74ACT08SCX, SOIC-14, 14 pins) verified at
  intake; family batch integration C5492.
- Browser-extracted the signed JLC OSS link and downloaded the onsemi 74ACT08 data
  sheet into this part.
- Pin table generated from the KiCad 74xx:74LS08 master and cross-checked pad-for-pad
  (pin numbers and electrical types); no-connect pins filled to the 14-pin package
  count.
- Footprint Package_SO:SOIC-14_3.9x8.7mm_P1.27mm verified present in the KiCad 10
  library.
