research_notes:
- Exact FH (Guangdong Fenghua Advanced Tech) C1612 / 0603B331K500NT purchasing variant;
  0603, 330 pF, 50 V, X7R, ±10% verified against the staged live JLC capture 2026-09-28.
- 'Linked to the generic 0603 330 pF definition. IMPORTANT dielectric difference:
  the reviewed Basic preference C1664 / CL10C331JB8NNNC (Samsung) on the generic ID
  is C0G ±5%; this FH SKU is X7R ±10%, a materially broader-tolerance, worse-stability
  dielectric. It must never replace the C0G preference, and projects requiring C0G
  stability must not substitute this SKU. The registry allows one preferred code per
  ID; C1612 is recorded as its own exact variant ID.'
- No datasheet PDF imported at intake; download is an integration-stage task (JLC
  lists https://jlc-prod-smt.oss-eu-central-1.aliyuncs.com/smtDataManualFile/8770987951558152192-C1612.pdf).
