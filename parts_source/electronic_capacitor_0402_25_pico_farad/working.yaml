research_notes:
- Verified JLC C1556 / Fenghua 0402CG250J500NT as the first reviewed preferred extended
  purchasing choice for this previously absent generic 0402 25 pF value; the populate
  row was added by this intake. The Fenghua ordering code (CG = C0G, 250 = 25 x 10^0
  pF, J = +/-5%, 500 = 50 V) decodes consistently with the listed specifications;
  the live page specification table is the primary evidence.
- Live JLC detail page (staged capture 2026-09-28) shows Extended (Promotional Extended),
  0402, 25 pF, 50 V, C0G, +/-5%, stock 95, minimum 10000 (equal to the 10,000 full
  reel; listed as Pre-order with estimated unit price $0.0008), MSL 1. Low stock and
  reel-only purchasing do not change the verified identity. No datasheet PDF imported
  at intake; download is an integration-stage task (JLC lists https://jlc-prod-smt.oss-eu-central-1.aliyuncs.com/smtDataManualFile/8770987780963090432-C1556.pdf).
