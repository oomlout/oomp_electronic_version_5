research_notes:
- Verified JLC C1813 / Fenghua 0805CG3R9C500NT as the first reviewed preferred extended
  purchasing choice for this previously absent generic 0805 3.9 pF value; the populate
  row was added by this intake. The Fenghua ordering code (CG = C0G, 3R9 = 3.9 pF,
  500 = 50 V) decodes consistently with the listed specifications; the live page specification
  table is the primary evidence. Distinct from the 0402 and 0603 3.9 pF generics supplied
  by C1566 and C1662.
- Live JLC detail page (staged capture 2026-09-28) shows Extended (Promotional Extended),
  0805, 3.9 pF, 50 V, C0G, stock 2,903, minimum 1, full reel 4,000, available order
  qty 2,887, MSL 1; the live page lists no tolerance row. No datasheet PDF imported
  at intake; download is an integration-stage task (JLC lists https://jlc-prod-smt.oss-eu-central-1.aliyuncs.com/smtDataManualFile/8770991135127298048-C1813.pdf).
