research_notes:
- Verified JLC C1746 / Samsung CL21A475KOFNNNE as the first reviewed preferred extended
  purchasing choice for this rated variant; 0805, 4.7 uF, 16 V, X5R, ±10% verified
  against the staged live JLC capture 2026-09-28. The Samsung ordering code (CL21
  = 0805, A = X5R, 475 = 4.7 uF, K = ±10%, OF = 16 V) decodes consistently with the
  listed specifications; the live page specification table is the primary evidence.
- Linked to the generic 0805 4.7 uF definition as a lower-voltage purchasing variant
  (following the 0603 16_volt C78 precedent); the reviewed Basic 25 V preference C1779
  / CL21A475KAQNNNE on the generic ID remains unchanged. Projects needing 25 V margin
  must not substitute this 16 V SKU.
- No datasheet PDF imported at intake; download is an integration-stage task (JLC
  lists https://jlc-prod-smt.oss-eu-central-1.aliyuncs.com/smtDataManualFile/8586178171934400512-C1746.pdf).
