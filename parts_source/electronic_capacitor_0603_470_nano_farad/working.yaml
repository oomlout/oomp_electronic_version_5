research_notes:
- 'The official JLC page lists Basic Samsung CL10B474KA8NNNC (C1623): 470 nF, 25 V,
  X7R, +-10% in 0603; reconfirmed live 2026-10-01 (stock 933,612).'
- The Samsung ordering decode covers the exact suffix (A = 25 V), and the X7R Product
  Lineup table (page 26) lists CL10B474KA8NNN.
- Non-polarized two-terminal chip; the standard built-in 0603 chip renderer draws
  the package from the verified dimensions.
