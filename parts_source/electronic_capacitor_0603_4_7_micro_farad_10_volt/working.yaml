research_notes:
- Verified JLC C1705 / Samsung CL10A475KP8NNNC as the first reviewed preferred extended
  purchasing choice for this rated variant; 0603, 4.7 uF, 10 V, X5R, ±10% verified
  against the staged live JLC capture 2026-09-28. The Samsung ordering code (CL10
  = 0603, A = X5R, 475 = 4.7 uF, K = ±10%, P8 = 10 V) decodes consistently with the
  listed specifications; the live page specification table is the primary evidence.
- Linked to the generic 0603 4.7 uF definition as a lower-voltage purchasing variant
  (following the established 16_volt taxonomy of C78); the 16 V rated variant keeps
  its ID. Projects needing 16 V margin must not substitute this 10 V SKU.
- No datasheet PDF imported at intake; download is an integration-stage task (JLC
  lists https://jlc-prod-smt.oss-eu-central-1.aliyuncs.com/smtDataManualFile/8586178155313184768-C1705.pdf).
