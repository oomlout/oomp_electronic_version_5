research_notes:
- Added a missing generic 0805 110 Ω value and verified FH C1335 RS-05K111JT as its
  preferred extended purchasing choice.
- JLC and same-code LCSC pages agree on 110 Ω, ±5%, 125 mW, 150 V, ±100 ppm/°C and
  -55 to +155 °C. The FH series datasheet rates 0805 at 1/8 W and 150 V and lists
  ±100 ppm/°C for 10 Ω to 1 MΩ at ±5%.
