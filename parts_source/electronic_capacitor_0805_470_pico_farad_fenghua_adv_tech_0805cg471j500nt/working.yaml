jlcpcb_selection:
  compatibility_notes: 'Second code on the existing generic 0805 470 pF capacitor:
    the plain generic ID keeps its reviewed preference C1743 (FH 0805B471K500NT, X7R
    +/-10% 50 V). C1822 is the exact FH C0G +/-5% SKU (0805CG471J500NT, 50 V) from
    the same maker, so it gets its own maker/mpn variant ID linked via generic_oomp_id,
    following the established variant taxonomy. Rating comparison from the staged
    capture: same 470 pF value, package and 50 V rating, but C0G +/-5% is the more
    stable, tighter-tolerance dielectric than the X7R +/-10% preference; projects
    needing C0G stability at 470 pF/0805 should pick this variant explicitly and the
    X7R preference is not downgraded. Two-terminal MLCC (pin_count 2); stock 39,102
    recorded as observed. Edits made under the capacitor family lock.'
