research_notes:
- Exact FH (Guangdong Fenghua Advanced Tech) C1822 / 0805CG471J500NT purchasing variant;
  0805, 470 pF, 50 V, C0G, ±5% verified against the staged live JLC capture 2026-09-28
  (stock 39,102, minimum 1, full reel 4,000, available order qty 38,943, MSL 1).
- 'Linked to the generic 0805 470 pF definition. Dielectric difference: the reviewed
  preference C1743 / 0805B471K500NT on the generic ID is from the same maker (FH)
  but X7R ±10%, and it keeps the preference slot; this C1822 SKU is C0G ±5% - the
  more stable, tighter-tolerance dielectric of the two. Projects needing C0G stability
  at 470 pF/0805 should pick this variant explicitly; the X7R preference is not downgraded.
  The registry allows one preferred code per ID; C1822 is recorded as its own exact
  variant ID.'
- No datasheet PDF imported at intake; download is an integration-stage task (JLC
  lists https://jlc-prod-smt.oss-eu-central-1.aliyuncs.com/smtDataManualFile/8770991179624398848-C1822.pdf).
