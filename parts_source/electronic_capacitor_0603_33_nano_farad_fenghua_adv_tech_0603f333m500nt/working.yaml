research_notes:
- Exact FH (Guangdong Fenghua Advanced Tech) C1701 / 0603F333M500NT purchasing variant;
  0603, 33 nF, 50 V, Y5V, ±20% verified against the staged live JLC capture 2026-09-28.
- 'Linked to the generic 0603 33 nF definition. IMPORTANT dielectric difference: the
  reviewed Basic preference C21117 (Samsung, X7R ±10%) and the FH X7R variant C1614
  (0603B333K500NT) on the generic family are far more stable than this Y5V ±20% SKU.
  It must never replace the X7R choices, and projects requiring X7R stability must
  not substitute this SKU. The registry allows one preferred code per ID; C1701 is
  recorded as its own exact variant ID.'
- No datasheet PDF imported at intake; download is an integration-stage task (JLC
  lists https://jlc-prod-smt.oss-eu-central-1.aliyuncs.com/smtDataManualFile/8770988184316993536-C1701.pdf).
