jlcpcb_selection:
  compatibility_notes: Created an exact MDD SM4007PL rectifier identity because no
    existing OOMP diode entry matches its maker, MPN and SOD-123FL package. Live JLC
    Basic ratings are 1 A rectified current, 1 kV reverse voltage, 25 A surge, 1.1
    V at 1 A and 10 uA at 1 kV leakage. Pin geometry remains for the full pass.
  datasheet_pages:
    document: Changjing BAV16WS/1N4148WS SOD-323 specification, May 2011 (C2128 provenance,
      family anchor)
    electrical_characteristics:
    - 1
    maximum_ratings:
    - 1
    typical_characteristics:
    - 2
  footprint_checked: true
  official_url: https://jlcpcb.com/partdetail/2485-1N4148WS/C2128
  pcba_min_qty_observed: null
  pinout_checked: true
  purchase_moq_observed: 1
  ratings:
    Current - Rectified: 150mA
    Diode Configuration: Standalone
    Non-Repetitive Peak Forward Surge Current: 2A
    Pd - Power Dissipation: 200mW
    Reverse Leakage Current (Ir): 1uA@75V
    Reverse Recovery Time (trr): 4ns
    Voltage - DC Reverse(Vr): 100V
    Voltage - Forward(Vf@If): 1.25V@150mA
  stock_observed: null
  tier: basic
  tier_label_observed: Basic
  verified_on: '2026-10-02'
  visual_review: 'Inspected 2026-10-02 after the build, a direct kicad library run
    and a rebuild. working_svg_square_pins.png hero titled Diode 1N4148WS SOD-323
    with K (cathode, band side) left and A (anode) right plus the polarity dot, no
    mirroring, no label overlap, no cropping. working_svg_dimensioned.png: SOD-323
    outline per the KiCad D_SOD-323 master geometry (datasheet carries no dimension
    drawing; recorded in dimension_reference). data/kicad manifest complete with Device:D
    symbol and Diode_SMD:D_SOD-323 machine + hand footprints (SOD-323 has no separate
    HandSolder master upstream; the part declares the same master for both, matching
    the intake-era source). README.md: 1N4148WS part number, LCSC/JLC C2128 links,
    2-pin table (K/A), datasheet link resolving to data/datasheet.pdf (the Changjing
    SOD-323 specification, family anchor). Limitation: KiCad symbol/footprint checked
    as rendered SVG/PNG plus s-expression text rather than in a KiCad GUI.'
