research_notes:
- 'The official JLC page lists Basic Jiangsu Changjing 1N4148WS (C2128): 100 V, 150
  mA switching diode in SOD-323; reconfirmed live 2026-10-01 (stock 2,452,437).'
- Browser-downloaded the Changjing BAV16WS/1N4148WS SOD-323 datasheet (2 pages, May
  2011) into this part; it anchors the SOD-323 switching-diode family.
- Pin 1 = K (cathode), pin 2 = A (anode); the KiCad Diode_SMD:D_SOD-323 master has
  pad 1 as cathode, matching.
