research_notes:
- Verified JLC C1782 / Fenghua 0805F823M500NT as the first reviewed preferred extended
  purchasing choice for this previously absent generic 0805 82 nF value; the populate
  row was added by this intake. The Fenghua ordering code (F = Y5V, 823 = 82 x 10^3
  pF = 82 nF, M = +/-20%, 500 = 50 V) decodes consistently with the listed specifications;
  the live page specification table is the primary evidence. Distinct from the 0805
  820 pF X7R generic supplied by C1757.
- Live JLC detail page (staged capture 2026-09-28) shows Extended (Promotional Extended),
  0805, 82 nF, 50 V, Y5V, +/-20%, stock 83, minimum 1, full reel 4,000, available
  order qty 83. No datasheet PDF imported at intake; download is an integration-stage
  task (JLC lists https://jlc-prod-smt.oss-eu-central-1.aliyuncs.com/smtDataManualFile/8770990697418121216-C1782.pdf).
