research_notes:
- 'The official JLC page lists Basic Hubei KENTO KT-0603R (C2286): red 0603 water-clear
  LED, 1.8-2.4 V, 20 mA, 120 deg, up to 300 mcd; reconfirmed live 2026-10-01 (stock
  4,835,213).'
- Browser-downloaded the KENTO 0603-0.6 red approval specification (11 pages, 2018-12-06)
  into this part; it anchors the 0603 LED family.
- 'POLARITY TRAP: KENTO numbers pad 1 = + (anode) and pad 2 = cathode (green corner,
  page 2 drawing); the KiCad LED_0603_1608Metric library convention numbers pad 1
  as cathode - verify polarity against the vendor drawing before assembly.'
