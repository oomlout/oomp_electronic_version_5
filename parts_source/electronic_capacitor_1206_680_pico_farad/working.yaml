research_notes:
- Verified JLC C1878 / Fenghua 1206B681K500NT as the first reviewed preferred extended
  purchasing choice for this previously absent generic 1206 680 pF value; the populate
  row was added by this intake. The Fenghua ordering code (B = X7R, 681 = 68 x 10^1
  pF, K = +/-10%, 500 = 50 V) decodes consistently with the listed specifications;
  the live page specification table is the primary evidence. Distinct from the 0402,
  0603 and 0805 680 pF generics supplied by C1541, C1630 and C1754.
- Live JLC detail page (staged capture 2026-09-28) shows Extended (Promotional Extended),
  1206, 680 pF, 50 V, X7R, +/-10%, stock 258, minimum 1, full reel 4,000, available
  order qty 251, MSL 1. Stock is low at capture time; low stock does not change the
  verified identity and the part is retained as a candidate. No datasheet PDF imported
  at intake; download is an integration-stage task (JLC lists https://jlc-prod-smt.oss-eu-central-1.aliyuncs.com/smtDataManualFile/8770991491504320512-C1878.pdf).
