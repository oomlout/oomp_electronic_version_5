research_notes:
- Verified JLC C1748 / Fenghua 0805B502K500NT as the first reviewed preferred extended
  purchasing choice for this previously absent generic 0805 5 nF value; the populate
  row was added by this intake. The Fenghua ordering code (B = X7R, 502 = 5 nF, K
  = +/-10%, 500 = 50 V) decodes consistently with the listed specifications; the live
  page specification table is the primary evidence. This 0805 generic is distinct
  from the separate 0603 5 nF generic supplied by C1625.
- Live JLC detail page (staged capture 2026-09-28) shows Extended (Promotional Extended),
  0805, 5 nF, 50 V, X7R, +/-10%, stock 8,285, minimum 1, full reel 4,000, available
  order qty 8,241, MSL 1. No datasheet PDF imported at intake; download is an integration-stage
  task (JLC lists https://jlc-prod-smt.oss-eu-central-1.aliyuncs.com/smtDataManualFile/8770988587611770880-C1748.pdf).
