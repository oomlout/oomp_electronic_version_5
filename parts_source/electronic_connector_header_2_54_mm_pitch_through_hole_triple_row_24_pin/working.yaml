research_notes:
- 'Triple-row 2.54 mm header availability (LCSC, checked 2026-10-01): straight 3x2P..3x8P
  (hanxia PZ2.54-3xNP ZZ, C32713289-C32713295; 3x3P NRND), straight 3x21P (HCTL C53452629,
  5.0 mm double-moulded), right angle 3x3P only (HCTL C7429379).'
- KiCad 10 official libraries ship PinHeader 1xNN and 2xNN masters only; a 3xNN symbol/footprint
  custom master (Conn_02x-style numbering extended to three 2.54 mm columns) is a
  full-pass custom-master task, so no official kicad selection is claimed here.
