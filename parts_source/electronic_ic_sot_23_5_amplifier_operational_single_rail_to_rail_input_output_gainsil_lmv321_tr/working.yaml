research_notes:
- The Bus Pirate analogue component page identifies U404, U506 and U603 as Gainsil
  LMV321 devices in SOT-23-5.
- The exact supplier listing resolves to Gainsil LMV321-TR, LCSC C362273.
- The Gainsil datasheet confirms the five-pin assignment, rail-to-rail input and output,
  2.1 V to 5.5 V supply range and package dimensions.
