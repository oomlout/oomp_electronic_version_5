    lock (six rectifier: 1N4001/1N4007G DO-41, 1N5401/1N5408 DO-201AD, 6A10/10A10
    R-6; five fast_recovery: FR104/FR107 DO-41, FR157/FR207 DO-15, FR307 DO-201AD),
    all MDD (Microdiode Semiconductor) per the existing exact-row convention. FR107
    (DO-41, 1kV 1A, trr 500ns) is its exact first reviewed preferred house choice.
