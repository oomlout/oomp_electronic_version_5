research_notes:
- LCSC C65189 explicitly identifies Nexperia 2N7002,215 in SOT-23; 560,000 pieces
  were in stock at browser verification on 2026-09-03, not a permanent availability
  guarantee.
- Nexperia lists 2N7002,215 as an active orderable part, 12NC 934003470215, supplied
  on a 3,000-piece reel.
- C551410 is the different 2N7002,235 packing suffix and was out of stock at verification;
  it is not assigned to this part.
- The datasheet confirms pins 1 gate, 2 source, 3 drain and the SOT23 outline. Solder-point
  ratings must not be interpreted as ambient-temperature ratings.
