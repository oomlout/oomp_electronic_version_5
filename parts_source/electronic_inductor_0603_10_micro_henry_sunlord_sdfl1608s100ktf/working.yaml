    - 1
  footprint_checked: true
  official_url: https://jlcpcb.com/partdetail/Sunlord-SDFL1608S100KTF/C1035
  pcba_min_qty_observed: null
  pinout_checked: true
  purchase_moq_observed: 1
  ratings:
    Current Rating: 3mA
    DC Resistance(DCR): 1.85Ω
    Frequency - Self Resonant: 17MHz
    Inductance: 10uH
    Q @ Frequency: 30@2MHz
    Tolerance: ±10%
  stock_observed: 813580
  tier: basic
  tier_label_observed: Basic
  verified_on: '2026-09-30'
  visual_review: 'Inspected 2026-09-30 after the build and a forced diagram refresh.
    data/working_svg_assembly_pins.png and _300 preview: 0603 chip with terminal_1
    on the left and terminal_2 on the right with drawn end terminations, non-polarized
    symmetric body, no mirroring, no label overlap, no cropping. working_svg_square_pins.png
    hero titled Inductor SDFL1608S100KTF 0603 with terminal_1 left and terminal_2
    right. working_svg_dimensioned.png: 1.6 x 0.8 mm body with end terminations and
    arrows, matching the Sunlord SDFL1608 nominals. data/kicad manifest complete with
    Device:L symbol and Inductor_SMD:L_0603_1608Metric machine + Pad1.05x0.95mm_HandSolder
    hand footprints; kicad_symbol_unit_1.png shows the coil glyph with the OOMP value;
    the machine footprint render shows both 0603 pads with courtyard and body outline.
    README.md: SDFL1608S100KTF part number, LCSC/JLC C1035 links, pin table, datasheet
    link resolving to data/datasheet.pdf (2.9 MB SDFL series catalogue). Shared-renderer
    note: chip inductors previously drew a plain rounded body without terminations;
    working_svg.py now routes inductor outlines through the same two-terminal chip
    drawing as ferrite beads (verified on this part and compile-checked; the whole-repo
    inductor re-render remains a scheduled regeneration). Limitation: KiCad symbol/footprint
    checked as rendered SVG/PNG plus s-expression text rather than in a KiCad GUI.'
