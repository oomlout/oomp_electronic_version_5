jlcpcb_selection:
  compatibility_notes: 'Exact inductor identity: added one explicit family row electronic_inductor_0603_10_micro_henry_sunlord_sdfl1608s100ktf
    alongside the existing generic 0603 10 micro henry and Taiyo Yuden exact rows.
    The Sunlord part is a low-current (3 mA) RF chip inductor with 1.85 ohm DCR, 17
    MHz self-resonance and Q 30 at 2 MHz; those ratings are purchasing-choice facts,
    not a claim about every generic 10 uH 0603 inductor. Added the reviewed-choices
    adapter to the inductor family extras. Full-pass datasheet evidence confirms the
    identity and ratings.'
  datasheet_pages:
    dimensions:
    - 1
    document: Sunlord Multilayer Chip Ferrite Inductor SDFL series catalogue, rev.
      2025/5/23
    electrical_characteristics:
    - 3
