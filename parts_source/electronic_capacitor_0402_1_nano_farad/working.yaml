research_notes:
- 'The official JLC page lists Basic Fenghua 0402B102K500NT (C1523): 1 nF, 50 V, X7R,
  +-10% in 0402.'
- The Fenghua ordering code decodes exactly to that suffix, and the X7R 0402 capacitance/voltage
  table covers 1 nF at 50 V.
- Non-polarized two-terminal chip; the standard built-in 0402 chip renderer draws
  the package from the verified dimensions above.
