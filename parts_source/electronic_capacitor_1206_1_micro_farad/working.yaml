research_notes:
- 'The official JLC page lists Basic Samsung CL31B105KBHNNNE (C1848): 1 uF, 50 V,
  X7R, +-10% in 1206; reconfirmed live 2026-10-01 (stock 517,314).'
- The Samsung ordering decode covers the exact suffix (31 = 1206, H = 1.60 mm thickness),
  and the X7R Product Lineup table (page 28) lists CL31B105KBHNNN.
- Non-polarized two-terminal chip; the standard built-in 1206 chip renderer draws
  the package from the verified dimensions.
