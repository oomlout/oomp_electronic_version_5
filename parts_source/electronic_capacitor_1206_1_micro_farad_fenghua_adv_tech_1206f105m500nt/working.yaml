research_notes:
- Exact FH (Guangdong Fenghua Advanced Tech) C1926 / 1206F105M500NT purchasing variant;
  1206, 1 uF, 50 V, Y5V, ±20% verified against the staged live JLC capture 2026-09-28
  (stock 2,919, minimum 1, full reel 4,000, available order qty 2,850, MSL 1).
- 'Linked to the generic 1206 1 uF definition. IMPORTANT dielectric difference: the
  reviewed preference C1848 / CL31B105KBHNNNE (Samsung, X7R ±10% 50 V) on the generic
  ID is far more stable than this Y5V ±20% SKU. It must never replace the X7R preference,
  and projects requiring X7R stability must not substitute this SKU. The registry
  allows one preferred code per ID; C1926 is recorded as its own exact variant ID.'
- No datasheet PDF imported at intake; download is an integration-stage task (JLC
  lists https://jlc-prod-smt.oss-eu-central-1.aliyuncs.com/smtDataManualFile/8770991778323275776-C1926.pdf).
