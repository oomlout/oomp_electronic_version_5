jlcpcb_selection:
  compatibility_notes: 'Second code on the existing generic 1206 1 uF capacitor: the
    plain generic ID keeps its reviewed preference C1848 (Samsung CL31B105KBHNNNE,
    X7R +/-10% 50 V). C1926 is the exact FH Y5V +/-20% SKU (1206F105M500NT, 50 V),
    so it gets its own maker/mpn variant ID linked via generic_oomp_id, following
    the established variant taxonomy. Rating comparison from the staged capture: same
    1 uF value, package and 50 V rating, but Y5V +/-20% is a materially broader-tolerance,
    worse-stability dielectric than the X7R +/-10% preference - the variant must never
    replace the X7R preference. Two-terminal MLCC (pin_count 2); stock 2,919 recorded
    as observed. Edits made under the capacitor family lock.'
