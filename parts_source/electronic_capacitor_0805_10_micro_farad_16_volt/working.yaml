research_notes:
- Verified JLC C1713 / Samsung CL21A106KOQNNNE as the first reviewed preferred extended
  purchasing choice for this rated variant; 0805, 10 uF, 16 V, X5R, ±10% verified
  against the staged live JLC capture 2026-09-28. The Samsung ordering code (CL21
  = 0805, A = X5R, 106 = 10 uF, K = ±10%, OQ = 16 V) decodes consistently with the
  listed specifications; the live page specification table is the primary evidence.
- Linked to the generic 0805 10 uF definition as a lower-voltage purchasing variant;
  the reviewed Basic 25 V preference C15850 / CL21A106KAYNNNE and the 50 V rated variant
  on the generic ID remain unchanged. Projects needing 25 V margin must not substitute
  this 16 V SKU.
- No datasheet PDF imported at intake; download is an integration-stage task (JLC
  lists https://jlc-prod-smt.oss-eu-central-1.aliyuncs.com/smtDataManualFile/8586178161242984448-C1713.pdf).
