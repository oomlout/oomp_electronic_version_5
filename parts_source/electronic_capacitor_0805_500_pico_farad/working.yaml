research_notes:
- Verified JLC C1747 / Fenghua 0805B501K500NT as the first reviewed preferred extended
  purchasing choice for this previously absent generic 0805 500 pF value; the populate
  row was added by this intake. The Fenghua ordering code (B = X7R, 501 = 50 x 10^1
  pF, K = +/-10%, 500 = 50 V) decodes consistently with the listed specifications;
  the live page specification table is the primary evidence. This 0805 generic is
  distinct from the separate 0603 500 pF generic supplied by C1624.
- Live JLC detail page (staged capture 2026-09-28) shows Extended (Promotional Extended),
  0805, 500 pF, 50 V, X7R, +/-10%, stock 4,507, minimum 1, full reel 4,000, available
  order qty 4,489, MSL 1. No datasheet PDF imported at intake; download is an integration-stage
  task (JLC lists https://jlc-prod-smt.oss-eu-central-1.aliyuncs.com/smtDataManualFile/8770988584302600192-C1747.pdf).
