research_notes:
- Added a missing generic 1206 110 Ω value and verified FH JLC C1450 / RS-06K111JT
  as its preferred extended purchasing choice; 110 Ω is outside the project's E12
  base list.
- Live JLC detail page (staged capture 2026-09-28) shows Extended (Promotional Extended),
  1206, 110 Ω, ±5%, 250 mW, 200 V, ±100 ppm/°C, -55 to +155 °C, stock 4,393, minimum
  1, full reel 5,000. No datasheet PDF imported at intake; download is an integration-stage
  task.
