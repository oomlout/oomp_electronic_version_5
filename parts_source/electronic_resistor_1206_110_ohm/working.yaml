    at 82 and the explicit value list has no 1206 110 ohm row, and the reviewed registry
    has no preference for this ID. Following the C1335 precedent (first reviewed 0805
    110 ohm), one explicit generic row ["1206", "110_ohm"] was added and C1450 becomes
    its first preferred house identity, FH RS-06K111JT at 110 ohm, 1206, +/-5%, 250
    mW, 200 V, +/-100 ppm/degC. Sibling FH RS-06K series parts C1426 (11 ohm) and
    C1440 (43 ohm) used the same missing-value pattern. Edits made under the resistor
    family lock.'
