research_notes:
- 'The official JLC page lists Basic Texas Instruments ULN2003ADR (C7512): seven-channel
  Darlington array in SOIC-16; reconfirmed live 2026-10-02 (stock 345,414). The queue
  snapshot for this code was degraded (empty MPN/maker) and has been repaired from
  the live page + intake record identity.'
- Browser-downloaded the TI ULN200x/ULQ200x datasheet (42 pages, Rev. T) from the
  page's ti.com datasheet link (fetched same-origin from the www.ti.com page) into
  this part; it anchors the ULN2003A SOIC-16 family.
- 'Pinout per the standard ULN2003A arrangement: 1-7 = I1-I7, 8 = GND, 9 = COM, 10-16
  = O7-O1 (outputs in reverse order); Transistor_Array:ULN2003A matches pad-for-pad.'
