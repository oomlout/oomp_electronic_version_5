- JLC house-parts queue row C5961 (Nexperia 74HCT123D,653, SOIC-16, 16 pins) verified
  at intake; family batch integration C5961.
- Browser-extracted the signed JLC OSS link and downloaded the Nexperia 74HCT123 data
  sheet into this part.
- Pin table generated from the KiCad 74xx:74HCT123 master and cross-checked pad-for-pad
  (pin numbers and electrical types); no-connect pins filled to the 16-pin package
  count.
- Footprint Package_SO:SOIC-16_3.9x9.9mm_P1.27mm verified present in the KiCad 10
  library.
