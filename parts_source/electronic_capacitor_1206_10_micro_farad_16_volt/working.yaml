jlcpcb_selection:
  compatibility_notes: 'Second code on the existing generic 1206 10 uF capacitor:
    the plain generic ID keeps its reviewed preference C13585 (Samsung CL31A106KBHNNNE,
    50 V X5R +/-10%). C1849 is the exact Samsung 16 V rated SKU (CL31A106KOHNNNE,
    X5R +/-10%), so it gets its own maker/mpn rated-variant ID (16_volt suffix) linked
    via generic_oomp_id, following the established rated-variant taxonomy (as with
    the C1592 16 V row). Rating comparison from the staged capture: same 10 uF value,
    package and X5R +/-10%, but 16 V is a lower rating than the 50 V preference -
    the variant must never silently replace the 50 V part in higher-voltage circuits;
    it exists so 16 V-class designs can pick the cheaper exact SKU explicitly. Two-terminal
    MLCC (pin_count 2); stock 235,191 recorded as observed. Edits made under the capacitor
    family lock.'
