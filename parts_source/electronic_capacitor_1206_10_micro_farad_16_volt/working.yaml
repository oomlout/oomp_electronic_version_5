research_notes:
- Exact Samsung Electro-Mechanics C1849 / CL31A106KOHNNNE rated purchasing variant;
  1206, 10 uF, 16 V, X5R, ±10% verified against the staged live JLC capture 2026-09-28
  (stock 235,191, minimum 1, full reel 2,000, available order qty 209,883, MSL 1).
  The Samsung ordering code (KO = X5R 16 V) decodes consistently with the listed specifications.
- 'Linked to the generic 1206 10 uF definition. IMPORTANT rating difference: the reviewed
  preference C13585 / CL31A106KBHNNNE on the generic ID is the 50 V rated part; this
  C1849 SKU is the 16 V part and must never silently replace it in circuits that need
  the higher rating. It exists so projects that only need 16 V at 1206/10 uF can pick
  the cheaper exact SKU explicitly. The registry allows one preferred code per ID;
  C1849 is recorded as its own exact rated-variant ID.'
- No datasheet PDF imported at intake; download is an integration-stage task (JLC
  lists https://jlc-prod-smt.oss-eu-central-1.aliyuncs.com/smtDataManualFile/8586178189756674048-C1849.pdf).
