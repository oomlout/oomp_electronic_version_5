research_notes:
- Verified JLC C1616 / Fenghua 0603B361K500NT as the first reviewed preferred extended
  purchasing choice for this previously absent generic 0603 360 pF value; the populate
  row was added by this intake. The Fenghua ordering code (B = X7R, 361 = 36 x 10^1
  pF, K = +/-10%, 500 = 50 V) decodes consistently with the listed specifications;
  the live page specification table is the primary evidence.
- Live JLC detail page (staged capture 2026-09-28) shows Extended (Promotional Extended),
  0603, 360 pF, 50 V, X7R, +/-10%, stock 7,130, minimum 1, full reel 4,000, available
  order qty 7,091, MSL 1. No datasheet PDF imported at intake; download is an integration-stage
  task (JLC lists https://jlc-prod-smt.oss-eu-central-1.aliyuncs.com/smtDataManualFile/8770987961104117760-C1616.pdf).
