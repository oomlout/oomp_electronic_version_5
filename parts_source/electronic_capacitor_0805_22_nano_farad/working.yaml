research_notes:
- 'The official JLC page lists Basic Samsung CL21B223KBANNNC (C1729): 22 nF, 50 V,
  X7R, +-10% in 0805; reconfirmed live 2026-10-01 (stock 234,075).'
- Browser-downloaded the JLC datasheet and verified it is byte-identical to the family
  catalogue (sha256 96baebe4...); no second copy kept (oomp_datasheet_common_with).
- 'Known gap: the catalogue''s X7R 0805 lineup table does not list 22 nF (this 2015
  revision predates the variant); identity rests on the page 4 suffix decode, the
  adjacent KBA 0805 rows, and the live JLC description.'
