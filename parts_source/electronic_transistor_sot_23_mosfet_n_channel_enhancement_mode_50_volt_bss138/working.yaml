research_notes:
- Generic BSS138 family identity; no manufacturer or supplier code is implied.
- The onsemi datasheet linked by KiCad's official BSS138 symbol is the representative
  reference, with pins 1 gate, 2 source and 3 drain.
- The actual CASE 318 drawing gives 2.90 by 1.30 mm body, 2.40 mm overall width and
  0.44 mm nominal lead width; these are not copied from a different manufacturer's
  SOT-23 outline.
- No LCSC number is attached to the generic family; the following ledger row selects
  an exact manufacturer and ordering suffix separately.
