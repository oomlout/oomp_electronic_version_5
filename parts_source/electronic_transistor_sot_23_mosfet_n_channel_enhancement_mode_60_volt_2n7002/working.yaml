research_notes:
- This is a generic 2N7002 family entry, not an exact orderable manufacturer variant.
- The Nexperia sheet is retained as the representative browser-verified source for
  the standard SOT-23 outline and pins 1 gate, 2 source and 3 drain.
- Current, gate-voltage, resistance and thermal limits vary between manufacturers;
  representative Nexperia values are labelled as such and must not replace an exact
  design choice.
- No LCSC number is attached because an LCSC code identifies one exact manufacturer
  variant; the following ledger item selects one separately.
