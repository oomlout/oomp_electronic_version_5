research_notes:
- Verified JLC C1656 / Samsung CL10C270JB8NNNC as the first reviewed preferred extended
  purchasing choice for this in-grid generic 0603 27 pF value (the generic already
  exists in the 0603 capacitance_values grid, so no populate row was needed). The
  Samsung ordering code (CL10 = 0603, C = C0G, 270 = 27 pF, J = ±5%, B8 = 50 V) decodes
  consistently with the listed specifications; the live page specification table is
  the primary evidence. The pre-existing YAGEO CC0603JRNPO9BN270 (C107045) LCSC-only
  supply is preserved as a prior alternative.
- Live JLC detail page (staged capture 2026-09-28) shows Extended (Promotional Extended),
  0603, 27 pF, 50 V, C0G, +/-5%, stock 37,373, minimum 1, full reel 4,000, available
  order qty 36,016, MSL 1. No datasheet PDF imported at intake; download is an integration-stage
  task (JLC lists https://jlc-prod-smt.oss-eu-central-1.aliyuncs.com/smtDataManualFile/8579707047652622336-C1656.pdf).
