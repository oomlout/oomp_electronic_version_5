research_notes:
- Verified JLC C1860 / Fenghua 1206B272K500NT as the first reviewed preferred extended
  purchasing choice for this previously absent generic 1206 2.7 nF value; the populate
  row was added by this intake. The Fenghua ordering code (B = X7R, 272 = 2.7 nF,
  K = +/-10%, 500 = 50 V) decodes consistently with the listed specifications; the
  live page specification table is the primary evidence. Distinct from the 0603 and
  0805 2.7 nF generics supplied by C1609 and C1733.
- Live JLC detail page (staged capture 2026-09-28) shows Extended (Promotional Extended),
  1206, 2.7 nF, 50 V, X7R, +/-10%, stock 3,025, minimum 1, full reel 4,000, available
  order qty 3,015, MSL 1. No datasheet PDF imported at intake; download is an integration-stage
  task (JLC lists https://jlc-prod-smt.oss-eu-central-1.aliyuncs.com/smtDataManualFile/8770991387984568320-C1860.pdf).
