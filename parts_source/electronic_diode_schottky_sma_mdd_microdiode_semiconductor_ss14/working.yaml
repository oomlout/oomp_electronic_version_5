research_notes:
- 'The official JLC page lists Basic MDD SS14 (C2480): 40 V 1.0 A schottky rectifier
  in SMA (DO-214AC); reconfirmed live 2026-10-02 (stock 1,170,064).'
- Browser-downloaded the MDD SS12-SS1200 series datasheet (3 pages, Rev 2025A5) into
  this part; it anchors the SMA schottky family (SS12-SS1200 columns).
- 'VF discrepancy recorded: the live JLC description cites 550 mV @1 A, but the vendor
  table''s 0.70 V column block spans SS13-SS14 (550 mV is the SS12 column) - the vendor
  datasheet governs, 0.70 V recorded.'
