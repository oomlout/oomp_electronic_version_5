  visual_review: 'Inspected 2026-10-02 after the build, a direct kicad library run
    and a rebuild. working_svg_square_pins.png hero titled Diode SS14 SMA with K (cathode
    band) left and A (anode) right plus the bar symbol, no mirroring, no label overlap,
    no cropping. working_svg_dimensioned.png: SMA/DO-214AC outline per the KiCad D_SMA
    master geometry (body 4.5 x 2.8 x 2.3 mm recorded in dimensions_mm per the mechanical
    data). data/kicad manifest complete with Device:D_Schottky symbol and Diode_SMD:D_SMA
    machine + D_SMA_Handsoldering hand footprints. README.md: SS14 part number, LCSC/JLC
    C2480 links, 2-pin table (K/A), datasheet link resolving to data/datasheet.pdf
    (the MDD SMA series specification, family anchor). Limitation: KiCad symbol/footprint
    checked as rendered SVG/PNG plus s-expression text rather than in a KiCad GUI.'
