    bipolar and small-signal MOSFET rows existed; the parts registry carries no TO-220
    MOSFET). Added this exact Infineon row [transistor, to_220ab, mosfet, n_channel,
    enhancement_mode, 60_volt, 83_amp] under the transistor family lock. IRF1010EPBF
    IRF1010EPBF (TO-220AB; 60V 83A N-channel enhancement-mode MOSFET, 12mOhm@10V,
    170W) is its exact first reviewed preferred house choice. Rating comparison from
    the staged capture: Transistors/Thyristors/MOSFETs, package TO-220AB, stock 6337
    recorded as observed. Edits made under the transistor family lock.'
