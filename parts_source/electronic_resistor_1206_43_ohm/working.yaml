  compatibility_notes: 'Missing generic value/package: no electronic_resistor_1206_43_ohm
    existed in working_oomp_populate_resistor.py or reviewed_choices.json (checked
    RS-06K430JT, C1440 and 43_ohm tokens; 43 ohm is not in the project E12 base list
    [10, 12, 15, 18, 22, 27, 33, 39, 47, 56, 68, 75, 82], so the grid cannot generate
    it). Added one explicit low-value row ["1206", "43_ohm"]; base generic ID has
    no tolerance suffix because no prior 1206 43 ohm preference exists to conflict
    with (C1440 is the first reviewed 1206 43 ohm value, +-5%). Nearest generics 39
    ohm and 47 ohm are different values, not substitutes. Ratings from staged capture:
    43 ohm, 1206, thick film, 250 mW, 200 V, +-5%, +-100 ppm/degC, -55 to +155 degC;
    two-terminal chip part (pin_count 2).'
