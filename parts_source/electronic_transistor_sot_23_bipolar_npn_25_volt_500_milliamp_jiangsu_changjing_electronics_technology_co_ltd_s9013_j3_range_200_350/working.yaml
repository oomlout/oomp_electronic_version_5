  25 V NPN, 500 mA, 300 mW, hFE rank 200-350 in SOT-23; reconfirmed live 2026-10-02
  (stock 873,977).'
- Browser-downloaded the Changjing S9013 datasheet (2 pages, B.Nov 2011) into this
  part; it anchors the S9013 SOT-23 family.
- 'Datasheet pinout page 1: 1 = BASE, 2 = EMITTER, 3 = COLLECTOR; Transistor_BJT:Q_NPN_BEC
  matches pad-for-pad, same convention as the C2145/C2146/C2150 Changjing SOT-23 NPN
  integrations.'
