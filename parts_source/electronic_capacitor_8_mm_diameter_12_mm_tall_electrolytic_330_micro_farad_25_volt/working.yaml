research_notes:
- Verified JLC C2051 / CX (Dongguan Chengxing Elec) KM337M025F12RR0VH2FP0 as the first
  reviewed preferred extended purchasing choice for this previously absent leaded
  electrolytic value; the populate row was added by this intake. The KM ordering code
  (337 = 330 uF, M = +/-20%, 025 = 25 V) decodes consistently with the listed specifications;
  the live page specification table is the primary evidence. Same can size as the
  C2033 470 uF 10 V part (D8 x L12 mm).
- Leaded (radial through-hole) aluminum electrolytic, D8 x L12 mm, 3.5 mm pin spacing,
  2000 hrs at 105 C lifetime, ripple current 340 mA at 120 Hz; polarized, observe
  the marked negative stripe. Live JLC detail page (staged capture 2026-09-28) shows
  Extended (Promotional Extended), stock 36,836, minimum 1, full reel 500, available
  order qty 36,600. No datasheet PDF imported at intake; download is an integration-stage
  task (JLC lists https://jlc-prod-smt.oss-eu-central-1.aliyuncs.com/smtDataManualFile/8588901580645281792-C2051.pdf).
