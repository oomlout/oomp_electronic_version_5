research_notes:
- This is CP2102, not CP2102N. Easyduino U1 has conflicting symbol/value and LCSC
  identity; do not auto-match it.
- Exposed GND pad uses KiCad identifier 29; it is unnumbered in the datasheet.
- Installed KiCad 10 masters do not contain the original CP2102 symbol. CP2102N is
  not substituted; symbol selection is pending.
