research_notes:
- 'LCSC stock research 2026-09: highest-stock listing first (C106202, 2,093,000 in
  stock at capture); runners-up follow.'
- 'The official JLC page lists Basic Fenghua 0402CG180J500NT (C1549): 18 pF, 50 V,
  C0G, +-5% in 0402; reconfirmed live 2026-10-01.'
- The Fenghua ordering code decodes exactly to that suffix (CG = C0G, 180 = 18 pF,
  J = +-5%, 500 = 50 V), and the C0G 0402 table covers 18 pF at 50 V (page 6).
- Non-polarized two-terminal chip; the standard built-in 0402 chip renderer draws
  the package from the verified dimensions.
