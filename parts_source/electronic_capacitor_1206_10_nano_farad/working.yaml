research_notes:
- 'The official JLC page lists Basic Fenghua 1206B103K500NT (C1846): 10 nF, 50 V,
  X7R, +-10% in 1206; reconfirmed live 2026-10-01 (stock 230,801).'
- The Fenghua ordering code decodes exactly to that suffix (B = X7R, 103 = 10 nF,
  K = +-10%, 500 = 50 V), and the X7R 1206 table covers 10 nF at 50 V (thickness code
  FA).
- Non-polarized two-terminal chip; the standard built-in 1206 chip renderer draws
  the package from the verified dimensions.
