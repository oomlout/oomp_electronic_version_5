research_notes:
- 'The official JLC page lists Basic Fenghua 0603B151K500NT (C1594): 150 pF, 50 V,
  X7R, +-10% in 0603; reconfirmed live 2026-10-01.'
- The Fenghua ordering code decodes exactly to that suffix (B = X7R, 151 = 150 pF,
  K = +-10%, 500 = 50 V), and the X7R 0603 table covers 150 pF at 50 V.
- Non-polarized two-terminal chip; the standard built-in 0603 chip renderer draws
  the package from the verified dimensions.
