research_notes:
- Exact Samsung Electro-Mechanics C1711 / CL21B104KBCNNNC purchasing variant; 0805,
  100 nF, 50 V, X7R, ±10% verified against the staged live JLC capture 2026-09-28.
- Linked to the generic 0805 100 nF 50 V definition. The reviewed Basic preference
  C49678 / CC0805KRX7R9BB104 (YAGEO, same 100 nF 50 V X7R ±10% spec) keeps the plain
  50_volt generic ID; the 100 V C28233 preference on the plain 100 nF generic is also
  unchanged. The registry allows one preferred code per ID, so this equivalent-spec
  Samsung SKU is recorded as its own exact variant ID following the established maker/mpn
  variant taxonomy (as with the Samsung C1591 row on 0603).
- No datasheet PDF imported at intake; download is an integration-stage task (JLC
  lists https://jlc-prod-smt.oss-eu-central-1.aliyuncs.com/smtDataManualFile/8586177282230652928-C1711.pdf).
