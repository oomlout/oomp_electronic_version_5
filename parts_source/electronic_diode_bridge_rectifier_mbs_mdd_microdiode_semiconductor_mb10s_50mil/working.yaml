- file_destination: datasheet.pdf
  file_source: parts_source/electronic_diode_bridge_rectifier_mbs_mdd_microdiode_semiconductor_mb10s_50mil/datasheet.pdf
jlcpcb_selection:
  compatibility_notes: Created an exact MDD MB10S-50MIL bridge-rectifier identity
    because no existing OOMP bridge entry matches its maker, MPN and MBS package.
    Its live JLC Basic ratings are 1 A rectified current, 1 kV reverse voltage, 35
    A surge, 1.1 V at 400 mA forward voltage and 5 uA at 1 kV leakage. Pin mapping
    and mechanical drawing remain for the full pass.
  datasheet_pages:
    document: MDD MB1S-MB10S MBS series specification, Rev 2024A2 (C2488 provenance,
      family anchor)
    electrical_characteristics:
    - 1
    maximum_ratings:
    - 1
    mechanical_data:
    - 1
    pinout:
    - 1
  footprint_checked: true
  official_url: https://jlcpcb.com/partdetail/2865-MB10S50MIL/C2488
  pcba_min_qty_observed: null
  pinout_checked: true
  purchase_moq_observed: 1
  ratings:
    Current - Rectified: 1A
    Non-Repetitive Peak Forward Surge Current: 35A
    Operating Junction Temperature Range: -55℃~+150℃
    Reverse Leakage Current (Ir): 5uA@1kV
    Type: Single-Phase Rectifier
    Voltage - DC Reverse(Vr): 1kV
    Voltage - Forward(Vf@If): 1.1V@400mA
  stock_observed: 762427
  tier: basic
  tier_label_observed: Basic
  verified_on: '2026-10-02'
  visual_review: 'Inspected 2026-10-02 after the build, a direct kicad library run
    and a rebuild. working_svg_square_pins.png hero titled Diode MB10S-50MIL MBS with
    the four pins labelled + (1) and ~ (2) on the left, ~ (4) and - (3) on the right,
    matching the datasheet pinout (1 = +, 2 = ~, 3 = -, 4 = ~). working_svg_dimensioned.png:
    MBS outline per the KiCad Diode_Bridge_Vishay_MBLS master geometry (body ~4.5-4.9
    x 2.6 mm recorded in dimensions_mm per the mechanical data). data/kicad manifest
    complete with Device:D_Bridge_+A-A symbol and Diode_SMD:Diode_Bridge_Vishay_MBLS
    machine footprint (no HandSolder master for this bridge footprint; the part declares
    hand_solder intentionally empty per the 2-asset rule). README.md: MB10S-50MIL
    part number, LCSC/JLC C2488 links, 4-pin table (+/~ -/~), datasheet link resolving
    to data/datasheet.pdf (the MDD MBS series specification, family anchor). Limitation:
    KiCad symbol/footprint checked as rendered SVG/PNG plus s-expression text rather
    than in a KiCad GUI.'
