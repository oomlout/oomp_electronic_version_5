research_notes:
- 'The official JLC page lists Basic Sunlord SDFL2012S100KTF (C1046): 10 uH +-10%,
  Q 50 at 2 MHz, SRF 24 MHz, DCR 1.15 ohm, 15 mA; reconfirmed live 2026-10-01.'
- 'The Sunlord ordering decode covers the full suffix: SDFL chip ferrite inductor,
  2012 [0805] 2.0 x 1.25 mm, S material, S100 = 10 uH, K = +-10%, T tape and reel,
  F hazardous-substance-free.'
- Non-polarized two-terminal chip; the standard built-in 0805 chip renderer draws
  the package from the verified dimensions above.
- The 15 mA / 1.15 ohm ratings belong to this exact purchasing choice; the generic
  0805 10 uH row stays unrated.
