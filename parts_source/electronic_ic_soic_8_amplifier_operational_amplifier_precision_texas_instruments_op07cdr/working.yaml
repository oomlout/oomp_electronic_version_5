research_notes:
- 'The official JLC page lists Basic Texas Instruments OP07CDR (C7433): precision
  op-amp in SOIC-8; reconfirmed live 2026-10-02 (stock 236,159). The queue snapshot
  for this code was degraded (empty MPN/maker) and has been repaired from the live
  page + intake record identity.'
- Browser-downloaded the TI OP07x datasheet (24 pages, Rev. H) from the page's ti.com.cn
  datasheet link (fetched same-origin from the www.ti.com.cn page) into this part;
  it anchors the OP07 SOIC-8 family.
- 'Pinout per the TI package drawing: 1/8 = offset trim, 2 = IN-, 3 = IN+, 4 = V-,
  5 = NC (D package), 6 = OUT, 7 = V+; Amplifier_Operational:OP07 matches pad-for-pad.'
