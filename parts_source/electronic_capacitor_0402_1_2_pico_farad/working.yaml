    lists have no 1.2 pF value, and the reviewed registry has no preference for this
    ID (checked reviewed_choices.json for C1551 and 0402CG1R2C500NT: no entries).
    Following the missing-value decision row and the C1544/C1550 precedents, one explicit
    0402 1_2_pico_farad row was added and C1551 becomes its first reviewed preferred
    house identity: FH (Guangdong Fenghua Advanced Tech) 0402CG1R2C500NT, 1.2 pF,
    50 V, C0G, 0402 MLCC. Verified two-terminal non-polarized chip; the Fenghua ordering
    code 1R2 decodes consistently with the listed 1.2 pF. Note: the live page lists
    no tolerance; recorded as not-listed rather than decoded from the MPN. Edits made
    under the capacitor family lock.'
