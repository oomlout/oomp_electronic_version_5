research_notes:
- Exact FH (Guangdong Fenghua Advanced Tech) C1888 / 1206CG151J500NT purchasing variant;
  1206, 150 pF, 50 V, C0G, ±5% verified against the staged live JLC capture 2026-09-28
  (stock 1, minimum 1, full reel 4,000, available order qty 1, MSL 1). Stock is extremely
  low at capture time; low stock does not change the verified identity and the part
  is retained as a candidate.
- 'Linked to the generic 1206 150 pF definition. Dielectric difference: the reviewed
  preference C1850 / 1206B151K500NT on the generic ID is from the same maker (FH)
  but X7R ±10%, and it keeps the preference slot; this C1888 SKU is C0G ±5% - the
  more stable, tighter-tolerance dielectric of the two. Projects needing C0G stability
  at 150 pF/1206 should pick this variant explicitly; the X7R preference is not downgraded.
  The registry allows one preferred code per ID; C1888 is recorded as its own exact
  variant ID.'
- No datasheet PDF imported at intake; download is an integration-stage task (JLC
  lists https://jlc-prod-smt.oss-eu-central-1.aliyuncs.com/smtDataManualFile/8770991553890668544-C1888.pdf).
