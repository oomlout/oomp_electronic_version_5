jlcpcb_selection:
  compatibility_notes: 'Second code on the existing generic 1206 150 pF capacitor:
    the plain generic ID keeps its reviewed preference C1850 (FH 1206B151K500NT, X7R
    +/-10% 50 V). C1888 is the exact FH C0G +/-5% SKU (1206CG151J500NT, 50 V) from
    the same maker, so it gets its own maker/mpn variant ID linked via generic_oomp_id,
    following the established variant taxonomy. Rating comparison from the staged
    capture: same 150 pF value, package and 50 V rating, but C0G +/-5% is the more
    stable, tighter-tolerance dielectric than the X7R +/-10% preference; projects
    needing C0G stability at 150 pF/1206 should pick this variant explicitly and the
    X7R preference is not downgraded. Two-terminal MLCC (pin_count 2); stock 1 at
    capture recorded as observed (extremely low; does not change identity). Edits
    made under the capacitor family lock.'
