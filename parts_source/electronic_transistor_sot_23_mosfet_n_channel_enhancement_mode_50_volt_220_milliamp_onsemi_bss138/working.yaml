research_notes:
- LCSC C52895 identifies onsemi BSS138 in SOT-23, with 42,980 pieces in stock at browser
  verification on 2026-09-03; stock is not a permanent guarantee.
- The manufacturer ordering table explicitly lists BSS138 as well as BSS138-G. This
  part is the bare BSS138 orderable device from the supplier listing, not an assumed
  suffix variant.
- The manufacturer sheet confirms 50 V, 220 mA and pins 1 gate, 2 source, 3 drain;
  its minimum-pad thermal conditions qualify the current and power limits.
- The downloaded CASE 318 outline is the same verified manufacturer drawing used as
  the reference for the separate generic BSS138 entry.
