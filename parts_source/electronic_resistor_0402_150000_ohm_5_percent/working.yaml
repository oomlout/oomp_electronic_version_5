research_notes:
- Rated/tolerance variant. The generic 0402 150 kΩ entry retains its existing YAGEO
  C93947 preference at ±1%.
- Use this FH C1166 variant where ±5% is acceptable; JLC showed only 5 pieces at capture
  and LCSC showed unavailable.
- 0402 series datasheet specifies 1/16 W normal power and 50 V limiting element voltage;
  confirm application derating in the full pass.
