research_notes:
- Exact FH (Guangdong Fenghua Advanced Tech) C1703 / 0603F473M500NT purchasing variant;
  0603, 47 nF, 50 V, Y5V, ±20% verified against the staged live JLC capture 2026-09-28.
- 'Linked to the generic 0603 47 nF definition. IMPORTANT dielectric difference: the
  reviewed preference on the generic ID is X7R ±10%; this FH SKU is Y5V ±20%, a materially
  broader-tolerance, worse-stability dielectric. It must never replace the X7R preference,
  and projects requiring X7R stability must not substitute this SKU. The registry
  allows one preferred code per ID; C1703 is recorded as its own exact variant ID.'
- No datasheet PDF imported at intake; download is an integration-stage task (JLC
  lists https://jlc-prod-smt.oss-eu-central-1.aliyuncs.com/smtDataManualFile/8770988190515499008-C1703.pdf).
