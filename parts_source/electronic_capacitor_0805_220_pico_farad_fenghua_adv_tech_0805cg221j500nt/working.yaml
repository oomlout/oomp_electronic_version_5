jlcpcb_selection:
  compatibility_notes: 'Third code on the existing generic 0805 220 pF capacitor:
    the plain generic ID keeps its reviewed preference C107145 (Yageo CC0805KRX7R9BB221,
    X7R +/-10% 50 V) and the exact-maker FH X7R variant C1727 (0805B221K500NT) already
    exists. C1805 is the exact FH C0G +/-5% SKU (0805CG221J500NT, 50 V), so it gets
    its own maker/mpn variant ID linked via generic_oomp_id, following the established
    variant taxonomy. Rating comparison from the staged capture: same 220 pF value,
    package and 50 V rating, but C0G +/-5% is the more stable, tighter-tolerance dielectric
    than either X7R choice; projects needing C0G stability at 220 pF/0805 should pick
    this variant explicitly and neither X7R choice is downgraded. Two-terminal MLCC
    (pin_count 2); stock 3,293 recorded as observed. Edits made under the capacitor
    family lock.'
