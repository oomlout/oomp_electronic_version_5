research_notes:
- Exact FH (Guangdong Fenghua Advanced Tech) C1805 / 0805CG221J500NT purchasing variant;
  0805, 220 pF, 50 V, C0G, ±5% verified against the staged live JLC capture 2026-09-28
  (stock 3,293, minimum 1, full reel 4,000, available order qty 3,249, MSL 1).
- Linked to the generic 0805 220 pF definition. The reviewed preference C107145 /
  CC0805KRX7R9BB221 (Yageo, X7R ±10%) keeps the generic preference slot and the sibling
  FH X7R variant C1727 / 0805B221K500NT already exists; this C1805 SKU is C0G ±5%
  - the more stable, tighter-tolerance dielectric of the family. Projects needing
  C0G stability at 220 pF/0805 should pick this variant explicitly; neither X7R choice
  is downgraded. The registry allows one preferred code per ID; C1805 is recorded
  as its own exact variant ID.
- No datasheet PDF imported at intake; download is an integration-stage task (JLC
  lists https://jlc-prod-smt.oss-eu-central-1.aliyuncs.com/smtDataManualFile/8770991093494501376-C1805.pdf).
