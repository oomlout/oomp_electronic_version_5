research_notes:
- Verified JLC C1928 / Fenghua 1206F153M500NT as the first reviewed preferred extended
  purchasing choice for this previously absent generic 1206 15 nF value; the populate
  row was added by this intake. The Fenghua ordering code (F = Y5V, 153 = 15 nF, M
  = +/-20%, 500 = 50 V) decodes consistently with the listed specifications; the live
  page specification table is the primary evidence. Distinct from the 0402, 0603 and
  0805 15 nF generics supplied by C1583, C1596 and C1718.
- Live JLC detail page (staged capture 2026-09-28) shows Extended (Promotional Extended),
  1206, 15 nF, 50 V, Y5V, +/-20%, stock 4, minimum 1, full reel 4,000, available order
  qty 4, MSL 1. Stock is extremely low at capture time; low stock does not change
  the verified identity and the part is retained as a candidate. No datasheet PDF
  imported at intake; download is an integration-stage task (JLC lists https://jlc-prod-smt.oss-eu-central-1.aliyuncs.com/smtDataManualFile/8770991784136986624-C1928.pdf).
