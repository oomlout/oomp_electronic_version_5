research_notes:
- 'The official JLC page lists Basic Fenghua 0805B471K500NT (C1743): 470 pF, 50 V,
  X7R, +-10% in 0805; reconfirmed live 2026-10-01 (stock 296,120).'
- The Fenghua ordering code decodes exactly to that suffix (B = X7R, 471 = 470 pF,
  K = +-10%, 500 = 50 V), and the X7R 0805 table covers 470 pF at 50 V (thickness
  code EA).
- Non-polarized two-terminal chip; the standard built-in 0805 chip renderer draws
  the package from the verified dimensions.
