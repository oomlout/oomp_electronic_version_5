research_notes:
- JLC house-parts queue row C5650 (Nexperia 74HC4066PW,118, TSSOP-14, 14 pins) verified
  at intake; family batch integration C5650.
- Shares the 74HC4066 family datasheet downloaded into C5628 (byte-identical copy
  in this part's source folder).
- Pin table generated from the KiCad 4xxx:4066 master and cross-checked pad-for-pad
  (pin numbers and electrical types); no-connect pins filled to the 14-pin package
  count.
- Footprint Package_SO:TSSOP-14_4.4x5mm_P0.65mm verified present in the KiCad 10 library.
