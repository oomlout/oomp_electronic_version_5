research_notes:
- Exact Samsung Electro-Mechanics C1761 / CL21F105ZAFNNNE purchasing variant; 0805,
  1 uF, 25 V, Y5V, -20%~+80% verified against the staged live JLC capture 2026-09-28.
- 'Linked to the generic 0805 1 uF definition. IMPORTANT dielectric difference: the
  reviewed Basic preference C28323 / CL21B105KBFNNNE (X7R ±10% 50 V) and the X7R 25
  V rated variant C1712 on the generic family are far more stable than this Y5V -20/+80%
  SKU. It must never replace the X7R choices, and projects requiring X7R stability
  or tight tolerance must not substitute this SKU. The registry allows one preferred
  code per ID; C1761 is recorded as its own exact variant ID.'
- No datasheet PDF imported at intake; download is an integration-stage task (JLC
  lists https://jlc-prod-smt.oss-eu-central-1.aliyuncs.com/smtDataManualFile/8586178179509719040-C1761.pdf).
