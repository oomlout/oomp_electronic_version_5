research_notes:
- 'The official JLC page lists Basic Jiangsu Changjing SS8050(RANGE:200-350) (C2150):
  25 V NPN, 1.5 A, 300 mW, hFE rank 200-350 in SOT-23; reconfirmed live 2026-10-02
  (stock 1,853,286).'
- Browser-downloaded the Changjing SS8050 datasheet (4 pages, Rev 2.1) into this part;
  it anchors the Changjing SS8050 SOT-23 family (separate from the jsmsemi SS8050
  part, which has its own datasheet and masters).
- 'Datasheet pinout page 1: 1 = BASE, 2 = EMITTER, 3 = COLLECTOR; Transistor_BJT:Q_NPN_BEC
  matches pad-for-pad, same convention as the C2145/C2146 Changjing SOT-23 NPN integrations.'
