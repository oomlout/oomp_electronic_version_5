    neither the 0402 value list in working_oomp_populate_capacitor.py (nearest pF
    neighbors 2/2.2 pF added by C1558/C1559 and 8/10/12 pF; 2.5 pF absent) nor the
    reviewed registry has any 2.5 pF 0402 row or preference. Following the missing-value
    decision row and the C32949/C1527/C1544/C1550/C1551/C1553/C1558/C1559 precedent,
    one explicit 0402 2_5_pico_farad row was added and C1560 becomes its first reviewed
    preferred house identity: FH (Guangdong Fenghua Advanced Tech) 0402CG2R5C500NT,
    2.5 pF, 50 V, C0G, 0402 MLCC. The Fenghua ordering code 2R5 = 2.5 pF is consistent
    with the listed 2.5 pF; the live page specification table is the primary evidence.
    The live page lists no tolerance row, so the generic ID carries no tolerance suffix;
    the full stage should extract tolerance from the datasheet. Edits made under the
    capacitor family lock.'
