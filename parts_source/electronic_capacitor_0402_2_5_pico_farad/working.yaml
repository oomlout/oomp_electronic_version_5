research_notes:
- Verified JLC C1560 / Fenghua 0402CG2R5C500NT as the first reviewed preferred extended
  purchasing choice for this previously absent generic 0402 2.5 pF value; the populate
  row was added by this intake. The Fenghua ordering code (CG = C0G, 2R5 = 2.5 pF,
  500 = 50 V) decodes consistently with the listed specifications; the live page specification
  table is the primary evidence.
- Live JLC detail page (staged capture 2026-09-28) shows Extended (Promotional Extended),
  0402, 2.5 pF, 50 V, C0G, stock 7,527, minimum 1, full reel 10,000, available order
  qty 7,477, MSL 1. The page lists no tolerance row; full stage should extract the
  tolerance from the datasheet rather than decoding the MPN. No datasheet PDF imported
  at intake; download is an integration-stage task (JLC lists https://jlc-prod-smt.oss-eu-central-1.aliyuncs.com/smtDataManualFile/8770987793722163200-C1560.pdf).
