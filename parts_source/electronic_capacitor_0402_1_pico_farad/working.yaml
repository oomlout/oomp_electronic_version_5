research_notes:
- Verified JLC C1550 / Fenghua 0402CG1R0C500NT as the first reviewed preferred extended
  purchasing choice for this previously absent generic 0402 1 pF value; the populate
  row was added by this intake. The Fenghua ordering code (CG = C0G, 1R0 = 1.0 pF,
  500 = 50 V) decodes consistently with the listed specifications; the live page specification
  table is the primary evidence.
- Live JLC detail page (staged capture 2026-09-28) shows Extended (Promotional Extended),
  0402, 1 pF, 50 V, C0G, stock 922,332, minimum 1, full reel 10,000, available order
  qty 878,566, MSL 1. The page lists no tolerance row; full stage should extract the
  tolerance from the datasheet rather than decoding the MPN. No datasheet PDF imported
  at intake; download is an integration-stage task (JLC lists https://jlc-prod-smt.oss-eu-central-1.aliyuncs.com/smtDataManualFile/8770987761564164096-C1550.pdf).
