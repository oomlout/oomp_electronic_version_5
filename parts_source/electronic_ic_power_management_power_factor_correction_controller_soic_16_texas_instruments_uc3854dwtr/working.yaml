display_render:
  description: KiCad SOIC-16W model is scaled vertically from 2.75 mm to 2.5 mm to
    meet the TI 2.65 mm height maximum. Catalogue 9.9 x 3.9 mm body and 6.04 mm overall
    width conflict with the manufacturer DW wide package, approximately 10.3 mm overall
    width; catalogue height and footprint are missing. Not a verified mechanical model
    or footprint. TI specifies UC3854DW for UC3854DWTR; variable production characters
    are omitted. Typeface, orientation, placement and variable lot/date details are
    illustrative.
