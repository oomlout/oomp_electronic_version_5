    quad_2_input_nand_gate_schmitt_trigger, dual_2_to_4_line_decoder_demultiplexer).
    UC3854DWTR (SOIC-16-300mil; average-current-mode power factor correction controller
    (UC3854, TI); power_factor_correction_controller token new here) is its exact
    first reviewed preferred house choice; the family token and package come straight
    off the page. Edits made under the ic family lock.
