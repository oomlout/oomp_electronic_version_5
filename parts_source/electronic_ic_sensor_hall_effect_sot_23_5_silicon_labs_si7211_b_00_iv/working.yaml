    from the catalogue ID. The source specifies a five-pin footprint, while the specific
    Silicon Labs data sheet and current product selector specify three pins; a separate
    Silicon Labs selector guide contradicts them with five pins. Not a verified mechanical
    model or footprint. 7211 is an illustrative family identifier, not an established
    production marking; the manufacturer specifies a manufacturing code. Typeface,
    orientation, placement and variable lot/date details are illustrative.
