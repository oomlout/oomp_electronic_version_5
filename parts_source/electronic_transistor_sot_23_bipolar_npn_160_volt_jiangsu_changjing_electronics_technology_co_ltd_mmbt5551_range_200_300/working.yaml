research_notes:
- 'The official JLC page lists Basic Jiangsu Changjing MMBT5551(RANGE:200-300) (C2145):
  160 V NPN, 600 mA, 300 mW, hFE rank 200-300 in SOT-23; reconfirmed live 2026-10-01
  (stock 2,259,646).'
- Browser-downloaded the Changjing MMBT5551 datasheet (2 pages, March 2013) into this
  part; it anchors the MMBT5551/high-voltage NPN SOT-23 family.
- 'Datasheet pinout page 1: 1 = BASE, 2 = EMITTER, 3 = COLLECTOR; the KiCad Transistor_BJT:Q_NPN_BEC
  symbol numbers its pins B = 1, E = 2, C = 3, matching pad-for-pad.'
