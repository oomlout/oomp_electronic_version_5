  visual_review: 'Inspected 2026-10-02 after the build, a direct kicad library run
    and a rebuild. working_svg_square_pins.png hero titled Transistor MMBT5551(RANGE:200-300)
    SOT 23 with the SOT-23 package drawing labelled emitter (pin 2) left, base (pin
    1) left-lower, collector (pin 3) right, matching the datasheet pinout page 1 (1
    = BASE, 2 = EMITTER, 3 = COLLECTOR). working_svg_dimensioned.png: SOT-23 (JEDEC
    TO-236 Var AB) outline per the Package_TO_SOT_SMD:SOT-23 master geometry (datasheet
    carries ratings and pinout but no dimension table; recorded in dimension_reference).
    data/kicad manifest complete with Transistor_BJT:Q_NPN_BEC symbol and Package_TO_SOT_SMD:SOT-23
    machine + SOT-23_Handsoldering hand footprints. README.md: MMBT5551(RANGE:200-300)
    part number, LCSC/JLC C2145 links, 3-pin table (base/emitter/collector), datasheet
    link resolving to data/datasheet.pdf (the Changjing MMBT5551 specification, family
