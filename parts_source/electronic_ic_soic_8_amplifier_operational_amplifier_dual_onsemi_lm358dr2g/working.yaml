research_notes:
- 'The official JLC page lists Basic onsemi LM358DR2G (C7950): dual general-purpose
  op-amp in SOIC-8; reconfirmed live 2026-10-02 (stock 799,680). The queue snapshot
  for this code was degraded (empty MPN/maker) and has been repaired from the live
  page + intake record identity.'
- Datasheet was already captured at intake (sha256 e66a9193... matches the provenance
  file); no new download.
- Pinout is the standard dual op-amp arrangement (1 = OUT1, 2 = IN1-, 3 = IN1+, 4
  = V-, 5 = IN2+, 6 = IN2-, 7 = OUT2, 8 = V+); Amplifier_Operational:LM358 matches
  pad-for-pad.
