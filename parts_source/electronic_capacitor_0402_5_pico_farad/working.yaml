    anywhere in the capacitor family: the 0402 in-grid value list (8/15/18/22/27/33/120
    pF plus the explicit rows added today by C1527-C1570, which include 0_5/1/1_2/1_5/1_8/2/2_2/2_5/2_7/3/3_3/3_9/4/4_7
    pF) has no plain 5 pF, and the reviewed registry has no preference for this ID
    (checked reviewed_choices.json for C1573 and 0402CG5R0C500NT: no entries; only
    0_5/1_5/2_5 pico IDs exist). Following the missing-value decision row and the
    C1544/C1550/C1563/C1564/C1568 precedents, one explicit 0402 5_pico_farad row was
    added and C1573 becomes its first reviewed preferred house identity: FH (Guangdong
    Fenghua Advanced Tech) 0402CG5R0C500NT, 5 pF, 50 V, C0G, 0402 MLCC, queued tier
    preferred_extended (live badge Extended). Verified two-terminal non-polarized
    chip; the Fenghua ordering code 5R0/500 decodes consistently with the listed 5
    pF, 50 V.'
