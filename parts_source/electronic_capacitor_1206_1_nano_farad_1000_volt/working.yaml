jlcpcb_selection:
  compatibility_notes: 'Second code on the existing generic 1206 1 nF capacitor: the
    plain generic ID keeps its reviewed preference C1845 (FH 1206B102K500NT, X7R +/-10%
    50 V) and the 2 kV rated variant C9196 already exists. C1941 is the exact FH 1
    kV rated SKU (1206B102K102NT, X7R +/-10%), so it gets its own rated-variant ID
    (1000_volt suffix) linked via generic_oomp_id, following the established rated-variant
    taxonomy (as with the C9196 2 kV row). Rating comparison from the staged capture:
    same 1 nF value, package and X7R +/-10%, but 1 kV is a higher rating than the
    50 V preference - projects needing 1 kV should pick this variant explicitly; the
    50 V preference stays on the generic. Two-terminal MLCC (pin_count 2); stock 238,478
    recorded as observed. Edits made under the capacitor family lock.'
