research_notes:
- Exact FH (Guangdong Fenghua Advanced Tech) C1941 / 1206B102K102NT rated purchasing
  variant; 1206, 1 nF, 1 kV, X7R, ±10% verified against the staged live JLC capture
  2026-09-28 (stock 238,478, minimum 1, full reel 3,000, available order qty 222,800,
  MSL 1). The Fenghua ordering code (102 = 1 nF, K = +/-10%, 102 = 10 x 10^2 V = 1
  kV) decodes consistently with the listed specifications.
- 'Linked to the generic 1206 1 nF definition. Rating difference: the reviewed preference
  C1845 / 1206B102K500NT on the generic ID is the 50 V part; this C1941 SKU is the
  1 kV part and must be chosen explicitly for high-voltage circuits. It sits between
  the plain 50 V generic and the existing 2 kV rated variant C9196. The registry allows
  one preferred code per ID; C1941 is recorded as its own exact rated-variant ID.'
- No datasheet PDF imported at intake; download is an integration-stage task (JLC
  lists https://jlc-prod-smt.oss-eu-central-1.aliyuncs.com/smtDataManualFile/8770991855854985216-C1941.pdf).
