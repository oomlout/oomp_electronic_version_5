  notes: '2.54 mm right-angle male header, plastic moulded on the LONG pin side: the
    long legs (~6 mm) run down into the board, giving clearance under the plastic.
    Drawing derived from KiCad PinHeader_1x10_P2.54mm_Horizontal with the plastic
    block mirrored across the pin row. LCSC family mechanical reference: C2905424
    / KH-2.54PH90-1X2P-L13.8. The drawing gives a 2.50 mm carrier, 0.64 mm square
    pins, a 6.0 mm long leg and a 3.0 mm short leg. The generated pin count remains
    the OOMP variant identity.'
