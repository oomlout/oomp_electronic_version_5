research_notes:
- 'The official JLC page lists Basic Samsung CL21B224KBFNNNE (C5378): 220 nF, 50 V,
  X7R, +-10% in 0805; reconfirmed live 2026-10-02 (stock 611,888).'
- The Samsung ordering decode covers the exact suffix (F = 1.25 mm thickness), and
  the X7R 0805 lineup table (page 27) lists CL21B224KBFNNN.
- Non-polarized two-terminal chip; the standard built-in 0805 chip renderer draws
  the package from the verified dimensions.
