research_notes:
- 'The official JLC page lists Basic Samsung CL21A475KAQNNNE (C1779): 4.7 uF, 25 V,
  X5R, +-10% in 0805; reconfirmed live 2026-10-01 (stock 3,052,932).'
- Browser-downloaded the JLC datasheet and verified it is byte-identical to the family
  catalogue (sha256 96baebe4...); no second copy kept (oomp_datasheet_common_with).
- 'Known gap: the catalogue''s X5R 0805 lineup lists the 50 V KB variant but not the
  25 V KA variant (this 2015 revision predates it); identity rests on the page 4 decode
  (A = 25 V, Q = 1.25 mm), the adjacent KB row, and the live JLC description.'
