research_notes:
- JLC house-parts queue row C6068 (Nexperia 74LVC157APW,118, TSSOP-16, 16 pins) verified
  at intake; family batch integration C6068.
- Shares the 74LVC157 family datasheet downloaded into C6067 (byte-identical copy
  in this part's source folder).
- Pin table generated from the KiCad 74xx:74LS157 master and cross-checked pad-for-pad
  (pin numbers and electrical types); no-connect pins filled to the 16-pin package
  count.
- Footprint Package_SO:TSSOP-16_4.4x5mm_P0.65mm verified present in the KiCad 10 library.
