research_notes:
- 'The official JLC page lists Basic Fenghua 0402CG200J500NT (C1554): 20 pF, 50 V,
  C0G, +-5% in 0402; reconfirmed live 2026-10-01.'
- The Fenghua ordering code decodes exactly to that suffix (CG = C0G, 200 = 20 pF,
  J = +-5%, 500 = 50 V), and the C0G 0402 table covers 20 pF at 50 V.
- Non-polarized two-terminal chip; the standard built-in 0402 chip renderer draws
  the package from the verified dimensions.
