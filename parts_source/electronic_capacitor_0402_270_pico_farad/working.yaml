- Verified JLC C1533 / Fenghua 0402B271K500NT as the first reviewed preferred extended
  purchasing choice for this previously absent generic 0402 270 pF value; the populate
  row was added by this intake. The Fenghua ordering code (271 = 27 x 10^1 pF) decodes
  consistently with the listed 270 pF.
- Live JLC detail page (staged capture 2026-09-28) shows Extended (Promotional Extended),
  0402, 270 pF, 50 V, X7R, ±10%, stock 21,545, minimum 1, full reel 10,000, available
  order qty 21,487, MSL 1. No datasheet PDF imported at intake; download is an integration-stage
  task (JLC lists https://jlc-prod-smt.oss-eu-central-1.aliyuncs.com/smtDataManualFile/8770987699094200320-C1533.pdf).
