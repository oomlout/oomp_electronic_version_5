jlcpcb_selection:
  compatibility_notes: 'Missing generic value/package: no electronic_resistor_1206_8_2_ohm
    existed in working_oomp_populate_resistor.py or reviewed_choices.json (checked
    RS-06L8R2JT, C1424, and 8_2_ohm tokens; 8.2 ohm = 82 x 0.1 sits outside the E12
    grid multipliers, so the grid cannot generate it). Added one explicit low-value
    row ["1206", "8_2_ohm"]; base generic ID has no tolerance suffix because no prior
    1206 8.2 ohm preference exists to conflict with (C1424 is the first reviewed 1206
    8.2 ohm value, +-5%). The existing 0805/0603 8.2 ohm equivalents are absent too,
    so nothing to reuse. Ratings from staged capture: 8.2 ohm, 1206, thick film, 250
    mW, 200 V, +-5%, +-250 ppm/degC, -55 to +155 degC; two-terminal chip part (pin_count
    2).'
