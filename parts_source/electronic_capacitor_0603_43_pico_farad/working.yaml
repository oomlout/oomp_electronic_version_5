research_notes:
- Verified JLC C1670 / Fenghua 0603CG430J500NT as the first reviewed preferred extended
  purchasing choice for this previously absent generic 0603 43 pF value; the populate
  row was added by this intake. The Fenghua ordering code (CG = C0G, 430 = 43 x 10^0
  pF, J = +/-5%, 500 = 50 V) decodes consistently with the listed specifications;
  the live page specification table is the primary evidence.
- Live JLC detail page (staged capture 2026-09-28) shows Extended (Promotional Extended),
  0603, 43 pF, 50 V, C0G, +/-5%, stock 8,736, minimum 1, full reel 4,000, available
  order qty 8,661, MSL 1. No datasheet PDF imported at intake; download is an integration-stage
  task (JLC lists https://jlc-prod-smt.oss-eu-central-1.aliyuncs.com/smtDataManualFile/8770988104809361408-C1670.pdf).
