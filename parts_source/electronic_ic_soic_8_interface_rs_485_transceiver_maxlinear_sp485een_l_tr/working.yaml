research_notes:
- 'The official JLC page lists Basic MaxLinear SP485EEN-L/TR (C6855): half-duplex
  RS-485 transceiver, 10 Mbps, +-15 kV ESD in SOIC-8; reconfirmed live 2026-10-02
  (stock 245,552).'
- Browser-downloaded the MaxLinear SP481E/SP485E datasheet (9 pages, REV 1.0.5) into
  this part; it anchors the SP485E SOIC-8 family.
- 'Pinout page 1: 1 = RO, 2 = RE, 3 = DE, 4 = DI, 5 = GND, 6 = A, 7 = B, 8 = VCC;
  Interface_UART:LTC2850xS8 matches pad-for-pad (SP3485CN extends the same master).
  No HandSoldering master for SOIC-8 narrow - hand_solder empty per the 2-asset rule.'
