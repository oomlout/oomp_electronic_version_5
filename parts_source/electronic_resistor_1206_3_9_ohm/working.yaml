    ohm preference exists to conflict with (C1419 is the first reviewed 1206 3.9 ohm
    value, ±5%). Existing electronic_resistor_0805_3_9_ohm is a different package,
    not a substitute; 1206 3.9 ohm E12-decimal value (39 x 0.1) sits outside the file
