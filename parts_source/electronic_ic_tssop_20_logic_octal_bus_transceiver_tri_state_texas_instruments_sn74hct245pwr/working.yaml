  into this part.
- Pin table generated from the KiCad 74xx:74HC245 master and cross-checked pad-for-pad
  (pin numbers and electrical types); no-connect pins filled to the 20-pin package
  count.
- Footprint Package_SO:TSSOP-20_4.4x6.5mm_P0.65mm verified present in the KiCad 10
  library.
