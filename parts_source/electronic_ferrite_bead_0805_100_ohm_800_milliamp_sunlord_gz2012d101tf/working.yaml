research_notes:
- 'The official JLC page lists Basic Sunlord GZ2012D101TF (C1015): 100 ohm at 100
  MHz, DCR 150 mOhm, 800 mA, 1 circuit, +-25%, -55 to +125 C; reconfirmed live 2026-09-30.'
- The Sunlord part specification is scoped to GZ2012D101TF exactly (scope, page 4)
  and its electrical table matches the JLC listing value for value.
- Non-polarized two-terminal chip; the standard built-in 0805 chip renderer draws
  the package from the verified dimensions above.
- Rated-current derating above +85 C applies only to beads rated over 1000 mA, so
  it does not apply to this 800 mA part.
