research_notes:
- Exact FH (Guangdong Fenghua Advanced Tech) C1930 / 1206F203M500NT purchasing variant;
  1206, 20 nF, 50 V, Y5V, ±20% verified against the staged live JLC capture 2026-09-28
  (stock 419, minimum 1, full reel 4,000, available order qty 419, MSL 1).
- 'Linked to the generic 1206 20 nF definition. IMPORTANT dielectric difference: the
  reviewed preference C1853 / 1206B203K500NT on the generic ID is from the same maker
  (FH) but X7R ±10%, far more stable than this Y5V ±20% SKU. It must never replace
  the X7R preference, and projects requiring X7R stability must not substitute this
  SKU. The registry allows one preferred code per ID; C1930 is recorded as its own
  exact variant ID.'
- No datasheet PDF imported at intake; download is an integration-stage task (JLC
  lists https://jlc-prod-smt.oss-eu-central-1.aliyuncs.com/smtDataManualFile/8770991795318865920-C1930.pdf).
