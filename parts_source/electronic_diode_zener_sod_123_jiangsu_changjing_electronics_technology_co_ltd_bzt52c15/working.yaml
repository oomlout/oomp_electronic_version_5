research_notes:
- 'The official JLC page lists Basic Jiangsu Changjing BZT52C15 (C2104): 15 V zener,
  500 mW, SOD-123; identity and ratings observed live at intake 2026-09-28.'
- 'Family batch 2026-10-04 over the shared Changjing BZT52C2V4-BZT52C43 datasheet
  (oomp_datasheet_common_with = electronic_diode_zener_sod_123_jiangsu_changjing_electronics_technology_co_ltd_bzt52c10):
  the ratings table pages 1-2 give the 15 V row and the package outline page 4 gives
  SOD-123 dimensions. Pin 1 = cathode (marked end), pin 2 = anode; KiCad D_SOD-123
  pad 1 is the cathode. Symbol Diode:BZT52Bxx is the only BZT52 symbol KiCad 10 ships
  - the B/C tolerance series share the same xx-template symbol graphics; the tolerance
  lives in the part number.'
